    {q:"Quieres saber si el tamaño de las patas mejora tu saltador. ¿Qué haces?", o:["Cambiar patas, velocidad y peso a la vez","Cambiar solo las patas y repetir las pruebas","Probar una sola vez"], a:1, f:"Una variable cada vez y varias repeticiones: así sabes qué ha funcionado."},
    {q:"¿Qué sensor usarías para que el robot se pare al ver la línea de meta?", o:["Sensor de fuerza","Sensor de color","Altavoz"], a:1, f:"El sensor de color detecta la línea en el suelo."},
    {q:"¿Qué ventaja tienen las patas frente a las ruedas?", o:["Son más rápidas en suelo liso","Se mueven mejor por terreno irregular","Gastan menos energía siempre"], a:1, f:"Las patas superan obstáculos, aunque son más lentas y complejas."}
  ]},
  p2ia:{titulo:"Repaso: inteligencia artificial", preguntas:[
    {q:"¿Qué tipo de IA existe hoy en día?", o:["Solo la IA débil o específica","La IA general","La superinteligencia"], a:0, f:"Toda la IA actual hace tareas concretas."},
    {q:"En el aprendizaje automático, ¿de qué aprende la máquina?", o:["De las reglas que escribe el programador una a una","De muchos ejemplos (datos)","De internet, sin ayuda"], a:1, f:"Encuentra patrones en ejemplos etiquetados."},
    {q:"Lo que la máquina ha aprendido después del entrenamiento se llama…", o:["Modelo","Algoritmo de búsqueda","Sensor"], a:0, f:"El modelo hace predicciones ante ejemplos nuevos."},
    {q:"¿Qué hace un árbol de decisión?", o:["Clasifica haciendo preguntas de sí o no","Dibuja árboles","Guarda fotos"], a:0, f:"Cada pregunta divide los casos hasta llegar a una respuesta."},
    {q:"Tu modelo reconoce bien tu estuche pero falla con el de tu compañero. ¿Qué le pasa?", o:["Está roto","Le faltan ejemplos variados","Necesita más batería"], a:1, f:"Si los datos no son variados, el modelo no generaliza."},
    {q:"¿Qué es un sesgo en IA?", o:["Un virus","Un error que hace que funcione peor para unos grupos que para otros","Un tipo de sensor"], a:1, f:"Suele venir de datos desequilibrados."},
    {q:"Una IA te da un dato con mucha seguridad. ¿Qué haces?", o:["Me lo creo: las máquinas no se equivocan","Lo compruebo en fuentes fiables","Lo comparto enseguida"], a:1, f:"La IA puede inventarse cosas y decirlas con total seguridad."},
    {q:"¿Cuál de estos NO usa inteligencia artificial?", o:["Un recomendador de series","Un interruptor de la luz","Un traductor automático"], a:1, f:"Un interruptor solo abre o cierra un circuito."}
  ]},
  p3prog:{titulo:"Repaso: lógica y programación", preguntas:[
    {q:"La regla «hay alguien Y está oscuro» se cumple cuando…", o:["Se cumple al menos una condición","Se cumplen las dos condiciones","No se cumple ninguna"], a:1, f:"Y solo es verdadero si todas las condiciones lo son."},
    {q:"La regla «hay humo O temperatura > 60 ºC» se cumple cuando…", o:["Se cumple al menos una condición","Se cumplen las dos","Nunca"], a:0, f:"O es verdadero si al menos una condición lo es."},
    {q:"Una alarma debe sonar si hay movimiento fuera del horario escolar. ¿Qué regla es correcta?", o:["Movimiento Y horario escolar","Movimiento Y NO horario escolar","Movimiento O horario escolar"], a:1, f:"NO invierte la condición del horario."},
    {q:"¿Cuántas filas tiene la tabla de verdad de una regla con tres condiciones?", o:["3","6","8"], a:2, f:"2 × 2 × 2 = 8 casos posibles."},
    {q:"¿Qué es mejor para guardar el umbral de 27 ºC que no cambia?", o:["Una constante","Un bucle","Un evento"], a:0, f:"Si el valor es fijo, usa una constante con nombre claro."},
    {q:"Python y JavaScript son lenguajes…", o:["De bajo nivel","De alto nivel","De bloques"], a:1, f:"Se parecen al lenguaje humano y se traducen al de la máquina."},
    {q:"Tu programa funciona pero enciende la luz de día. ¿Qué tipo de error es?", o:["De sintaxis","De semántica (de lógica)","De conexión"], a:1, f:"El programa se ejecuta, pero no hace lo que queríamos."},
    {q:"¿Qué ventaja tiene el simulador de MakeCode?", o:["Prueba el programa antes de enviarlo a la placa","Hace la placa más rápida","Sustituye a los sensores para siempre"], a:0, f:"Simular permite detectar errores sin montar nada."}
  ]},
  p3robot:{titulo:"Repaso: rovers y robots autónomos", preguntas:[
    {q:"¿Por qué un rover en Marte necesita ser autónomo?", o:["Porque es más barato","Porque las órdenes tardan minutos en llegar","Porque no hay gravedad"], a:1, f:"Entre 4 y 24 minutos según la posición de los planetas."},
    {q:"Una rueda de 5,6 cm de diámetro, ¿cuánto avanza en una vuelta?", o:["5,6 cm","Unos 17,6 cm","Unos 31 cm"], a:1, f:"P = π · d = 3,14 · 5,6 ≈ 17,6 cm."},
    {q:"«Avanza hasta que haya un obstáculo a 10 cm» es un control en…", o:["Lazo abierto","Lazo cerrado","Modo manual"], a:1, f:"El robot mide y corrige con sus sensores."},
    {q:"¿Qué sensor usarías para esquivar rocas?", o:["Distancia","Color","Fuerza"], a:0, f:"El sensor de distancia detecta obstáculos antes de chocar."},
    {q:"Al seguir una línea, el sensor ve blanco. ¿Qué hace el rover?", o:["Se para","Gira hacia la línea","Acelera recto"], a:1, f:"Corrige hacia el borde de la línea y avanza en zigzag."},
    {q:"¿Qué debe hacer un rover controlado a distancia si pierde la conexión?", o:["Seguir a toda velocidad","Detenerse por seguridad","Girar sin parar"], a:1, f:"Es una medida básica de seguridad en robótica."},
    {q:"Un robot es fiable cuando…", o:["Funciona una vez","Cumple la misión casi siempre en pruebas repetidas","Es muy rápido"], a:1, f:"La eficacia se mide repitiendo pruebas y calculando el porcentaje de éxito."},
    {q:"Añadir más sensores al rover…", o:["Siempre lo mejora","Añade peso, consumo y complejidad","No tiene ningún efecto"], a:1, f:"Hay que elegir solo los módulos que la misión necesita."}
  ]},
  p3ia:{titulo:"Repaso: IA, datos y ética", preguntas:[
    {q:"Un sistema basado en reglas SI… ENTONCES… escritas por expertos es…", o:["Un sistema experto","Una red neuronal","Aprendizaje por refuerzo"], a:0, f:"Guarda conocimiento en reglas, pero no aprende solo."},
    {q:"Teachable Machine entrena con ejemplos etiquetados. Es aprendizaje…", o:["Supervisado","No supervisado","Por refuerzo"], a:0, f:"Cada ejemplo lleva su etiqueta."},
    {q:"¿Qué muestra una matriz de confusión?", o:["Qué clases se confunden entre sí","La velocidad del modelo","Cuántas fotos hay"], a:0, f:"Compara la clase real con la que dijo el modelo."},
    {q:"El modelo acierta 18 de 20 pruebas. ¿Cuál es su precisión?", o:["18 %","90 %","20 %"], a:1, f:"18 / 20 = 0,9 = 90 %."},
    {q:"¿Por qué no se debe probar un modelo con las mismas imágenes del entrenamiento?", o:["Porque daría un resultado demasiado optimista","Porque se borran","Porque es más lento"], a:0, f:"Hay que medir con datos nuevos, como en el uso real."},
    {q:"Tu modelo funciona peor con manos más pequeñas. ¿Qué haces?", o:["Nada","Añadir ejemplos variados y volver a medir","Usar solo manos grandes"], a:1, f:"Probar con personas diversas y corregir los datos es diseñar con inclusión."},
    {q:"Ver un mueble virtual en tu salón a través del iPad es…", o:["Realidad virtual","Realidad aumentada","Un gemelo digital"], a:1, f:"La RA añade objetos digitales al mundo real."},
    {q:"Un prototipo de clase que reconoce signos básicos…", o:["Sustituye a un intérprete","Ayuda a entender las posibilidades de la IA, pero tiene límites","No sirve para nada"], a:1, f:"Hay que explicar siempre los límites de la tecnología."}
  ]},
  entorno:{titulo:"Repaso: mi entorno digital", preguntas:[
    {q:"¿Cuál de estos es software?", o:["El teclado","El navegador","La impresora"], a:1, f:"El navegador es un programa; los otros son hardware."},
    {q:"Una pantalla táctil es un periférico de…", o:["Entrada","Salida","Entrada y salida"], a:2, f:"Muestra información (salida) y recibe tus toques (entrada)."},
    {q:"¿Qué puerto usarías para conectar el ordenador a un proyector con imagen y sonido digital?", o:["HDMI","Jack de 3,5 mm","Ethernet"], a:0, f:"HDMI transmite imagen y sonido digital."},
    {q:"¿Cuántos bits tiene un byte?", o:["8","100","1024"], a:0, f:"1 byte = 8 bits."},
    {q:"¿Qué hace el DNS?", o:["Protege de los virus","Traduce nombres de dominio a direcciones IP","Acelera la conexión"], a:1, f:"Gracias al DNS escribimos nombres en lugar de números."},
    {q:"En una hoja de cálculo, ¿cuál es una fórmula correcta para sumar de B2 a B10?", o:["SUMA B2-B10","=SUMA(B2:B10)","B2+...+B10"], a:1, f:"Las fórmulas empiezan por «=» y los rangos se indican con dos puntos."},
    {q:"¿Qué diferencia hay entre navegador y buscador?", o:["Ninguna","El navegador muestra las páginas; el buscador las encuentra","El buscador se instala en el ordenador"], a:1, f:"Safari es un navegador; Google es un buscador."},
    {q:"¿Qué es el internet de las cosas?", o:["Una red social","Objetos cotidianos conectados a Internet","Una tienda online"], a:1, f:"Relojes, altavoces, coches o electrodomésticos conectados."}
  ]},
  mecanismos:{titulo:"Repaso: mecanismos, transmisión y electricidad", preguntas:[
    {q:"Un engranaje de 12 dientes mueve a uno de 36. ¿Cuál es la relación de transmisión?", o:["3","1/3","12"], a:1, f:"i = Z motriz / Z conducido = 12/36 = 1/3. Es un reductor."},
    {q:"En el caso anterior, si el motor gira a 120 rpm, ¿a cuánto gira el eje conducido?", o:["40 rpm","360 rpm","120 rpm"], a:0, f:"n conducido = n motriz · i = 120 · 1/3 = 40 rpm."},
    {q:"Tu vehículo no sube la rampa. ¿Qué transmisión deberías usar?", o:["Un multiplicador","Un reductor","Da igual"], a:1, f:"El reductor gira más despacio pero con más fuerza."},
    {q:"¿En qué sentido giran dos engranajes que encajan entre sí?", o:["En el mismo","En sentidos contrarios","Depende de los dientes"], a:1, f:"Los engranajes en contacto giran en sentidos opuestos; las poleas con correa, en el mismo."},
    {q:"Para levantar 20 kg a 10 cm del apoyo de una palanca, haces fuerza a 40 cm. ¿Cuánta fuerza necesitas?", o:["80 kg","5 kg","20 kg"], a:1, f:"F · d = R · r → F · 40 = 20 · 10 → F = 5 kg."},
    {q:"Un tren tiene dos pares con i = 1/2 y i = 1/3. ¿Cuál es la relación total?", o:["1/6","5/6","1/5"], a:0, f:"La relación total es el producto: 1/2 · 1/3 = 1/6."},
    {q:"¿Qué mecanismo transforma el giro en movimiento recto, como en la dirección de un coche?", o:["Biela-manivela","Piñón y cremallera","Leva"], a:1, f:"El piñón gira y desplaza la cremallera en línea recta."},
    {q:"¿Qué significa que un vehículo sea más eficiente energéticamente?", o:["Que es más rápido","Que hace el mismo trabajo gastando menos energía","Que pesa más"], a:1, f:"Eficiencia: el mismo resultado con menos energía."},
    {q:"Una pila de 5 V alimenta una resistencia de 100 Ω. ¿Qué intensidad circula?", o:["500 A","0,05 A","20 A"], a:1, f:"I = V / R = 5 / 100 = 0,05 A (50 mA)."},
    {q:"En casa, si se funde una bombilla, las demás siguen encendidas. ¿Cómo están conectadas?", o:["En serie","En paralelo","No están conectadas"], a:1, f:"En paralelo cada receptor tiene su propio camino."}
  ]},
  estructuras:{titulo:"Repaso: cargas, esfuerzos y estructuras", preguntas:[
    {q:"El cable de un ascensor sostiene la cabina. ¿Qué esfuerzo sufre?", o:["Compresión","Tracción","Torsión"], a:1, f:"Las cargas tiran del cable en sentidos contrarios: tiende a alargarse."},
    {q:"Un pilar soporta el peso del edificio. ¿Qué esfuerzo sufre?", o:["Compresión","Flexión","Cortante"], a:0, f:"Las cargas empujan el pilar hacia dentro: tiende a acortarse y ensancharse."},
    {q:"Una estantería se curva con el peso de los libros. ¿Qué esfuerzo es?", o:["Torsión","Flexión","Tracción"], a:1, f:"En la flexión, una parte se comprime y la otra se estira."},
    {q:"¿Qué esfuerzo sufre una llave al girarla en la cerradura?", o:["Torsión","Cortante","Compresión"], a:0, f:"Las cargas tienden a retorcer la llave."},
    {q:"¿Por qué se usan triángulos en las estructuras?", o:["Porque son más bonitos","Porque son la única figura indeformable","Porque gastan más material"], a:1, f:"Un triángulo de barras no se deforma; un cuadrado sí."},
    {q:"¿Qué significa que una estructura sea rígida?", o:["Que no se rompe","Que no vuelca","Que no se deforma de manera apreciable"], a:2, f:"Resistente: no se rompe. Estable: no vuelca. Rígida: no se deforma."},
    {q:"Un puente pesa 200 g y soporta 10 000 g. Otro pesa 100 g y soporta 4000 g. ¿Cuál es más eficiente?", o:["El primero (0,02)","El segundo (0,025)","Son iguales"], a:0, f:"Eficiencia = peso ÷ carga máxima. Cuanto menor, mejor: 200/10 000 = 0,02 frente a 100/4000 = 0,025."},
    {q:"Las torres eléctricas y las grúas son estructuras…", o:["Masivas","Trianguladas","Neumáticas"], a:1, f:"Están formadas por barras unidas en triángulos."}
  ]},
  iaapp:{titulo:"Repaso: apps web e IA", preguntas:[
    {q:"¿Qué lenguaje define la estructura de una página: títulos, textos y botones?", o:["CSS","HTML","JavaScript"], a:1, f:"HTML es la estructura; CSS, el aspecto; JavaScript, el comportamiento."},
    {q:"Quieres que el botón sea verde y más grande. ¿Qué parte del código cambias?", o:["El CSS","El HTML","El JavaScript"], a:0, f:"Colores y tamaños se definen en el CSS."},
    {q:"Al pulsar «Calcular» no pasa nada. ¿Dónde está probablemente el fallo?", o:["En el CSS","En el JavaScript","En el título"], a:1, f:"Lo que la app hace al pulsar un botón lo programa el JavaScript."},
    {q:"¿Por qué una app web es multiplataforma?", o:["Porque solo funciona en iPad","Porque funciona en el navegador de cualquier dispositivo","Porque la ha hecho una IA"], a:1, f:"Basta con un navegador: iPad, móvil, Windows, Mac…"},
    {q:"¿Cuál es el mejor mensaje para que la IA corrija un fallo?", o:["No funciona, arréglalo","Al pulsar Calcular con la casilla vacía aparece NaN; quiero que avise de que falta el dato","Hazlo otra vez mejor"], a:1, f:"Cuanto más concreto describas el fallo, mejor lo corregirá."},
    {q:"¿Qué es mejor al pedir una app a la IA?", o:["Pedir todas las funciones a la vez","Pedir lo básico y añadir funciones de una en una","No dar detalles para que sea creativa"], a:1, f:"Avanzar por pasos facilita encontrar y corregir errores."},
    {q:"El código que ha generado la IA parece perfecto. ¿Qué haces?", o:["Lo entrego sin probar","Lo pruebo con casos normales y casos raros","Pido otro por si acaso"], a:1, f:"La IA también se equivoca. Probar es parte del trabajo."},
    {q:"En la documentación de tu herramienta…", o:["No hace falta decir que usaste IA","Indicas qué partes hizo la IA y cuáles hiciste tú","Dices que lo has hecho todo tú"], a:1, f:"Atribuir el trabajo con honestidad es parte del uso ético de la IA."}
  ]},
  mayores:{titulo:"Repaso: compras y trámites seguros", preguntas:[
    {q:"Tu abuela tiene móvil con Internet, pero no sabe pedir cita médica con él. ¿Qué tipo de brecha digital es?", o:["Brecha de acceso","Brecha de uso","No es brecha digital"], a:1, f:"Tiene acceso, pero le faltan habilidades para usarlo: brecha de uso."},
    {q:"Una tienda online tiene el candado (https) en la dirección. ¿Significa que es fiable?", o:["Sí, siempre","No: solo indica que la conexión está cifrada","Solo si es una tienda española"], a:1, f:"Las tiendas falsas también usan https. Hay que comprobar el aviso legal, las opiniones y los precios."},
    {q:"¿Cuál es una señal típica de tienda falsa?", o:["Precios muy por debajo de lo normal","Tener aviso legal","Aceptar varios métodos de pago"], a:0, f:"Los chollos imposibles son el cebo más habitual."},
    {q:"¿Qué forma de pago es más segura en una tienda online que no conoces bien?", o:["Transferencia bancaria","Bizum al vendedor","Tarjeta virtual o de prepago"], a:2, f:"Con una tarjeta virtual o de prepago limitas lo que pueden robarte. Transferencias y Bizum a desconocidos son muy difíciles de recuperar."},
    {q:"Has comprado unas zapatillas online en una tienda europea y no te gustan. En general, ¿cuánto tiempo tienes para devolverlas sin dar explicaciones?", o:["24 horas","14 días","No se pueden devolver"], a:1, f:"Es el derecho de desistimiento en las compras a distancia en la UE."},
    {q:"¿Qué es Cl@ve?", o:["Un antivirus","Un sistema para identificarte ante la Administración por Internet","Una red social del Gobierno"], a:1, f:"Permite hacer trámites online identificándote con el móvil."},
    {q:"Te llega un SMS de «tu banco» pidiendo el código que te acaba de llegar. ¿Qué haces?", o:["Se lo doy, es mi banco","No lo doy nunca: los bancos no piden códigos ni contraseñas","Se lo doy si el mensaje tiene el logo"], a:1, f:"Ni bancos ni Administración piden nunca contraseñas o códigos por SMS, correo o teléfono."},
    {q:"Al enseñar a una persona mayor a usar el móvil, ¿qué es lo más eficaz?", o:["Hacerlo yo rápido para que no se agobie","Explicar, dejar que lo haga y repetir con paciencia","Darle un manual largo"], a:1, f:"Se aprende haciendo. Si lo haces tú, no aprenderá a hacerlo sola."}
  ]},
  bulos:{titulo:"¿Bulo o verdad?", preguntas:[
    {q:"¿Qué diferencia hay entre desinformación e información errónea?", o:["Ninguna","La desinformación se crea a propósito para engañar; la errónea se comparte por error","La información errónea siempre es más grave"], a:1, f:"La clave es la intención: la desinformación busca engañar."},
    {q:"Un mensaje te provoca mucha rabia y te pide que lo reenvíes a todos tus contactos. ¿Qué haces?", o:["Lo reenvío rápido","Paro y compruebo antes de compartir","Lo reenvío solo a mi familia"], a:1, f:"Las emociones fuertes y la urgencia son señales de alarma típicas de los bulos."},
    {q:"Quieres saber si una foto que circula es de verdad de lo que dice. ¿Qué herramienta usas?", o:["Una búsqueda inversa de imágenes","Un antivirus","Un editor de fotos"], a:0, f:"La búsqueda inversa (Google Lens, TinEye) muestra dónde y cuándo apareció antes la imagen."},
    {q:"¿Qué es un deepfake?", o:["Un virus informático","Un contenido creado o manipulado con IA para que parezca real","Una noticia antigua"], a:1, f:"Los deepfakes pueden ser vídeos, imágenes o audios."},
    {q:"¿Cuál de estas puede ser una señal de imagen generada con IA?", o:["Que tenga buena luz","Manos con dedos de más o textos ilegibles","Que sea en color"], a:1, f:"Las manos, los textos, las sombras y los reflejos suelen delatar a la IA."},
    {q:"Una IA te da una cita textual de un científico con su fuente. ¿Qué haces?", o:["La copio, la IA no se equivoca","Compruebo que la cita y la fuente existen de verdad","La cambio un poco para que no se note"], a:1, f:"Las IA pueden «alucinar» e inventarse citas y fuentes."},
    {q:"¿Qué es el sesgo de confirmación?", o:["Creer más lo que encaja con lo que ya pensamos","Confirmar una noticia con dos fuentes","Un error de los ordenadores"], a:0, f:"Por eso hay que dudar también de lo que nos gusta oír."},
    {q:"¿Cuál de estos es un verificador de noticias español?", o:["Maldita.es","Wikipedia","YouTube"], a:0, f:"Maldita.es, Newtral y EFE Verifica se dedican a desmentir bulos."}
  ]},
  planos:{titulo:"¿Qué plano es?", preguntas:[
    {q:"Se ve a la persona desde la cabeza hasta las rodillas.", o:["Plano medio","Plano americano","Plano entero"], a:1, f:"El plano americano corta a la altura de las rodillas."},
    {q:"Un paisaje enorme en el que el personaje es casi un punto.", o:["Gran plano general","Plano general","Plano cenital"], a:0, f:"El gran plano general sitúa al espectador en un espacio muy amplio."},
    {q:"Solo vemos la cara del personaje, de la frente a la barbilla.", o:["Primer plano","Plano detalle","Primerísimo primer plano"], a:2, f:"El PPP muestra solo el rostro y transmite emociones intensas."},
    {q:"La cámara está por debajo del personaje y lo hace parecer poderoso.", o:["Picado","Contrapicado","Cenital"], a:1, f:"El contrapicado engrandece al personaje."},
    {q:"Vemos la cara y los hombros de una persona que llora.", o:["Primer plano","Plano medio","Plano general"], a:0, f:"El primer plano acerca al espectador a la emoción."},
    {q:"La cámara mira desde arriba a un personaje que se siente perdido.", o:["Contrapicado","Picado","Normal"], a:1, f:"El picado empequeñece al personaje y lo hace parecer vulnerable."},
    {q:"Vemos solo una mano que gira el pomo de una puerta.", o:["Plano detalle","Primer plano","Plano medio corto"], a:0, f:"El plano detalle llama la atención sobre algo concreto."},
    {q:"Dos personajes conversan y los vemos de la cintura para arriba.", o:["Plano americano","Plano medio","Plano entero"], a:1, f:"El plano medio corta por la cintura: ideal para diálogos."},
    {q:"La cámara está justo encima de una mesa, mirando en vertical.", o:["Picado","Cenital","Gran plano general"], a:1, f:"El plano cenital es la vista de pájaro, en vertical."},
    {q:"¿Qué música puedes usar en tu cortometraje?", o:["Cualquier canción de Spotify","Música libre de derechos o con licencia que lo permita","Cualquiera, si es menos de 30 segundos"], a:1, f:"Usar música protegida sin permiso vulnera los derechos de autor, aunque sea un fragmento."}
  ]},
  seguridad4:{titulo:"Repaso: seguridad en la red", preguntas:[
    {q:"¿Qué es la huella digital?", o:["Tu huella dactilar para desbloquear el móvil","El rastro de información que dejas en Internet","Un tipo de contraseña"], a:1, f:"Todo lo que publicas, comentas o buscas deja un rastro: tu huella digital."},
    {q:"Te llega un SMS de «tu banco» con un enlace para «verificar tu cuenta en 24 horas». ¿Qué es probablemente?", o:["Smishing","Una actualización","Verificación en dos pasos"], a:0, f:"Es phishing por SMS (smishing). La prisa y el enlace son señales de alarma."},
    {q:"¿Qué es la verificación en dos pasos?", o:["Escribir la contraseña dos veces","Pedir, además de la contraseña, un código que llega a otro dispositivo","Tener dos cuentas"], a:1, f:"Aunque roben tu contraseña, sin el código no podrán entrar."},
    {q:"¿Cuál es la contraseña más segura?", o:["Maria2010","qwerty123","MiPerro-Come-7-Pizzas!"], a:2, f:"Las frases largas con símbolos y números son fuertes y fáciles de recordar."},

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderNav(current){
  $("#nav").innerHTML = `<a href="#inicio" ${current==="inicio"?'aria-current="page"':''}>Inicio</a>` +
    MATERIAS.map(m => `<a href="#${m.id}" style="--sub:${m.color}" ${current===m.id?'aria-current="page"':''}>${esc(m.corto||m.nombre)} ${esc(m.nivel)}</a>`).join("");
}

function renderHome(){
  $("#main").innerHTML = `
    <div class="home-intro">
      <h1>Elige tu materia</h1>
      <p>Aquí tienes los contenidos, actividades, vídeos, fichas y criterios de evaluación de cada asignatura.</p>
    </div>
    <div class="grid">
      ${MATERIAS.map(m => `
        <a class="subj-card" href="#${m.id}" style="--sub:${m.color}">
          <span class="lvl">${esc(m.nivel)}</span>
          <h2>${esc(m.nombre)}</h2>
          <p>${esc(m.intro)}</p>
        </a>`).join("")}
    </div>`;
}

function itemAction(it){
  if(it.tipo==="interactiva") return `<button class="btn" data-quiz="${it.quiz}">Empezar</button>`;
  if(it.url) return `<a class="btn ghost" href="${esc(it.url)}" target="_blank" rel="noopener">${it.tipo==="video"?"Ver":"Abrir"}</a>`;
  if(it.tipo==="ficha") return `<span class="pending">Disponible pronto</span>`;
  return "";
}

function critTitle(m,code){
  if(!m.competencias) return "";
  for(const ce of m.competencias) for(const [k,v] of ce.c) if(k===code) return v;
  return "";
}
function renderCompetencias(m){
  return `
    <section class="unit" id="criterios-${m.id}">
      <div class="unit-head"><h2>Criterios de evaluación</h2></div>
      <p class="desc">Lo que se evalúa en esta materia, según el ${esc(m.norma)}. Están explicados con palabras sencillas.</p>
      <div class="ces">
        ${m.competencias.map(ce=>`
          <details class="ce" open>
            <summary><span class="ce-n">CE${ce.n}</span><span><b>${esc(ce.t)}</b><span class="ce-d">${esc(ce.d)}</span></span></summary>
            <ul class="crit-list">${ce.c.map(([k,v])=>`<li><span class="code">${k}</span><span>${esc(v)}</span></li>`).join("")}</ul>
          </details>`).join("")}
      </div>
    </section>`;
}
function plural(n,a,b){ return n+" "+(n===1?a:b); }
function itemsList(items){
  return `<ul class="items">
    ${items.map(it=>`
      <li class="item">
        <span class="tag" style="--c:${TIPOS[it.tipo].c}">${TIPOS[it.tipo].label}</span>
        <div><div class="t">${esc(it.t)}</div>${it.s?`<div class="s">${esc(it.s)}</div>`:""}</div>
        <div>${itemAction(it)}</div>
      </li>`).join("")}
  </ul>`;
}
function chips(m,list){
  return `<div class="chips"><span class="tag-plain">Criterios que trabajamos</span>${list.map(c=>`<span class="chip" title="${esc(critTitle(m,c))}">${c}</span>`).join("")}</div>`;
}
function renderSubject(m){
  const crit = m.competencias
    ? `<ol class="ce-short">${m.competencias.map(ce=>`<li><b>CE${ce.n}</b> ${esc(ce.t)}</li>`).join("")}</ol>
       <p class="note" style="margin-top:10px"><a href="#criterios-${m.id}" data-jump="criterios-${m.id}">Ver todos los criterios</a></p>`
    : m.criterios
    ? `<ol>${m.criterios.map(c=>`<li>${esc(c)}</li>`).join("")}</ol>`
    : `<p class="note">Los criterios de evaluación de esta materia se publicarán aquí.</p>`;
  const pesos = m.pesos ? `
    <div class="box">
      <h3>Cómo se calcula la nota</h3>
      ${m.pesosEjemplo?'<p class="note">Reparto provisional.</p>':''}
      <div class="weights">
        ${m.pesos.map(([n,p])=>`<div class="w-row"><span>${esc(n)}</span><b>${p}%</b><span class="w-bar"><i style="width:${p}%"></i></span></div>`).join("")}
      </div>
    </div>` : "";
  const pres = m.presentacion ? `
    <div class="box">
      <h3>Sobre la materia</h3>
      <p class="note" style="margin-bottom:10px">${esc(m.presentacion.texto)}</p>
      <ol class="blocks">${m.presentacion.bloques.map(b=>`<li>${esc(b)}</li>`).join("")}</ol>
    </div>` : "";
  $("#main").innerHTML = `
    <div style="--sub:${m.color}">
      <div class="subj-head">
        <span class="lvl">${esc(m.nivel)}</span>
        <h1>${esc(m.nombre)}</h1>
        ${m.presentacion?`<blockquote class="quote">${esc(m.presentacion.cita)}</blockquote>`:`<p>${esc(m.intro)}</p>`}
      </div>
      <div class="layout">
        <div class="units">
          ${m.unidades.map((u,i)=> u.id ? `
            <a class="unit unit-link" href="#${u.id}">
              <div class="unit-head"><span class="unit-num">${u.complementario?"Complementario":"Tema "+(i+1)}</span>${u.complementario?"":`<span class="eti">${esc(u.etiqueta||"")}</span>`}</div>
              <h2>${esc(u.titulo)}</h2>
              <p class="desc">${esc(u.desc)}</p>
              <div class="meta">
                ${u.tareas?`<span>${plural(u.tareas.length,"tarea","tareas")}</span>`:""}
                ${u.anexos?`<span>${plural(u.anexos.length,"anexo de evaluación","anexos de evaluación")}</span>`:""}
                ${u.items&&u.items.some(x=>x.tipo==="interactiva")?`<span>${plural(u.items.filter(x=>x.tipo==="interactiva").length,"ficha interactiva","fichas interactivas")}</span>`:""}
                <span class="go">Abrir tema →</span>
              </div>
            </a>` : `
            <section class="unit">
              <div class="unit-head"><span class="unit-num">Unidad ${i+1}</span><h2>${esc(u.titulo)}</h2></div>
              <p class="desc">${esc(u.desc)}</p>
              ${u.criterios?chips(m,u.criterios):""}
              ${itemsList(u.items)}
            </section>`).join("")}
          ${m.unidades.length?"":`<section class="unit"><p class="desc">Los temas de esta materia se publicarán aquí muy pronto.</p></section>`}
          ${m.competencias?renderCompetencias(m):""}
        </div>
        <aside>
          ${pres}
          <div class="box"><h3>Criterios de evaluación</h3>${crit}</div>
          ${pesos}
        </aside>
      </div>
    </div>`;
}

function renderUnit(m,u){
  const idx = m.unidades.indexOf(u);
  const prev = m.unidades[idx-1], next = m.unidades[idx+1];
  const toc = [
    u.teoria&&["teoria","Teoría"], u.saberes&&["saberes","Qué vamos a aprender"],
    u.tareas&&["tareas","Tareas"], u.items&&u.items.length&&["recursos","Recursos y repaso"],
    u.anexos&&["anexos","Cómo se evalúa"]].filter(Boolean);
  const tareaHtml = t => `
    <li class="task" id="${u.id}-t${t.n}">
      <span class="task-n">${t.n}</span>
      <div class="task-body">
        <h3>${esc(t.t)}</h3>
        ${t.html}
        ${t.enlaces?`<div class="links">${t.enlaces.map(([l,h])=>`<a class="btn ghost" href="${esc(h)}" target="_blank" rel="noopener">${esc(l)} ↗</a>`).join("")}</div>`:""}
        ${(t.evalua||t.entrega||t.pendiente||t.duracion)?`<div class="task-meta">
          ${t.duracion?`<span class="pill">Duración: ${esc(t.duracion)}</span>`:""}
          ${t.entrega?`<span class="pill">Entrega: ${esc(t.entrega)}</span>`:""}
          ${t.evalua?`<a class="pill pill-link" href="#${t.evalua}-${u.id}" data-jump="${t.evalua}-${u.id}">Se evalúa con: ${esc(ANEXOS[t.evalua].titulo.split(".")[0])}</a>`:""}
          ${t.pendiente?`<span class="pending">${esc(t.pendiente)}</span>`:""}
        </div>`:""}
      </div>
    </li>`;
  $("#main").innerHTML = `
    <div style="--sub:${m.color}">
      <a class="back" href="#${m.id}">← ${esc(m.nombre)} ${esc(m.nivel)}</a>
      <div class="subj-head">
        <span class="lvl">${esc(u.etiqueta||("Tema "+(idx+1)))}</span>
        <h1>${esc(u.titulo)}</h1>
        ${u.subtitulo?`<p class="sub">${esc(u.subtitulo)}</p>`:""}
        ${u.cita?`<blockquote class="quote">${esc(u.cita[0])}${u.cita[1]?`<cite>${esc(u.cita[1])}</cite>`:""}</blockquote>`:""}
        <p>${esc(u.desc)}</p>
      </div>
      <div class="layout">
        <div class="units">
          ${u.teoria?`<section class="unit prose" id="teoria-${u.id}"><h2>Teoría</h2>${u.teoria}</section>`:""}
          ${u.saberes?`<section class="unit" id="saberes-${u.id}"><h2>Qué vamos a aprender</h2>${u.bloque?`<p class="desc">${esc(u.bloque)}</p>`:""}<ul class="plain">${u.saberes.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></section>`:""}
          ${u.tareas?`<section class="unit" id="tareas-${u.id}"><h2>Tareas</h2><ol class="tasks">${u.tareas.map(tareaHtml).join("")}</ol></section>`:""}
          ${u.items&&u.items.length?`<section class="unit" id="recursos-${u.id}"><h2>Recursos y repaso</h2>${itemsList(u.items)}</section>`:""}
          ${u.evaluacionNota?`<section class="unit"><h2>Cómo se evalúa</h2><p class="desc">${esc(u.evaluacionNota)}</p></section>`:""}
          ${u.anexos?`<section class="unit" id="anexos-${u.id}"><h2>Cómo se evalúa</h2>
            ${u.anexos.map(k=>{const a=ANEXOS[k]; return `
              <div class="anexo" id="${k}-${u.id}">
                <h3>${esc(a.titulo)}</h3><p class="desc">Se usa en: ${esc(a.para)}.</p>
                ${a.html}
                ${a.enlaces?`<div class="links">${a.enlaces.map(([l,h])=>`<a class="btn ghost" href="${esc(h)}" target="_blank" rel="noopener">${esc(l)} ↗</a>`).join("")}</div>`:""}
              </div>`}).join("")}
          </section>`:""}
          ${!u.tareas&&!u.teoria&&!(u.items&&u.items.length)?`<section class="unit"><p class="desc">Contenido en preparación.</p></section>`:""}
          <div class="pager">
            ${prev&&prev.id?`<a class="btn ghost" href="#${prev.id}">← ${esc(prev.titulo)}</a>`:"<span></span>"}
            ${next&&next.id?`<a class="btn ghost" href="#${next.id}">${esc(next.titulo)} →</a>`:""}
          </div>
        </div>
        <aside>
          ${toc.length>1?`<div class="box"><h3>En este tema</h3><ul class="toc">${toc.map(([k,l])=>`<li><a href="#${k}-${u.id}" data-jump="${k}-${u.id}">${l}</a></li>`).join("")}</ul></div>`:""}
          ${u.producto?`<div class="box"><h3>Producto final</h3><p class="note">${esc(u.producto)}</p></div>`:""}
          ${u.criterios?`<div class="box"><h3>Criterios que trabajamos</h3><ul class="crit-mini">${u.criterios.map(c=>`<li><span class="code">${c}</span><span>${esc(critTitle(m,c))}</span></li>`).join("")}</ul></div>`:""}
        </aside>
      </div>
    </div>`;
}

function route(){
  const id = (location.hash||"#inicio").slice(1);
  if(id==="comprobar"){ renderNav(""); renderCheck(); window.scrollTo(0,0); return; }
  let m = MATERIAS.find(x=>x.id===id), u = null;
  if(!m) for(const mm of MATERIAS){ const f=mm.unidades.find(x=>x.id===id); if(f){ m=mm; u=f; break; } }
  renderNav(m?m.id:"inicio");
  if(u) renderUnit(m,u); else if(m) renderSubject(m); else renderHome();
  window.scrollTo(0,0);
}

const EPOCH = Date.UTC(2026,0,1);
function cyrb53(str, seed=0){
  let h1=0xdeadbeef^seed, h2=0x41c6ce57^seed;
  for(let i=0;i<str.length;i++){ const c=str.charCodeAt(i); h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 4294967296*(2097151&h2)+(h1>>>0);
}
function normName(n){ return String(n).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9ñ ]/g,"").replace(/\s+/g," ").trim(); }
function quizId(key){ return (cyrb53(key)%1296).toString(36).toUpperCase().padStart(2,"0"); }
function makeCode(key, score, total, name, when){
  const mins = Math.floor((when-EPOCH)/60000);
  const payload = quizId(key) + score.toString(36).toUpperCase() + total.toString(36).toUpperCase() + mins.toString(36).toUpperCase().padStart(6,"0");
  const sig = cyrb53(payload+"|"+normName(name)+"|"+SAL).toString(36).toUpperCase().padStart(5,"0").slice(-5);
  const raw = payload + sig;
  return raw.match(/.{1,5}/g).join("-");
}
function checkCode(code, name){
  const raw = String(code).toUpperCase().replace(/[^0-9A-Z]/g,"");
  if(raw.length!==15) return {ok:false, msg:"El código debe tener 15 caracteres (tres grupos de 5)."};
  const payload = raw.slice(0,10), sig = raw.slice(10);
  const expected = cyrb53(payload+"|"+normName(name)+"|"+SAL).toString(36).toUpperCase().padStart(5,"0").slice(-5);
  const qid = payload.slice(0,2);
  const key = Object.keys(QUIZZES).find(k=>quizId(k)===qid);
  const score = parseInt(payload[2],36), total = parseInt(payload[3],36);
  const when = new Date(EPOCH + parseInt(payload.slice(4),36)*60000);
  if(sig!==expected) return {ok:false, msg:"El código no es válido para ese nombre: o el nombre no está escrito igual que en el informe, o el informe ha sido modificado."};
  return {ok:true, titulo: key?QUIZZES[key].titulo:"Ficha desconocida", score, total, when};
}
function fmtDate(d){ return d.toLocaleString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}); }
function savedName(){ try{ return localStorage.getItem("aula-nombre")||""; }catch(e){ return ""; } }
function saveName(n){ try{ localStorage.setItem("aula-nombre",n); }catch(e){} }

function openQuiz(key){
  const quiz = QUIZZES[key]; if(!quiz) return;
  qs = {key, quiz, i:0, ok:0, fallos:[], lastFocus:document.activeElement, nombre:""};
  $("#dialog").classList.remove("wide");
  $("#overlay").classList.add("open");
  drawStart();
}
function drawStart(){
  $("#dialog").innerHTML = head() + `
    <p style="margin:0"><b>Ficha de repaso.</b> Sirve para comprobar lo que sabes. Escribe tu nombre y apellidos: al terminar obtendrás un informe con un código de verificación para entregarlo por Teams.</p>
    <form id="name-form" class="name-form">
      <label for="alumno">Nombre y apellidos</label>
      <input id="alumno" name="alumno" autocomplete="name" required value="${esc(savedName())}">
      <button class="btn" type="submit">Empezar</button>
    </form>`;
  $("#alumno").focus();
}
function closeQuiz(){
  $("#overlay").classList.remove("open");
  if(qs && qs.lastFocus) qs.lastFocus.focus();
  qs = null;
}
function head(){
  return `<div class="dialog-head"><h2 id="dlg-title">${esc(qs.quiz?qs.quiz.titulo:"")}</h2><button class="close" id="close-btn">Cerrar</button></div>`;
}
function drawQuestion(){
  const p = qs.quiz.preguntas[qs.i], n = qs.quiz.preguntas.length;
  $("#dialog").innerHTML = head() + `
    <div class="progress">${esc(qs.nombre)} · Pregunta ${qs.i+1} de ${n} · Aciertos: ${qs.ok}</div>
    <div class="q">${esc(p.q)}</div>
    <div class="opts">${p.o.map((o,j)=>`<button class="opt" data-j="${j}">${esc(o)}</button>`).join("")}</div>
    <p class="feedback" id="fb"></p>
    <div><button class="btn" id="next-btn" hidden>${qs.i+1<n?"Siguiente":"Ver resultado"}</button></div>`;
  $("#dialog .opt").focus();
}
function answer(j){
  const p = qs.quiz.preguntas[qs.i];
  document.querySelectorAll("#dialog .opt").forEach((b,k)=>{
    b.disabled = true;
    if(k===p.a) b.classList.add("right");
    else if(k===j) b.classList.add("wrong");
  });
  const good = j===p.a; if(good) qs.ok++; else qs.fallos.push(qs.i+1);
  const fb = $("#fb"); fb.classList.add("show");
  fb.innerHTML = `<strong style="color:var(${good?"--ok":"--bad"})">${good?"¡Correcto!":"No es esa."}</strong> ${esc(p.f)}`;
  const nb = $("#next-btn"); nb.hidden = false; nb.focus();
}
function next(){
  qs.i++;
  if(qs.i < qs.quiz.preguntas.length) return drawQuestion();
  const n = qs.quiz.preguntas.length, when = new Date();
  const code = makeCode(qs.key, qs.ok, n, qs.nombre, when.getTime());
  const nota = (qs.ok/n*10).toFixed(1).replace(".",",");
  qs.informe = `INFORME · FICHA DE REPASO · Aula de Rubén\nAlumno/a: ${qs.nombre}\nFicha: ${qs.quiz.titulo}\nResultado: ${qs.ok}/${n} (nota ${nota})\nFecha: ${fmtDate(when)}\nCódigo de verificación: ${code}`;
  $("#dialog").innerHTML = head() + `
    <div class="report" id="report">
      <div class="report-top"><span>Informe · Ficha de repaso</span><b>${esc(qs.quiz.titulo)}</b></div>
      <dl>
        <dt>Alumno/a</dt><dd>${esc(qs.nombre)}</dd>
        <dt>Resultado</dt><dd><span class="score-sm">${qs.ok} / ${n}</span> · nota ${nota}</dd>
        <dt>Fecha</dt><dd>${fmtDate(when)}</dd>
        ${qs.fallos.length?`<dt>A repasar</dt><dd>Preguntas ${qs.fallos.join(", ")}</dd>`:""}
      </dl>
      <div class="code-box"><span>Código de verificación</span><code>${code}</code></div>
    </div>
    <p class="note" style="margin:0">${qs.ok===n?"¡Perfecto! ":qs.ok>=n/2?"Bien hecho. ":"Repasa los contenidos y vuelve a intentarlo. "}Haz una captura de este informe o cópialo y entrégalo por Teams.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="copy-btn">Copiar informe</button>
      <button class="btn ghost" id="retry-btn">Repetir</button>
      <button class="btn ghost" id="close-btn2">Cerrar</button>
    </div>`;
  $("#copy-btn").focus();
}

/* ---------- página del profesorado: comprobar un informe ---------- */
function renderCheck(){
  $("#main").innerHTML = `
    <div class="check-wrap">
      <h1>Comprobar un informe</h1>
      <p class="note">Para el profesorado. Pega el código del informe y el nombre del alumno tal como aparece en él.</p>
      <form id="check-form" class="name-form">
        <label for="chk-code">Código de verificación</label>
        <input id="chk-code" placeholder="XXXXX-XXXXX-XXXXX" autocomplete="off" required>
        <label for="chk-name">Nombre y apellidos</label>
        <input id="chk-name" autocomplete="off" required>
        <button class="btn" type="submit">Comprobar</button>
      </form>
      <div id="check-result"></div>
    </div>`;
}

document.addEventListener("click", e=>{
  const j = e.target.closest("a[data-jump]");
  if(j){ e.preventDefault(); const el=document.getElementById(j.dataset.jump); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.zoom){
    qs = {lastFocus:t, zoom:true};
    $("#dialog").classList.add("wide");
    $("#dialog").innerHTML = `<div class="dialog-head"><h2 id="dlg-title">Gráfico de la red del centro</h2><button class="close" id="close-btn">Cerrar</button></div><div class="zoom-big"><img src="${t.dataset.zoom}" alt="Gráfico de la red del centro a tamaño grande"></div>`;
    $("#overlay").classList.add("open"); $("#close-btn").focus(); return;
  }
  if(t.dataset.quiz) openQuiz(t.dataset.quiz);
  else if(t.classList.contains("opt")) answer(+t.dataset.j);
  else if(t.id==="next-btn") next();
  else if(t.id==="retry-btn"){ qs.i=0; qs.ok=0; qs.fallos=[]; drawQuestion(); }
  else if(t.id==="copy-btn"){
    navigator.clipboard.writeText(qs.informe).then(()=>{ t.textContent="¡Copiado!"; }).catch(()=>{ t.textContent="No se pudo copiar: haz una captura"; });
  }
  else if(t.id==="close-btn"||t.id==="close-btn2") closeQuiz();
});
$("#overlay").addEventListener("click", e=>{ if(e.target.id==="overlay") closeQuiz(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && qs) closeQuiz(); });
document.addEventListener("submit", e=>{
  if(e.target.id==="name-form"){
    e.preventDefault();
    const n = $("#alumno").value.trim();
    if(n.split(/\s+/).length<2){ $("#alumno").setCustomValidity("Escribe nombre y al menos un apellido"); $("#alumno").reportValidity(); return; }
    qs.nombre = n; saveName(n); drawQuestion();
  }
  if(e.target.id==="check-form"){
    e.preventDefault();
    const r = checkCode($("#chk-code").value, $("#chk-name").value);
    $("#check-result").innerHTML = r.ok
      ? `<div class="check ok"><b>Informe auténtico</b><dl><dt>Ficha</dt><dd>${esc(r.titulo)}</dd><dt>Resultado</dt><dd>${r.score} / ${r.total}</dd><dt>Fecha</dt><dd>${fmtDate(r.when)}</dd></dl><p class="note" style="margin:0">Comprueba que estos datos coinciden con los del informe entregado.</p></div>`
      : `<div class="check bad"><b>No se puede verificar</b><p style="margin:0">${esc(r.msg)}</p></div>`;
  }
});
document.addEventListener("input", e=>{
  if(e.target.id==="alumno") e.target.setCustomValidity("");
  if(["oh-v","oh-i","oh-r"].includes(e.target.id)){
    const g=id=>{const v=$(id).value.trim(); return v===""?null:parseFloat(v);};
    const V=g("#oh-v"), I=g("#oh-i"), R=g("#oh-r"), o=$("#oh-out"), f=x=>x.toLocaleString("es-ES",{maximumFractionDigits:4});
    const n=[V,I,R].filter(x=>x!==null).length;
    if(n!==2){ o.textContent="Rellena dos datos y deja vacío el que quieras calcular."; return; }
    if(V===null) o.innerHTML=`V = I · R = ${f(I)} · ${f(R)} = <b>${f(I*R)} V</b>`;
    else if(I===null) o.innerHTML= R>0?`I = V / R = ${f(V)} / ${f(R)} = <b>${f(V/R)} A</b>`:"La resistencia no puede ser 0.";
    else o.innerHTML= I>0?`R = V / I = ${f(V)} / ${f(I)} = <b>${f(V/I)} Ω</b>`:"La intensidad no puede ser 0.";
  }
  if(["tr-z1","tr-z2","tr-n1"].includes(e.target.id)){
    const z1=parseFloat($("#tr-z1").value), z2=parseFloat($("#tr-z2").value), n1=parseFloat($("#tr-n1").value), o=$("#tr-out");
    if(!(z1>0)||!(z2>0)){ o.textContent="Introduce los dientes de los dos engranajes."; return; }
    const i=z1/z2, tipo=i<1?"reductor: más fuerza, menos velocidad":i>1?"multiplicador: más velocidad, menos fuerza":"ni reduce ni multiplica";
    const f=x=>x.toLocaleString("es-ES",{maximumFractionDigits:2});
    o.innerHTML=`Relación de transmisión i = ${f(z1)}/${f(z2)} = <b>${f(i)}</b> → ${tipo}.`+(n1>0?` El eje conducido gira a <b>${f(n1*i)} rpm</b>.`:"");
  }
  if(e.target.id==="eff-peso"||e.target.id==="eff-carga"){
    const p=parseFloat($("#eff-peso").value), c=parseFloat($("#eff-carga").value), o=$("#eff-out");
    if(!(p>0)||!(c>0)){ o.textContent="Introduce los dos datos."; return; }
    const ef=p/c, veces=c/p;
    o.innerHTML=`Eficiencia: <b>${ef.toLocaleString("es-ES",{maximumFractionDigits:4})}</b> · tu puente soportó <b>${veces.toLocaleString("es-ES",{maximumFractionDigits:1})} veces</b> su propio peso.`;
  }
});
window.addEventListener("hashchange", route);
route();
</script>
