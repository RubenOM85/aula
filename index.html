<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aula de Rubén</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: cabecera con pestañas de materia; cada materia = columna de unidades + columna lateral de criterios */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#15223b; --muted:#56637a; --line:#d9dfe8;
  --accent:#1f5fd6; --accent-ink:#ffffff; --highlight:#ffd84d;
  --ok:#1b8a4b; --bad:#c23b2c;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1522; --surface:#182133; --ink:#e8edf6; --muted:#9ba8be; --line:#2a3650;
    --accent:#6d9cff; --accent-ink:#0b1220; --highlight:#ffd84d; --ok:#4cc985; --bad:#ff7a6b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1522; --surface:#182133; --ink:#e8edf6; --muted:#9ba8be; --line:#2a3650;
  --accent:#6d9cff; --accent-ink:#0b1220; --highlight:#ffd84d; --ok:#4cc985; --bad:#ff7a6b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--highlight);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.15;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

header{background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;gap:16px;align-items:baseline;justify-content:space-between;flex-wrap:wrap;padding-top:22px}
.brand{font-family:var(--display);font-weight:800;font-size:1.6rem;text-decoration:none;color:var(--ink)}
.brand span{background:linear-gradient(transparent 62%, var(--highlight) 62%)}
.school{color:var(--muted);font-size:.92rem}
nav{display:flex;gap:6px;overflow-x:auto;padding:16px 0 0}
nav a{flex:none;text-decoration:none;color:var(--muted);font-weight:700;padding:10px 14px;border-radius:10px 10px 0 0;border-bottom:3px solid transparent}
nav a:hover{color:var(--ink)}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--sub,var(--accent))}

main{padding:28px 0 60px}
.home-intro{max-width:62ch;margin-bottom:24px}
.home-intro h1{font-size:2.1rem;margin-bottom:8px}
.home-intro p{color:var(--muted);margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.subj-card{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--sub);border-radius:12px;padding:18px;text-decoration:none;color:var(--ink)}
.subj-card:hover{border-color:var(--sub)}
.subj-card .lvl{font-size:.85rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.subj-card h2{font-size:1.3rem}
.subj-card p{margin:0;color:var(--muted);font-size:.95rem}

.subj-head{display:flex;flex-direction:column;gap:6px;margin-bottom:24px;max-width:70ch}
.subj-head .lvl{display:inline-block;align-self:flex-start;background:var(--sub);color:#fff;font-weight:700;font-size:.8rem;padding:3px 10px;border-radius:99px}
.subj-head h1{font-size:2rem}
.subj-head p{margin:0;color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}

.unit{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.units{display:flex;flex-direction:column;gap:18px}
.unit-head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.unit-num{font-family:var(--display);font-weight:800;color:var(--sub);font-size:1.1rem}
.unit h2{font-size:1.3rem}
.unit .desc{margin:0;color:var(--muted);max-width:65ch}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
@media (max-width:520px){.item{grid-template-columns:1fr}}
.tag{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tag::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;background:var(--c)}
.item .t{font-weight:700}
.item .s{color:var(--muted);font-size:.92rem}
.btn{appearance:none;border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;font-size:.92rem;padding:8px 14px;border-radius:8px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.pending{font-size:.85rem;color:var(--muted);font-style:italic;white-space:nowrap}

aside{display:flex;flex-direction:column;gap:16px;position:sticky;top:16px}
@media (max-width:860px){aside{position:static}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.box h3{font-size:1.1rem;margin-bottom:10px}
.box ol,.box ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.box .note{color:var(--muted);font-size:.9rem;margin:0}
.weights{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.w-row{display:grid;grid-template-columns:1fr 44px;gap:8px;font-size:.92rem;align-items:center}
.w-bar{grid-column:1 / -1;height:7px;background:var(--line);border-radius:99px;overflow:hidden}
.w-bar i{display:block;height:100%;background:var(--sub)}
.w-row b{text-align:right;font-variant-numeric:tabular-nums}

.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag-plain{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-right:4px}
.chip{font-size:.85rem;font-weight:700;font-variant-numeric:tabular-nums;padding:2px 9px;border-radius:99px;border:1.5px solid var(--sub);color:var(--ink);cursor:help}
.ces{display:flex;flex-direction:column;gap:10px}
.ce{border:1px solid var(--line);border-radius:10px;padding:0}
.ce summary{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;cursor:pointer;list-style:none}
.ce summary::-webkit-details-marker{display:none}
.ce summary b{display:block}
.ce-n{flex:none;font-family:var(--display);font-weight:800;color:#fff;background:var(--sub);border-radius:8px;padding:2px 8px;font-size:.9rem}
.ce-d{display:block;color:var(--muted);font-size:.92rem}
.crit-list{list-style:none;margin:0;padding:0 14px 12px;display:flex;flex-direction:column;gap:6px}
.crit-list li{display:grid;grid-template-columns:42px 1fr;gap:8px;font-size:.95rem;padding-top:6px;border-top:1px dashed var(--line)}
.code{font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums}
.ce-short{list-style:none!important;padding-left:0!important}
.ce-short b{color:var(--sub);margin-right:4px}

/* Temas */
.unit-link{text-decoration:none;color:var(--ink);border-left:6px solid var(--sub)}
.unit-link:hover{border-color:var(--sub);box-shadow:0 2px 10px rgba(20,30,50,.08)}
.eti{font-size:.85rem;color:var(--muted);font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.88rem;color:var(--muted);align-items:center}
.meta .go{margin-left:auto;color:var(--accent);font-weight:700}
.back{display:inline-block;margin-bottom:14px;text-decoration:none;font-weight:700}
.sub{font-family:var(--display);font-size:1.2rem;color:var(--ink)!important}
.quote{margin:4px 0;padding:4px 0 4px 14px;border-left:4px solid var(--sub);font-style:italic;color:var(--ink)}
.quote cite{display:block;font-style:normal;color:var(--muted);font-size:.9rem;margin-top:2px}
.blocks{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:.93rem}
.prose h2,.units .unit>h2{font-size:1.35rem}
.prose h3{font-size:1.1rem;margin-top:6px}
.prose p,.prose ul{margin:0;max-width:68ch}
.prose ul,.plain{padding-left:20px;display:flex;flex-direction:column;gap:4px;margin:0}
.defs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.defs>div{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.defs b{font-family:var(--display);color:var(--sub);font-size:1.05rem}
.defs span{font-size:.85rem;color:var(--muted)}
.defs p{font-size:.95rem;margin:0}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.task{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:14px;border:1px solid var(--line);border-radius:10px;scroll-margin-top:12px}
.task-n{width:36px;height:36px;border-radius:50%;background:var(--sub);color:#fff;font-family:var(--display);font-weight:800;display:flex;align-items:center;justify-content:center}
.task-body{display:flex;flex-direction:column;gap:8px;min-width:0}
.task-body h3{font-size:1.1rem}
.task-body p,.task-body ol,.task-body ul{margin:0}
.task-body ol,.task-body ul{padding-left:20px;display:flex;flex-direction:column;gap:4px}
.task-meta,.links{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-size:.85rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--ink);text-decoration:none}
.pill-link{border-color:var(--sub)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.tbl{border-collapse:collapse;width:100%;font-size:.92rem;min-width:520px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
.tbl thead th{background:var(--bg);font-size:.82rem;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.tbl tbody th{font-weight:700;width:18%}
.tbl td{min-width:150px}
.tbl.pts td,.tbl.check td{min-width:0}
.tbl td.q{color:var(--muted);text-align:center;font-weight:700;background:color-mix(in srgb,var(--highlight) 18%,transparent)}
.tbl.rub{min-width:760px}
.tbl.check td{width:56px}.tbl.check td:last-child{width:auto}
.tbl.pts td:last-child,.tbl.pts tfoot th:last-child{text-align:right;font-variant-numeric:tabular-nums;width:70px}
.tbl tfoot th{border-bottom:0}
.anexo{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px dashed var(--line);scroll-margin-top:12px}
.anexo:first-of-type{border-top:0;padding-top:0}
.anexo h3{font-size:1.1rem}
.unit{scroll-margin-top:12px}
.toc{list-style:none;margin:0;padding:0!important}
.crit-mini{list-style:none;margin:0;padding:0!important;font-size:.9rem}
.crit-mini li{display:grid;grid-template-columns:34px 1fr;gap:6px}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

.task-body h4{font-family:var(--display);font-size:1rem;margin:6px 0 0}
.fig{margin:0;display:flex;flex-direction:column;gap:6px}
.fig figcaption{font-size:.88rem;color:var(--muted)}
.zoom{padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;cursor:zoom-in;display:block}
.zoom img{display:block;width:100%;height:auto}
.pins{list-style:none!important;padding:0!important;display:grid!important;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px!important}
.pins li{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:.92rem}
.pins b{font-variant-numeric:tabular-nums;width:14px;text-align:right}
.wire{flex:none;width:34px;height:12px;border-radius:6px;background:var(--w);border:1px solid rgba(0,0,0,.25)}
.wire.w-st{background:repeating-linear-gradient(90deg,#fff 0 6px,var(--w) 6px 10px)}
.dialog.wide{max-width:1200px}
.zoom-big{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.zoom-big img{display:block;width:100%;min-width:900px;height:auto}

.worlds{display:flex;flex-direction:column;gap:12px}
.world{border:1px solid var(--line);border-left:6px solid var(--wc);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.world header{display:flex;gap:12px;align-items:center}
.world header span{font-size:.88rem;color:var(--muted)}
.world h3{margin:0}
.wn{flex:none;width:34px;height:34px;border-radius:50%;background:var(--wc);color:#fff!important;font-family:var(--display);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:1rem!important}
.world ul{padding-left:20px;display:flex;flex-direction:column;gap:5px;margin:0}
.world p{margin:0}
.ask{background:var(--bg);border-radius:8px;padding:8px 12px;font-style:italic}

.tbl .crit{display:block;font-size:.8rem;font-weight:700;color:var(--sub);margin-top:3px}
.tbl.ev td:nth-child(2),.tbl.ev td:last-child,.tbl.ev tfoot th:last-child{text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums;min-width:0;width:64px}
.tbl.ev td:nth-child(4){min-width:110px}

.planos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.plano{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;background:var(--surface)}
.shot{position:relative;aspect-ratio:16/9;background:#cfe6f7;border-bottom:1px solid var(--line)}
.shot svg{display:block;width:100%;height:100%}
.abbr{position:absolute;top:6px;left:6px;background:rgba(21,34,59,.85);color:#fff;font-size:.75rem;font-weight:700;padding:2px 7px;border-radius:6px}
.plano figcaption{padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.plano figcaption b{font-family:var(--display);font-size:1rem}
.plano .uso{color:var(--muted);font-size:.88rem}

.ficha{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.ficha-sec{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)}
.ficha-sec h4{font-family:var(--display);margin:0 0 6px;color:var(--sub)}
.ficha-sec ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:.93rem}

.steps4{padding-left:22px;display:flex;flex-direction:column;gap:6px;margin:0;max-width:68ch}

.dosier{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pieza{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.pieza header{display:flex;align-items:center;gap:8px}
.pn{width:26px;height:26px;border-radius:50%;background:var(--sub);color:#fff;font-weight:800;font-size:.85rem;display:flex;align-items:center;justify-content:center}
.canal{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.pieza h4{margin:0;font-family:var(--display);font-size:1rem}
.pieza .msg{margin:0;font-size:.92rem;background:var(--bg);border-radius:8px;padding:8px 10px}

.name-form{display:flex;flex-direction:column;gap:8px;max-width:420px}
.name-form label{font-weight:700;font-size:.92rem}
.name-form input{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.name-form input:focus{outline:3px solid var(--highlight);border-color:var(--accent)}
.name-form .btn{align-self:flex-start;margin-top:4px}
.report{border:2px solid var(--accent);border-radius:12px;overflow:hidden}
.report-top{background:var(--accent);color:var(--accent-ink);padding:10px 14px;display:flex;flex-direction:column}
.report-top span{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;opacity:.85}
.report dl,.check dl{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:0;padding:14px}
.report dt,.check dt{color:var(--muted);font-size:.9rem}
.report dd,.check dd{margin:0;font-weight:700}
.score-sm{font-family:var(--display);font-size:1.3rem}
.code-box{margin:0 14px 14px;padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--accent) 12%,var(--surface));display:flex;flex-direction:column;gap:2px}
.code-box span{font-size:.8rem;color:var(--muted);font-weight:700}
.code-box code{font-size:1.3rem;font-weight:800;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.check-wrap{max-width:560px;display:flex;flex-direction:column;gap:14px}
.check-wrap h1{font-size:1.8rem}
.check{border-radius:10px;padding:14px;border:2px solid;display:flex;flex-direction:column;gap:8px}
.check.ok{border-color:var(--ok)}.check.ok>b{color:var(--ok)}
.check.bad{border-color:var(--bad)}.check.bad>b{color:var(--bad)}
.check dl{padding:0}

.eff{display:grid;grid-template-columns:auto 140px;gap:8px 12px;align-items:center;max-width:420px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.eff label{font-weight:700;font-size:.92rem}
.eff input{font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);width:100%}
.eff output{grid-column:1 / -1;font-size:.95rem}

/* Ficha interactiva */
.overlay{position:fixed;inset:0;background:rgba(10,15,25,.55);display:none;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto;z-index:10}
.overlay.open{display:flex}
.dialog{background:var(--surface);color:var(--ink);border-radius:14px;max-width:640px;width:100%;padding:24px;display:flex;flex-direction:column;gap:16px}
.dialog-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dialog h2{font-size:1.4rem}
.close{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.progress{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.q{font-size:1.1rem;font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;font:inherit;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.feedback{margin:0;padding:12px 14px;border-radius:10px;background:var(--bg);display:none}
.feedback.show{display:block}
.score{font-family:var(--display);font-size:2.4rem;font-weight:800}

footer{border-top:1px solid var(--line);color:var(--muted);font-size:.85rem;padding:18px 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <a class="brand" href="#inicio"><span>Aula de Rubén</span></a>
      <div class="school">Centro Parroquial La Inmaculada · Paiporta · Curso 2026‑27</div>
    </div>
    <nav id="nav" aria-label="Materias"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<footer><div class="wrap">Materiales de clase de Rubén Olivares. Si un enlace no funciona, avisa por Teams. · <a href="#comprobar">Comprobar un informe (profesorado)</a></div></footer>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
  <div class="dialog" id="dialog"></div>
</div>

<script>
/* ============================================================
   CONTENIDO DE LA WEB
   Cada materia tiene: unidades (con elementos) y criterios.
   Tipos de elemento: contenido, actividad, video, ficha (descargable), interactiva
   ============================================================ */
const TIPOS = {
  contenido:  {label:"Contenido",  c:"#1f5fd6"},
  actividad:  {label:"Actividad",  c:"#e08a00"},
  video:      {label:"Vídeo",      c:"#d23a5a"},
  ficha:      {label:"Ficha PDF",  c:"#6b4fd8"},
  juego:      {label:"Juego",      c:"#0e8f8f"},
  interactiva:{label:"Interactiva",c:"#1b8a4b"}
};

        <p>Hoy en día la comunicación entre dispositivos electrónicos es muy común, tanto para el ocio como para el trabajo de muchas empresas. Compartimos datos a través de conexiones 4G, 5G, wifi, NFC, Ethernet o bluetooth. Los móviles se conectan con otros móviles y con los proveedores de Internet a través de las redes de datos. Los ordenadores, portátiles, impresoras y otros dispositivos se conectan entre sí en redes locales para trabajar juntos, e incluso con ordenadores remotos en cualquier lugar de Internet.</p>
        <h3>¿Qué es una red informática?</h3>
        <p>Una red informática (o red de comunicación de datos, o red de computadoras) es un conjunto de sistemas informáticos conectados entre sí mediante dispositivos con cable o inalámbricos. Gracias a ellos comparten información en paquetes de datos, que se transmiten mediante impulsos eléctricos, ondas electromagnéticas u otro medio físico.</p>

          <div><b>MAN</b><span>Metropolitan Area Network, red de área metropolitana</span><p>Redes de tamaño intermedio, como las de un campus universitario, una gran biblioteca o una empresa, que conectan zonas alejadas entre sí.</p></div>
          <div><b>WAN</b><span>Wide Area Network, red de área amplia</span><p>Las redes de mayor tamaño y alcance, como la red de redes: Internet.</p></div>

        <h3>¿Cómo diseñamos una red funcional?</h3>
        <p>Una red informática funcional tiene que permitir dos cosas:</p>
        <ul><li>Que varios dispositivos salgan a Internet usando la misma línea de acceso, que normalmente es única.</li><li>Que los ordenadores compartan los recursos internos de la red: la impresora, el escáner o un almacenamiento en red que todos pueden usar.</li></ul>
        <h3>Glosario de dispositivos de red</h3>

          <div><b>Concentrador (hub)</b><p>Une varios equipos, pero reenvía todo lo que recibe a todos ellos.</p></div>
          <div><b>Puente</b><p>Une dos partes de una red que usan el mismo protocolo de comunicación.</p></div>
          <div><b>Pasarela</b><p>Conecta redes que usan tecnologías distintas, por ejemplo una de cable y una de fibra.</p></div>

        {n:5, t:"Crimpa tu propio cable de red RJ45", html:`
          <p>El cable de red más usado en casas y centros es el <b>UTP de par trenzado</b>. Por dentro lleva <b>8 hilos de cobre</b> agrupados en <b>4 pares trenzados</b>: naranja, verde, azul y marrón. Cada par tiene un hilo de color liso y otro blanco con una raya de ese color. Se trenzan para reducir las interferencias.</p>

            <li><span class="wire" style="--w:#f28c28"></span><b>2</b>Naranja</li>
            <li><span class="wire w-st" style="--w:#2e9e4f"></span><b>3</b>Blanco-verde</li>
            <li><span class="wire" style="--w:#2a63d4"></span><b>4</b>Azul</li>
            <li><span class="wire w-st" style="--w:#2a63d4"></span><b>5</b>Blanco-azul</li>
            <li><span class="wire" style="--w:#2e9e4f"></span><b>6</b>Verde</li>
            <li><span class="wire w-st" style="--w:#8a5a2b"></span><b>7</b>Blanco-marrón</li>
            <li><span class="wire" style="--w:#8a5a2b"></span><b>8</b>Marrón</li>
          </ol>
          <p>Para un cable normal (directo) se usa <b>el mismo orden en los dos extremos</b>.</p>
          <h4>Material</h4>
          <p>Cable UTP, dos conectores RJ45, pelacables, crimpadora y comprobador de cables (tester).</p>
          <h4>Pasos</h4>
          <ol>
            <li>Pela unos 2–3 cm de la funda exterior sin cortar los hilos.</li>
            <li>Destrenza los pares y estira bien los hilos.</li>
            <li>Ordénalos según la norma T568B.</li>
            <li>Córtalos rectos, dejando unos 12–14 mm.</li>
            <li>Mete los hilos en el conector sin que se descoloquen, hasta que toquen el fondo. La funda exterior tiene que quedar dentro del conector.</li>
            <li>Comprueba el orden de los colores antes de crimpar.</li>
            <li>Crimpa con fuerza.</li>
            <li>Repite en el otro extremo.</li>
          </ol>
          <h4>¿Funciona?</h4>
          <p>Conecta los dos extremos al tester. Si las luces del 1 al 8 se encienden en orden en los dos lados, tu cable funciona. Si alguna no se enciende o salen en otro orden, corta el conector y vuelve a empezar.</p>`, entrega:"En clase: se prueba con el tester"}

      {id:"dig4-seguridad", etiqueta:"Situación de aprendizaje 3", titulo:"Seguridad en la red", subtitulo:"De alumnos a profesores: enseñamos a 6.º de Primaria",
       bloque:"Bloque 3. Seguridad y bienestar digital",
       desc:"Aprendemos los cinco principios de «Sé genial en Internet», los ponemos a prueba en Interland y preparamos y damos una sesión de seguridad digital al alumnado de 6.º de Primaria.",
       criterios:["2.5","3.1","3.2","3.3","3.4","3.6","4.1","4.4","5.3"],
       producto:"Sesión de seguridad digital impartida al alumnado de 6.º de Primaria, con su presentación.",
       anexos:["sa3a1","sa3a2"],
       teoria:`
        <p>«Sé genial en Internet» es un programa de Google, adaptado en España junto con la Fad, el INCIBE y la Policía Nacional, que resume la seguridad digital en <b>cinco principios</b>. Cuatro de ellos son los mundos del juego Interland; el quinto los une a todos.</p>
        <div class="worlds">
          <article class="world" style="--wc:#7c4dcc">
            <header><span class="wn">1</span><div><h3>Comparte con cuidado</h3><span>Sé listo · Mundo: Montaña Sensata</span></div></header>
            <p>Todo lo que publicas forma tu <b>huella digital</b>: el rastro que dejas en Internet. Con ella, otras personas construyen tu <b>identidad digital</b>, lo que piensan de ti sin conocerte.</p>
            <ul>
              <li><b>Información personal:</b> nombre, dirección, colegio, teléfono, ubicación, fotos de tu casa o tu horario. No se comparte con desconocidos.</li>
              <li><b>Lo publicado se queda:</b> aunque lo borres, alguien puede haber hecho una captura o haberlo reenviado.</li>
              <li><b>Privacidad:</b> revisa quién ve tus publicaciones, quién puede escribirte y qué apps usan tu ubicación.</li>
              <li><b>Lo de los demás también cuenta:</b> pide permiso antes de publicar fotos o datos de otra persona.</li>
            </ul>
            <p class="ask">Antes de publicar, pregúntate: ¿me importaría que lo viera mi familia, mi profesor o quien me entreviste para un trabajo dentro de diez años?</p>
          </article>
          <article class="world" style="--wc:#1f8fc9">
            <header><span class="wn">2</span><div><h3>No caigas en trampas</h3><span>Sé alerta · Mundo: Río de la Realidad</span></div></header>
            <p>No todo lo que aparece en Internet es verdad, ni todo el mundo es quien dice ser.</p>
            <ul>
              <li><b>Phishing:</b> mensajes o webs que se hacen pasar por un banco, una tienda, una red social o incluso un amigo para robarte contraseñas o datos. Si llega por SMS se llama <i>smishing</i>.</li>
              <li><b>Señales de alarma:</b> prisa («tu cuenta se bloqueará en 24 h»), premios que no has pedido, faltas de ortografía, remitentes o direcciones web raras y peticiones de contraseñas o códigos.</li>
              <li><b>Perfiles falsos:</b> fotos que no son reales, pocos seguidores, cuentas recién creadas o que piden datos o fotos muy pronto.</li>
              <li><b>Bulos y desinformación:</b> antes de compartir una noticia, comprueba quién la publica, la fecha y si otros medios fiables la cuentan.</li>
            </ul>
            <p class="ask">Ante la duda, no pulses el enlace: entra tú mismo en la web o la app oficial.</p>
          </article>
          <article class="world" style="--wc:#d9822b">
            <header><span class="wn">3</span><div><h3>Protege tus secretos</h3><span>Sé fuerte · Mundo: Torre del Tesoro</span></div></header>
            <p>Tus cuentas guardan tus mensajes, fotos y datos. La contraseña es la llave.</p>
            <ul>
              <li><b>Contraseña fuerte:</b> larga (mejor una frase de varias palabras), con mayúsculas, números y símbolos, y nada fácil de adivinar como tu nombre, tu fecha de nacimiento o «123456».</li>
              <li><b>Una contraseña distinta para cada cuenta:</b> si roban una, las demás siguen a salvo.</li>
              <li><b>Verificación en dos pasos:</b> además de la contraseña, la cuenta pide un código que llega al móvil.</li>
              <li><b>Nunca compartas tus contraseñas</b>, salvo con tu familia.</li>
              <li><b>Dispositivos protegidos:</b> bloqueo de pantalla, sistema y apps actualizados y cerrar sesión en equipos compartidos.</li>
            </ul>
          </article>
          <article class="world" style="--wc:#d64584">
            <header><span class="wn">4</span><div><h3>Ser amable es genial</h3><span>Sé amable · Mundo: Reino Amable</span></div></header>
            <p>Internet amplifica tanto lo bueno como lo malo. Detrás de cada pantalla hay una persona.</p>
            <ul>
              <li><b>Ciberacoso:</b> molestar, humillar, amenazar o excluir a alguien de forma repetida a través de medios digitales: mensajes, grupos, montajes, perfiles falsos…</li>
              <li><b>Los roles:</b> quien acosa, quien lo sufre y los <b>espectadores</b>. Quien se ríe, comparte o calla también participa.</li>
              <li><b>Cómo actuar:</b> no respondas a las provocaciones, guarda pruebas (capturas), bloquea y denuncia en la plataforma, y cuéntaselo a un adulto de confianza.</li>
              <li><b>Netiqueta:</b> escribe como hablarías cara a cara y apoya a quien lo está pasando mal.</li>
            </ul>
          </article>
          <article class="world" style="--wc:#2e9e4f">
            <header><span class="wn">5</span><div><h3>Si tienes dudas, pregunta</h3><span>Sé valiente · Une todos los mundos</span></div></header>
            <p>Ante cualquier situación que te incomode, te dé miedo o no sepas resolver, habla con un adulto de confianza: tu familia, tu tutor o un profesor. Pedir ayuda es de valientes.</p>
            <p>También puedes llamar al <b>017</b>, la línea gratuita y confidencial de ayuda en ciberseguridad del INCIBE.</p>
          </article>
        </div>`,
       tareas:[
        {n:1, t:"Aprendemos la teoría", html:"<p>Lee la teoría de los cinco principios y haz un resumen con los conceptos clave de cada uno: huella digital, phishing, contraseña fuerte, verificación en dos pasos, ciberacoso… Después, comprueba lo que sabes con la ficha interactiva de repaso.</p>", evalua:"sa3a1", entrega:"Resumen por Teams"},
        {n:2, t:"Jugamos a Interland", html:"<p>Juega a los cuatro mundos de Interland. Mientras juegas, anota en cada mundo:</p><ul><li>Qué principio trabaja.</li><li>Qué conceptos de la teoría aparecen.</li><li>Qué pregunta o reto te ha parecido más difícil.</li><li>Qué crees que les costará más a los alumnos de 6.º.</li></ul>", evalua:"sa3a1", entrega:"Diario de Interland por Teams", enlaces:[["Jugar a Interland","https://beinternetawesome.withgoogle.com/es_es/interland"]]},
        {n:3, t:"Nos repartimos los mundos", html:"<p>Nos repartimos los cuatro mundos de Interland. Cada mundo tendrá sus expertos, que se encargarán de enseñar ese principio al alumnado de 6.º de Primaria.</p>"},
        {n:4, t:"Preparamos la sesión", html:"<p>Diseña la sesión que vas a dar y la presentación que la acompaña, en Keynote o Canva. El guion debe incluir:</p><ol><li><b>Inicio:</b> una pregunta o una situación real para despertar el interés.</li><li><b>Explicación:</b> los conceptos clave del principio, con palabras que entienda un alumno de 11 años y ejemplos cercanos.</li><li><b>Juego:</b> el mundo de Interland, con las pistas que les darás.</li><li><b>Comprobación:</b> unas preguntas o una dinámica para ver si lo han entendido.</li><li><b>Cierre:</b> el mensaje que queréis que recuerden.</li></ol>", entrega:"Guion y presentación por Teams", evalua:"sa3a1"},
        {n:5, t:"Ensayamos", html:"<p>Cada sesión se ensaya delante del resto de la clase. Los compañeros harán sugerencias de mejora, que tendrás que aplicar antes del gran día.</p>", evalua:"sa3a1"},
        {n:6, t:"¡A 6.º de Primaria!", html:"<p>Llega el momento: impartimos las sesiones al alumnado de 6.º de Primaria. Recuerda hablar despacio, mirar al público, dejarles participar y ayudarles mientras juegan.</p>", evalua:"sa3a2"},
        {n:7, t:"Reflexión final", html:"<p>Después de la sesión, valora individualmente cómo ha ido: qué funcionó, qué cambiarías, qué preguntas te hicieron y qué has aprendido enseñando a otros.</p>", evalua:"sa3a1", entrega:"Autoevaluación por Teams"}

      ,{id:"dig4-video", etiqueta:"Situación de aprendizaje 4", titulo:"Edición de vídeo y sonido", subtitulo:"Luces, cámara… ¡acción!",
       bloque:"Bloque 2. Digitalización del entorno personal de aprendizaje",
       desc:"Aprendemos el lenguaje del cine: los tipos de plano y los ángulos de cámara. Los cazamos con la cámara por el colegio y terminamos creando en grupo un cortometraje de ficción: guion, rodaje, edición de vídeo y sonido.",
       criterios:["2.1","2.3","2.5","2.6","3.2","3.6","4.1","5.1","5.2","5.3"],
       producto:"Cortometraje de ficción grabado y editado en grupo, con su guion y su storyboard.",
       anexos:["sa4a1","sa4a2"],
       teoria:`
        <p>En el cine, cada plano es una decisión: <b>qué</b> enseñamos, <b>cuánto</b> enseñamos y <b>desde dónde</b>. Elegir bien el plano ayuda a contar la historia y a transmitir emociones sin decir una palabra.</p>
        <h3>Los planos según lo que se ve</h3>
        <p>Van de lo más abierto a lo más cerrado. Fíjate en que todos los dibujos son la misma escena: solo cambia el encuadre.</p>
        ${planosHTML()}
        <h3>Los ángulos de cámara</h3>
        <p>Además de cuánto se ve, importa la altura desde la que mira la cámara. Si está a la altura de los ojos del personaje, el ángulo es <b>normal</b> y no transmite nada especial. Estos tres sí:</p>
        ${angulosHTML()}
        <h3>Trucos de encuadre</h3>
        <ul>
          <li><b>Regla de los tercios:</b> divide la imagen en 3×3 y coloca lo importante en las líneas o en sus cruces, no en el centro.</li>
          <li><b>Aire:</b> deja espacio hacia donde mira o se mueve el personaje.</li>
          <li><b>Cortes:</b> no cortes a los personajes por las articulaciones (cuello, codos, rodillas exactas, tobillos).</li>
          <li><b>Plano y contraplano:</b> en un diálogo alternamos los planos de cada personaje, a menudo por encima del hombro del otro.</li>
        </ul>
        <h3>El sonido también cuenta</h3>
        <p>La banda sonora de una película tiene cuatro elementos:</p>
        <div class="defs">
          <div><b>Diálogos</b><p>Lo que dicen los personajes. Graba cerca de quien habla y en un sitio sin ruido.</p></div>
          <div><b>Música</b><p>Crea ambiente y emoción. Usa solo música libre de derechos o con licencia que lo permita.</p></div>
          <div><b>Efectos</b><p>Pasos, puertas, lluvia… Se pueden grabar aparte y añadir al editar.</p></div>
          <div><b>Silencio</b><p>Bien usado, crea tensión o da importancia a un momento.</p></div>
        </div>
        <h3>Editar: el montaje</h3>
        <ul>
          <li><b>Ordenar y cortar:</b> elige las mejores tomas y quita lo que sobra. Un buen montaje es ágil.</li>
          <li><b>Transiciones:</b> el corte directo es la más usada; las demás, con moderación.</li>
          <li><b>Sonido:</b> ajusta volúmenes para que los diálogos se entiendan por encima de la música.</li>
          <li><b>Títulos y créditos:</b> título al principio y, al final, quién ha hecho qué y de dónde salen la música y las imágenes que no son vuestras.</li>
          <li><b>Exportar:</b> guarda el vídeo final en un formato que se pueda compartir, como MP4.</li>
        </ul>`,
       tareas:[
        {n:1, t:"Aprendemos los planos", html:"<p>Trabajamos en clase los doce planos y ángulos. Después, comprueba lo que sabes con la ficha interactiva «¿Qué plano es?».</p>", evalua:"sa4a1"},
        {n:2, t:"Cazadores de planos", html:"<p>En el espacio del centro que te indique el profesor, haz una fotografía de cada uno de los doce planos, a tus compañeros o al paisaje.</p><ul><li>Pon a cada foto el nombre del plano.</li><li>Pide permiso a los compañeros antes de fotografiarlos. Las fotos son solo para clase: no se publican en redes.</li></ul>", entrega:"Álbum o presentación por Teams", evalua:"sa4a1"},
        {n:3, t:"Historia muda en 6 planos", html:"<p>Cuenta una mini historia de unos 30 segundos <b>sin diálogos</b>, solo con imágenes. Tiene que tener seis planos distintos de los que hemos estudiado, y cada uno debe aportar algo a la historia.</p><ol><li>Piensa una situación sencilla con inicio, nudo y final (perder algo y encontrarlo, una sorpresa, una espera…).</li><li>Dibuja un storyboard rápido de seis viñetas indicando el plano de cada una.</li><li>Graba y monta los seis planos en orden.</li></ol><p>Si el espectador entiende la historia sin que nadie la explique, lo has conseguido.</p>", entrega:"Vídeo y storyboard por Teams", evalua:"sa4a1"},
        {n:4, t:"Laboratorio de sonido: efectos y doblaje", html:"<p>El profesor te dará un fragmento de vídeo sin sonido. Tu reto es reconstruir toda su banda sonora:</p><ul><li><b>Efectos de sala (foley):</b> graba los sonidos con objetos de clase: pasos, puertas, papeles, lluvia con un plástico, golpes…</li><li><b>Doblaje:</b> pon voz a los personajes, ajustando lo que dices al movimiento de sus labios.</li><li><b>Música:</b> añade música libre de derechos que encaje con el ambiente.</li></ul><p>Mezcla todo en el editor ajustando los volúmenes y sincronizando cada sonido con su imagen.</p><p class=\"ask\"><b>Norma del proyecto:</b> se graba y se edita en clase. Las voces tienen que ser las vuestras y las imágenes, grabadas por vosotros: no vale generar vídeo, voces ni narraciones con IA.</p>", enlaces:[["Música y efectos libres en Pixabay","https://pixabay.com/music/"]], entrega:"Vídeo con sonido por Teams", evalua:"sa4a1"},
        {n:5, t:"Preproducción: idea, guion y storyboard", html:"<p>En grupo, inventad una historia de ficción para un cortometraje y preparadla:</p><ol><li><b>Idea:</b> resumid la historia en dos o tres frases.</li><li><b>Guion literario:</b> escenas, lugares, personajes y diálogos.</li><li><b>Storyboard:</b> una viñeta por plano, indicando el tipo de plano y el ángulo.</li><li><b>Reparto de roles:</b> dirección, guion, cámara, sonido, montaje, interpretación, vestuario y atrezo, continuidad…</li><li><b>Plan de rodaje:</b> qué se graba, dónde, cuándo y quién lo necesita.</li></ol>", entrega:"Guion y storyboard por Teams", evalua:"sa4a1"},
        {n:6, t:"Rodaje", html:"<p>¡A grabar! Cada persona cumple su rol. Consejos:</p><ul><li>Graba en horizontal y con la cámara estable.</li><li>Haz varias tomas de cada plano.</li><li>Cuida el sonido: silencio en el set mientras se graba.</li><li>Revisa el storyboard antes de cada plano.</li></ul><p class=\"ask\"><b>Norma del proyecto:</b> se graba y se edita en clase. Las voces tienen que ser las vuestras y las imágenes, grabadas por vosotros: no vale generar vídeo, voces ni narraciones con IA.</p>", evalua:"sa4a1"},
        {n:7, t:"Postproducción: edición de vídeo y sonido", html:"<p>Montad el corto en iMovie u otro editor: ordenad y cortad las tomas, añadid música libre de derechos y efectos, ajustad los volúmenes, poned título y créditos y exportad el vídeo final.</p><p class=\"ask\"><b>Norma del proyecto:</b> se graba y se edita en clase. Las voces tienen que ser las vuestras y las imágenes, grabadas por vosotros: no vale generar vídeo, voces ni narraciones con IA.</p>", enlaces:[["Música y efectos libres en Pixabay","https://pixabay.com/music/"]], entrega:"Enlace de OneDrive al corto", evalua:"sa4a2"},
        {n:8, t:"Estreno y reflexión", html:"<p>Proyectamos los cortos en clase. Después, cada persona valora su trabajo y el del grupo con la rúbrica del corto.</p>", entrega:"Autoevaluación por Teams", evalua:"sa4a1"}
       ],

      ,{id:"dig4-gamelab", etiqueta:"Situación de aprendizaje 5", titulo:"GameLab: juega, piensa, mejora", subtitulo:"Proyecto Gamer",
       bloque:"Bloques 3 y 4. Bienestar digital y ciudadanía digital crítica",
       desc:"Elegimos un videojuego educativo gratuito, lo jugamos, lo analizamos a fondo (también cómo cuida nuestro tiempo y nuestros datos) y proponemos una mejora creativa que presentamos a la clase.",
       criterios:["2.3","2.5","3.2","3.5","4.4","4.5","5.2","5.3"],
       producto:"Ficha de análisis, propuesta de mejora y presentación final del videojuego.",
       anexos:["sa5a1","sa5a2","sa5a3"],
       teoria:`
        <p>Un <b>videojuego educativo</b> (o juego serio) está diseñado para enseñar algo mientras juegas. Para analizarlo como un experto, fíjate en estas piezas:</p>
        <div class="defs">
          <div><b>Mecánicas</b><p>Las reglas y las acciones que puedes hacer: saltar, responder, construir, gestionar recursos.</p></div>
          <div><b>Dinámicas</b><p>Lo que pasa cuando juegas con esas reglas: competir, colaborar, explorar, superar retos.</p></div>
          <div><b>Estética</b><p>Lo que sientes: diversión, tensión, curiosidad. Depende del diseño visual, el sonido y la historia.</p></div>
          <div><b>Narrativa</b><p>La historia, los personajes y el mundo en el que transcurre el juego.</p></div>
        </div>
        <h3>Diseño que engancha… ¿demasiado?</h3>
        <p>Muchos juegos y apps usan técnicas pensadas para que pases más tiempo dentro. No siempre son malas, pero conviene reconocerlas:</p>
        <ul>
          <li><b>Recompensas diarias y rachas:</b> te premian por volver cada día y te castigan si fallas uno.</li>
          <li><b>Cajas de botín:</b> pagas o juegas por un premio al azar, un mecanismo parecido a las apuestas.</li>
          <li><b>Compras dentro del juego</b> y monedas virtuales que esconden cuánto dinero real gastas.</li>
          <li><b>Notificaciones</b> que te avisan para que vuelvas a jugar.</li>
          <li><b>Partidas sin final claro</b>, que hacen difícil saber cuándo parar.</li>
        </ul>
        <h3>Accesibilidad</h3>
        <p>Un buen juego educativo es para todos: texto legible y ajustable, subtítulos, colores que distingan también las personas con daltonismo, controles sencillos, varios idiomas y que funcione en distintos dispositivos.</p>`,
       tareas:[
        {n:1, t:"Elige y juega", duracion:"1 semana", html:"<p>Elige un videojuego gratuito y educativo de la lista de recursos. Juega lo suficiente para conocerlo bien: prueba varios niveles, equivócate a propósito y fíjate en todo.</p>"},
        {n:2, t:"Analiza el videojuego", duracion:"1 semana", html:"<p>Rellena la ficha de análisis (Anexo 3) con todo lo que has observado. Justifica cada respuesta con ejemplos concretos del juego: capturas, situaciones o niveles.</p>", entrega:"Ficha de análisis por Teams", evalua:"sa5a2"},
        {n:3, t:"Propón una mejora", duracion:"2 semanas", html:"<p>Diseña una mejora para el videojuego que salga de tu análisis. Puede ser:</p><ul><li><b>Visual:</b> rediseño de pantallas, personajes o menús.</li><li><b>Narrativa:</b> una historia o personajes nuevos.</li><li><b>De accesibilidad:</b> que lo pueda jugar más gente.</li><li><b>Funcional:</b> una nueva mecánica, un nivel o un modo de juego.</li></ul><p>Preséntala de forma visual (bocetos o maqueta en Canva) o escrita, explicando qué problema resuelve.</p>", entrega:"Propuesta de mejora por Teams", evalua:"sa5a2"},
        {n:4, t:"Presentación final", duracion:"1 semana", html:"<p>Presenta a la clase tu análisis y tu mejora con una presentación digital (Canva, Keynote, Genially…). Estructura recomendada: el juego en un minuto, qué enseña, cómo funciona, lo bueno y lo mejorable, bienestar y datos, y tu propuesta de mejora.</p>", entrega:"Presentación por Teams", evalua:"sa5a2"}

      ,{id:"dig4-bulos", etiqueta:"Situación de aprendizaje 6", titulo:"¿Es verdad? IA, bulos y deepfakes", subtitulo:"Detectives de la información",
       bloque:"Bloque 4. Ciudadanía digital crítica",
       desc:"Aprendemos a comprobar si una noticia, una imagen o un vídeo son reales, ponemos a prueba lo que dicen las inteligencias artificiales y debatimos sobre dilemas digitales con argumentos verificados.",
       criterios:["2.1","2.3","3.4","3.6","4.1","4.3","4.4"],
       producto:"Informe de verificación, análisis de respuestas de IA, debate y tu kit antibulos.",
       anexos:["sa6a1","sa6a2"],
       teoria:`
        <p>Cada día recibimos cientos de mensajes, noticias, imágenes y vídeos. Algunos son falsos, y ahora la inteligencia artificial permite crear contenido falso que parece totalmente real. Saber distinguirlo es una de las habilidades más importantes de un ciudadano digital.</p>
        <h3>Conceptos clave</h3>
        <div class="defs">
          <div><b>Bulo</b><p>Información falsa que se difunde como si fuera verdad, a menudo por WhatsApp o redes sociales.</p></div>
          <div><b>Desinformación</b><p>Información falsa creada a propósito para engañar, ganar dinero o influir en lo que pensamos.</p></div>
          <div><b>Información errónea</b><p>Información falsa que se comparte sin intención de engañar, por error.</p></div>
          <div><b>Clickbait</b><p>Titulares exagerados o misteriosos pensados para que hagas clic.</p></div>
          <div><b>Deepfake</b><p>Vídeo, imagen o audio creado o manipulado con IA para que alguien parezca hacer o decir algo que nunca hizo.</p></div>
          <div><b>Sesgo de confirmación</b><p>Tendencia a creer lo que encaja con lo que ya pensamos y a desconfiar de lo que no.</p></div>
        </div>
        <h3>Cuatro pasos para verificar</h3>
        <ol class="steps4">
          <li><b>Para.</b> Antes de creer o compartir, detente. Si te provoca mucha emoción (miedo, rabia, risa), desconfía más.</li>
          <li><b>Investiga la fuente.</b> ¿Quién lo publica? ¿Es un medio conocido, una institución, una cuenta anónima? ¿Qué fecha tiene?</li>
          <li><b>Busca otras fuentes.</b> ¿Lo cuentan otros medios fiables? ¿Lo han desmentido los verificadores?</li>
          <li><b>Rastrea el original.</b> Busca de dónde sale la imagen, el vídeo o la cita. Muchas veces es real pero de otro lugar u otra época.</li>
        </ol>
        <h3>Herramientas</h3>
        <ul>
          <li><b>Búsqueda inversa de imágenes</b> con Google Lens o TinEye: subes una imagen y te dice dónde ha aparecido antes.</li>
          <li><b>Verificadores:</b> Maldita.es, Newtral y EFE Verifica comprueban y desmienten bulos.</li>
          <li><b>Lectura atenta:</b> la URL, la fecha, el autor, las faltas de ortografía y si cita fuentes.</li>
        </ul>
        <h3>Cómo detectar un deepfake</h3>
        <ul>
          <li>Rostros con bordes borrosos, piel demasiado lisa o parpadeo extraño.</li>
          <li>Labios que no encajan del todo con el audio.</li>
          <li>Manos con dedos de más o deformados, textos imposibles de leer, sombras y reflejos raros.</li>
          <li>Voz plana o con entonación poco natural.</li>
          <li>Y lo más fiable: comprobar si alguna fuente seria recoge ese vídeo o esa declaración.</li>
        </ul>
        <h3>La IA no siempre tiene razón</h3>
        <ul>
          <li><b>Alucinaciones:</b> la IA puede inventarse datos, citas o fuentes con total seguridad.</li>
          <li><b>Sesgos:</b> aprende de textos e imágenes de Internet y puede repetir estereotipos.</li>
          <li><b>Información desactualizada:</b> puede no conocer lo más reciente.</li>
          <li><b>Úsala bien:</b> compruébala siempre, pídele las fuentes y revísalas, no le des datos personales y di cuándo la has usado.</li>
        </ul>`,
       tareas:[
        {n:1, t:"Aprendemos a verificar", html:"<p>Trabajamos la teoría en clase. Después, comprueba lo que sabes con la ficha interactiva «¿Bulo o verdad?».</p>", evalua:"sa6a1"},
        {n:2, t:"Laboratorio de verificación", html:`<p>Aquí tienes un dosier con mensajes, imágenes, vídeos y noticias que han circulado de verdad. Algunos son reales y otros falsos o generados con IA. Para cada pieza, completa un informe:</p><ol><li>¿Qué dice o qué muestra?</li><li>¿Quién lo publica y cuándo?</li><li>¿Qué has hecho para comprobarlo? (búsqueda inversa, otros medios, verificadores…)</li><li>Conclusión: real, falso o manipulado.</li><li>La prueba: el enlace o la captura que lo demuestra.</li></ol><p>Lo que más cuenta no es acertar, sino que tu proceso sea sólido y esté demostrado. La plantilla del informe está en el canal de Teams de la materia.</p><h4>El dosier</h4><p>Cuidado: no todo es falso.</p>${dosierHTML()}`, entrega:"Informe de verificación por Teams", evalua:"sa6a2", enlaces:[["Google Lens","https://lens.google/"],["TinEye","https://tineye.com/"],["Maldita.es","https://maldita.es/"],["Newtral","https://www.newtral.es/"],["EFE Verifica","https://verifica.efe.com/"]]},
        {n:3, t:"La IA bajo la lupa", html:"<p>Con <b>Gemini</b>, haz una pregunta sobre un tema que conozcas bien o que puedas comprobar. Repítela varias veces y formulada de distintas maneras (si el profesor lo permite, compárala también con otra IA).</p><ul><li>Compara las respuestas: ¿coinciden? ¿Alguna se contradice?</li><li>Comprueba los datos con fuentes fiables. ¿Has encontrado errores o datos inventados?</li><li>Pide las fuentes y revisa si existen de verdad.</li><li>Busca sesgos: ¿hay estereotipos o puntos de vista que faltan?</li></ul><p>Recoge tus conclusiones en un documento con capturas.</p>", entrega:"Análisis con capturas por Teams", evalua:"sa6a2"},
        {n:4, t:"Debate: dilemas digitales", html:"<p>Debatimos sobre un dilema digital real. Algunas propuestas:</p><ul><li>¿Se debería poder usar la IA para hacer los deberes?</li><li>¿Debería subir la edad mínima para tener redes sociales?</li><li>¿Móviles en el aula: sí o no?</li><li>¿Deberían las redes sociales borrar los bulos o eso es censura?</li></ul><p>Prepara tus argumentos con datos verificados y cita de dónde salen. En el debate se valora tanto la fuerza de tus argumentos como el respeto a quien opina distinto.</p>", evalua:"sa6a2"},
        {n:5, t:"Tu kit antibulos", html:"<p>Crea una infografía con tu propio método para no caer en bulos: los pasos para verificar, las señales de alarma, las herramientas y los verificadores. Debe ser útil para cualquier persona de tu familia.</p>", entrega:"Infografía en PDF por Teams", evalua:"sa6a2"}
       ],

      ,{id:"dig4-mayores", etiqueta:"Situación de aprendizaje 7", titulo:"Enseña a tus mayores", subtitulo:"Brecha digital, comercio y administración electrónica",
       bloque:"Bloque 4. Ciudadanía digital crítica",
       desc:"Descubrimos qué es la brecha digital escuchando a una persona mayor de nuestro entorno, aprendemos a comprar y hacer trámites por Internet con seguridad y le enseñamos algo que de verdad necesite.",
       criterios:["2.3","2.5","3.3","3.4","4.1","4.2","5.2"],
       producto:"Entrevista, guía paso a paso adaptada, sesión de enseñanza y reflexión sobre la brecha digital.",
       anexos:["sa7a1","sa7a2","sa7a3"],
       teoria:`
        <h3>La brecha digital</h3>
        <p>La <b>brecha digital</b> es la diferencia entre las personas que pueden usar la tecnología con soltura y las que no. No consiste solo en tener o no tener Internet:</p>
        <div class="defs">
          <div><b>Brecha de acceso</b><p>No tener dispositivo, conexión o una conexión de calidad.</p></div>
          <div><b>Brecha de uso</b><p>Tener el dispositivo pero no saber usarlo para lo que se necesita.</p></div>
          <div><b>Brecha de calidad</b><p>Usarlo, pero sin seguridad ni aprovechar todo lo que ofrece; por ejemplo, caer en timos.</p></div>
        </div>
        <p>Influyen la edad, los ingresos, vivir en una zona rural, el nivel de estudios o tener una discapacidad. Hoy pedir cita médica, cobrar una ayuda o hablar con el banco se hace cada vez más por Internet, así que quien se queda fuera pierde derechos y autonomía.</p>
        <h3>Comprar por Internet con seguridad</h3>
        <ul>
          <li><b>¿La tienda es real?</b> Busca el aviso legal con el nombre de la empresa, su dirección y un teléfono. Busca opiniones fuera de la propia web.</li>
          <li><b>Desconfía de los chollos:</b> precios muy por debajo de lo normal son la señal típica de una tienda falsa.</li>
          <li><b>El candado (https) no basta:</b> indica que la conexión está cifrada, no que la tienda sea honrada.</li>
          <li><b>Paga de forma segura:</b> tarjeta (mejor virtual o de prepago) o plataformas de pago conocidas. Nunca transferencias ni Bizum a desconocidos.</li>
          <li><b>Tus derechos:</b> en compras online en la Unión Europea tienes, en general, 14 días para devolver un producto sin dar explicaciones. Y en España los productos nuevos tienen 3 años de garantía.</li>
        </ul>
        <h3>La administración electrónica</h3>
        <p>Muchos trámites se pueden hacer desde casa en la <b>sede electrónica</b> de cada organismo: pedir cita médica, consultar notas, presentar la renta, pedir un certificado…</p>
        <div class="defs">
          <div><b>Sede electrónica</b><p>La web oficial de un organismo para hacer trámites. Su dirección suele terminar en <i>.gob.es</i> o en la de la comunidad autónoma.</p></div>
          <div><b>Cl@ve</b><p>Sistema para identificarte ante la Administración con el móvil, sin certificado.</p></div>
          <div><b>Certificado digital y DNIe</b><p>Tu identidad electrónica, que equivale a tu firma.</p></div>
          <div><b>Carpeta Ciudadana</b><p>Web donde consultar en un solo sitio tus datos y trámites con la Administración.</p></div>
        </div>
        <p class="ask">Recuerda: la Administración y los bancos nunca te piden contraseñas ni códigos por SMS, correo o teléfono.</p>`,
       tareas:[
        {n:1, t:"Aprendemos la teoría", html:"<p>Trabajamos en clase la brecha digital, la compra segura y la administración electrónica. Después, comprueba lo que sabes con la ficha interactiva.</p>", evalua:"sa7a1"},
        {n:2, t:"Entrevista a una persona mayor", html:"<p>Elige a una persona mayor de tu entorno: tus abuelos, un vecino, un familiar… Explícale el proyecto y pídele permiso. Hazle la entrevista del Anexo 3 para conocer qué usa, qué le cuesta y qué le gustaría aprender.</p><ul><li>No grabes ni fotografíes sin su permiso.</li><li>Sus datos personales no salen del trabajo de clase.</li></ul><p>Si no tienes a nadie a quien entrevistar, habla con el profesor: te propondrá una alternativa.</p>", entrega:"Resumen de la entrevista por Teams", evalua:"sa7a1"},
        {n:3, t:"Diagnóstico y guía paso a paso", html:"<p>A partir de la entrevista, elige <b>una</b> necesidad concreta y realista. Algunas ideas:</p><ul><li>Hacer una videollamada con la familia.</li><li>Pedir cita médica por Internet.</li><li>Reconocer un mensaje de estafa.</li><li>Comprar algo en una tienda online fiable.</li><li>Guardar y enviar fotos.</li><li>Ampliar la letra o configurar el móvil para verlo mejor.</li></ul><p>Prepara una guía paso a paso pensada para esa persona: letra grande, capturas de pantalla, pocas palabras y un paso por imagen. Incluye siempre un consejo de seguridad.</p>", entrega:"Guía en PDF por Teams", evalua:"sa7a2"},
        {n:4, t:"Sesión de enseñanza", html:"<p>Enseña a tu mayor con tu guía. La regla de oro: <b>no lo hagas tú por él o ella</b>. Explica, deja que lo haga, equivócate con paciencia y repite. Al acabar, pídele que responda el cuestionario de valoración del Anexo 3.</p>", entrega:"Cuestionario de valoración y una evidencia (foto de la sesión con permiso o breve descripción)", evalua:"sa7a2"},
        {n:5, t:"¿Lo sabe hacer solo?", html:"<p>Unos días después, comprueba si tu mayor es capaz de hacerlo sin ayuda. Anota qué ha recordado, qué ha olvidado y cómo mejorarías tu guía.</p>", evalua:"sa7a1"},
        {n:6, t:"Reflexión: la brecha digital a nuestro alrededor", html:"<p>Presenta a la clase tu experiencia: a quién has enseñado (sin datos personales), qué necesitaba, cómo fue y qué has aprendido. Terminad entre todos con propuestas para reducir la brecha digital en vuestro barrio o en el colegio.</p>", entrega:"Presentación en clase", evalua:"sa7a2"}
       ],

      ,{id:"dig4-ia-app", etiqueta:"Situación de aprendizaje 8", titulo:"Crea tu herramienta con IA", subtitulo:"De la idea a la app, con la IA de ayudante",
       bloque:"Bloque 2. Digitalización del entorno personal de aprendizaje",
       desc:"La IA puede escribir una app en segundos, pero solo funciona bien si sabes pedirla, probarla y entenderla. Creamos una pequeña herramienta web útil para nosotros, la mejoramos versión a versión y aprendemos a leer su código.",
       criterios:["2.4","4.1","5.1","5.2","5.4"],
       producto:"Herramienta web funcional, con su ficha de requisitos, diario de versiones y documentación.",
       anexos:["sa8a1","sa8a2"],
       teoria:`
        <p>Una <b>aplicación web</b> funciona en el navegador de cualquier dispositivo (iPad, móvil u ordenador) sin instalar nada: por eso es <b>multiplataforma</b>. Está hecha con tres lenguajes:</p>
        <div class="defs">
          <div><b>HTML</b><span>La estructura</span><p>Qué hay en la página: títulos, textos, botones, casillas.</p></div>
          <div><b>CSS</b><span>El aspecto</span><p>Cómo se ve: colores, tamaños, tipos de letra, posiciones.</p></div>
          <div><b>JavaScript</b><span>El comportamiento</span><p>Qué hace: calcular, guardar, reaccionar cuando pulsas un botón.</p></div>
        </div>
        <h3>Cómo pedirle una app a la IA</h3>
        <p>La IA hace lo que le pides, no lo que quieres. Un buen encargo incluye:</p>
        <ul>
          <li><b>Objetivo:</b> qué problema resuelve y para quién.</li>
          <li><b>Funciones:</b> la lista concreta de lo que debe hacer (y lo que no).</li>
          <li><b>Diseño:</b> colores, tamaño de letra, que se vea bien en el iPad.</li>
          <li><b>Formato:</b> «todo en un solo archivo HTML, sin librerías externas».</li>
          <li><b>Ejemplo:</b> unos datos de prueba para ver cómo funciona.</li>
        </ul>
        <p class="ask">Pide de poco en poco: primero lo básico y, cuando funcione, añade funciones de una en una.</p>
        <h3>El ciclo de trabajo</h3>
        <ol class="steps4">
          <li><b>Describe</b> lo que quieres con precisión.</li>
          <li><b>Genera</b> el código con la IA y pégalo en el editor.</li>
          <li><b>Prueba</b> todo, también los casos raros: campos vacíos, números negativos, textos muy largos.</li>
          <li><b>Corrige:</b> explica a la IA el fallo exacto («al pulsar Calcular con la casilla vacía sale NaN») en vez de «no funciona».</li>
          <li><b>Entiende:</b> pide que te explique las partes del código y cambia tú algo a mano.</li>
        </ol>
        <h3>Usar la IA con cabeza</h3>
        <ul>
          <li>La IA se equivoca: el código puede tener fallos aunque parezca perfecto. Pruébalo siempre.</li>
          <li>No metas datos personales tuyos ni de otras personas en la IA ni en la app.</li>
          <li>Di qué partes ha hecho la IA. Atribuir el trabajo con honestidad también es competencia digital.</li>
          <li>Si usas imágenes, iconos o código de otros, comprueba su licencia y cítalos.</li>
        </ul>`,
       tareas:[
        {n:1, t:"Aprendemos cómo funciona", html:"<p>Trabajamos en clase qué es una app web, cómo se le pide a una IA y el ciclo de trabajo. Comprueba lo que sabes con la ficha interactiva.</p>", evalua:"sa8a1"},
        {n:2, t:"Detecta un problema y escribe los requisitos", html:"<p>Piensa en algo de tu día a día que una pequeña herramienta podría facilitar. Algunas ideas: un organizador de estudio, una calculadora de gastos, un repaso de vocabulario, un temporizador para estudiar, un conversor de unidades, un marcador para un deporte…</p><p>Escribe la <b>ficha de requisitos</b>:</p><ul><li>¿Qué problema resuelve y para quién?</li><li>Funciones mínimas (entre 3 y 5).</li><li>Cómo se tiene que ver.</li><li>Qué NO va a hacer.</li></ul>", entrega:"Ficha de requisitos por Teams", evalua:"sa8a2"},
        {n:3, t:"Primer prototipo", html:"<p>Con <b>Gemini</b>, escribe tu encargo a partir de la ficha de requisitos. Prueba la app en la vista previa de Gemini (Canvas), si tu cuenta la tiene, o pega el código en un editor web como CodePen, y comprueba que funciona. Guarda el encargo (el prompt) que has usado: forma parte de la entrega.</p>", enlaces:[["CodePen","https://codepen.io/"]], evalua:"sa8a2"},
        {n:4, t:"Prueba y mejora", html:"<p>Haz un plan de pruebas con al menos cinco casos, incluidos casos raros. Anota en tu <b>diario de versiones</b> cada fallo que encuentres, cómo se lo explicaste a la IA y qué cambió. Llega como mínimo a la versión 3, añadiendo funciones de una en una.</p>", entrega:"Diario de versiones por Teams", evalua:"sa8a2"},
        {n:5, t:"Entiende tu código", html:"<p>Demuestra que entiendes lo que has creado:</p><ol><li>Señala en el código dónde está la estructura (HTML), el aspecto (CSS) y el comportamiento (JavaScript).</li><li>Explica con tus palabras qué hacen cinco partes del código.</li><li>Haz <b>tú, sin IA</b>, al menos un cambio a mano: un color, un texto, un nuevo botón o un cálculo, y explica qué has tocado.</li></ol>", entrega:"Explicación con capturas por Teams", evalua:"sa8a2"},
        {n:6, t:"Presenta tu herramienta", html:"<p>Presenta tu herramienta a la clase con una demostración en directo. Acompáñala de una breve documentación: qué hace, cómo se usa, qué partes hizo la IA, qué hiciste tú y qué mejorarías.</p>", entrega:"Enlace a la herramienta y documentación por Teams", evalua:"sa8a2"}
       ],
       items:[

  {

    intro:"Un proyecto por trimestre: creamos una empresa, construimos y ponemos a prueba estructuras, y aprendemos a resolver problemas tecnológicos con el método de proyectos.",
    presentacion:{
      cita:"La tecnología, como el arte, es un ejercicio altísimo de la imaginación humana.",
      texto:"La tecnología es el conjunto de conocimientos y técnicas que nos permiten resolver problemas y aprovechar en la práctica lo que sabemos de ciencia. En esta materia aprendemos haciendo: cada trimestre afrontamos un reto real y lo resolvemos con el proceso tecnológico, trabajando en equipo, con creatividad y pensando en la sostenibilidad.",

      {id:"tec3-empresa", etiqueta:"Situación de aprendizaje 1 · 1.er trimestre", titulo:"Crea tu propia empresa", subtitulo:"De la idea al prototipo",
       cita:["Si tú no trabajas por tus sueños, alguien te contratará para que trabajes por los suyos","Steve Jobs"],
       bloque:"Bloques: Proceso de resolución de problemas · Comunicación y difusión de ideas · Tecnología sostenible",
       desc:"Detectamos un problema real de nuestro entorno, lo convertimos en una oportunidad y creamos una empresa que lo resuelva: investigamos, diseñamos un prototipo, lo probamos con usuarios, creamos la marca y lo presentamos ante un jurado.",

       anexos:["t3m1","t3inf","t3m2"],
       teoria:`
        <h3>El proceso tecnológico</h3>
        <p>Es el método que siguen ingenieros y diseñadores para pasar de un problema a una solución que funciona. Lo usaremos en todos los proyectos del curso:</p>
        <ol class="steps4">
          <li><b>Identificar el problema</b> o la necesidad: ¿qué falla?, ¿a quién afecta?</li>
          <li><b>Buscar información:</b> qué existe ya, qué opinan los usuarios, qué se puede mejorar.</li>
          <li><b>Diseñar:</b> generar ideas, elegir la mejor y dibujarla con bocetos y croquis.</li>
          <li><b>Planificar:</b> materiales, herramientas, tareas, responsables y plazos.</li>
          <li><b>Construir</b> el prototipo con seguridad.</li>
          <li><b>Evaluar:</b> probarlo, detectar fallos y mejorarlo. Muchas veces hay que volver a pasos anteriores.</li>
          <li><b>Comunicar:</b> presentar la solución y documentarla en una memoria técnica.</li>
        </ol>
        <h3>Emprender: convertir problemas en oportunidades</h3>
        <p>Detrás de cada empresa hay una necesidad que no estaba bien resuelta. Emprender no siempre significa ganar dinero: una empresa puede ser <b>con ánimo de lucro</b> o <b>social</b>, si su objetivo principal es mejorar la vida de las personas o el medio ambiente.</p>
        <p>Una idea es <b>viable</b> cuando se sostiene desde tres puntos de vista:</p>
        <div class="defs">
          <div><b>Económico</b><p>Los ingresos cubren los costes. ¿Cuánto cuesta hacerlo? ¿A qué precio se vendería?</p></div>
          <div><b>Social</b><p>Resuelve un problema real a personas reales y no perjudica a nadie.</p></div>
          <div><b>Medioambiental</b><p>Usa los recursos con responsabilidad y contribuye a algún Objetivo de Desarrollo Sostenible (ODS).</p></div>
        </div>
        <h3>Herramientas del emprendedor</h3>
        <div class="defs">
          <div><b>Entrevista a usuarios</b><p>Preguntar a quienes tienen el problema antes de inventar la solución. Escuchar más que hablar.</p></div>
          <div><b>Mapa de empatía</b><p>Qué piensa, siente, ve, oye, dice y hace el usuario; qué le frustra y qué desea.</p></div>
          <div><b>¿Cómo podríamos…?</b><p>Convertir el problema en un reto: «¿Cómo podríamos ayudar a… a…?».</p></div>
          <div><b>Lean Canvas</b><p>El modelo de negocio en una página: problema, clientes, propuesta de valor, solución, canales, ingresos, costes, métricas y ventaja.</p></div>
        </div>
        <h3>El prototipo</h3>
        <p>Un <b>prototipo</b> es una versión de prueba de la solución. Sirve para aprender rápido y barato antes de invertir en el producto final.</p>
        <ul>
          <li><b>Baja fidelidad:</b> papel, cartón, plastilina o bocetos. Se hace en minutos y se puede tirar sin pena.</li>
          <li><b>Alta fidelidad:</b> una maqueta cuidada o una versión digital (pantallas en Keynote o Canva) que se parece mucho al producto real.</li>
          <li><b>Probar con usuarios:</b> lo importante no es que guste a tu equipo, sino que funcione para quien lo va a usar.</li>
        </ul>
        <h3>La marca</h3>
        <p>La marca no es solo un logotipo: es la imagen y la confianza que tu empresa genera. Se construye con:</p>
        <ul>
          <li><b>Misión</b> (qué hacemos y para quién), <b>visión</b> (en qué queremos convertirnos) y <b>valores</b> (cómo trabajamos).</li>
          <li><b>Nombre y eslogan:</b> breves, fáciles de recordar y que transmitan lo que os diferencia.</li>
          <li><b>Identidad visual:</b> logotipo, colores (cada color transmite sensaciones), tipografía e icono, siempre coherentes entre sí.</li>
        </ul>
        <h3>El marketing</h3>
        <p>El marketing estudia qué necesitan las personas para ofrecérselo de la mejor manera. Puede ser <b>tradicional</b> (carteles, folletos, degustaciones) o <b>digital</b> (redes sociales, web, correo, buscadores). Un plan de marketing responde a cuatro preguntas:</p>
        <ol class="steps4">
          <li><b>¿A quién?</b> El público objetivo: edad, intereses, dónde está y qué redes usa.</li>
          <li><b>¿Contra quién?</b> La competencia: qué hacen bien, qué hacen mal y en qué podéis ser mejores.</li>
          <li><b>¿Con qué?</b> Vuestros recursos: tiempo, responsables, frecuencia de publicación.</li>
          <li><b>¿Cómo y dónde?</b> Los canales y el tipo de contenido. En redes, la gente busca cercanía, respuestas, contenido útil o divertido y beneficios; nadie sigue a una marca que solo anuncia.</li>
        </ol>`,
       tareas:[
        {n:1, t:"El proceso tecnológico", html:"<p>Trabajamos en clase las fases del proceso tecnológico y haz una <b>infografía</b> que lo resuma, con un ejemplo de un objeto cotidiano.</p>", entrega:"Infografía en PDF por Teams", evalua:"t3inf"},
        {n:2, t:"Lluvia de ideas: ¿qué problemas vemos?", html:"<p>Entre toda la clase, recogemos en Mentimeter problemas o necesidades de nuestro entorno: el colegio, el barrio, Paiporta, la gente joven, las personas mayores, el medio ambiente… Después se forman los equipos de trabajo.</p>", enlaces:[["Mentimeter","https://www.mentimeter.com"]]},
        {n:3, t:"Empatizar: escuchamos a los usuarios", html:"<p>Cada equipo elige tres problemas de la lluvia de ideas. Para cada uno, entrevistad al menos a cinco personas que lo sufran. Preguntad por su experiencia, no por vuestra solución: «¿Cuándo te pasa?», «¿Qué haces ahora?», «¿Qué es lo que más te molesta?».</p><p>Con las respuestas, completad un <b>mapa de empatía</b> de vuestro usuario.</p>", entrega:"Entrevistas y mapa de empatía en la memoria", evalua:"t3m2"},
        {n:4, t:"Definir e idear", html:"<ol><li>Escribid el reto como pregunta: «¿Cómo podríamos…?».</li><li>Cada miembro aporta ideas en silencio durante cinco minutos; después las compartís sin criticarlas.</li><li>Investigad qué soluciones existen ya y qué podéis mejorar.</li><li>Elegid la idea final con una <b>matriz de decisión</b>: puntuad de 1 a 5 cada idea según su impacto, viabilidad, originalidad y coste.</li></ol>", evalua:"t3m2"},
        {n:5, t:"Modelo de negocio y viabilidad", html:"<p>Completad el <b>Lean Canvas</b> de vuestra empresa y estudiad su viabilidad:</p><ul><li><b>Económica:</b> calculad cuánto cuesta producir una unidad, a qué precio la venderíais y cuántas tendríais que vender para cubrir los gastos.</li><li><b>Social:</b> a quién ayuda y cómo.</li><li><b>Medioambiental:</b> materiales, residuos, consumo de energía y con qué ODS se relaciona.</li></ul>", evalua:"t3m2"},
        {n:6, t:"Prototipo de baja fidelidad", html:"<p>Construid una primera versión rápida con materiales sencillos (papel, cartón, plastilina) o con bocetos de las pantallas si es una app o un servicio. Fotografiadlo: irá a la memoria.</p>", evalua:"t3m2"},
        {n:7, t:"Probamos con usuarios", html:"<p>Enseñad el prototipo a usuarios reales y dejad que lo usen sin explicar demasiado. Recoged su opinión con la <b>malla de feedback</b>: qué les gusta, qué cambiarían, qué preguntas les surgen y qué ideas nuevas aportan. Con eso, decidid qué mejorar.</p>", evalua:"t3m2"},
        {n:8, t:"Prototipo final", html:"<p>Construid el prototipo de alta fidelidad aplicando las mejoras: una maqueta cuidada o una versión digital en Keynote o Canva que se parezca al producto real. Respetad las normas de seguridad del taller.</p>", entrega:"Fotos o vídeo del prototipo en la memoria", evalua:"t3m2"},
        {n:9, t:"Memoria técnica", html:"<p>Documentad todo el proyecto en la memoria técnica: el problema, la investigación, las ideas, el diseño con bocetos y medidas, la planificación (materiales, tareas, responsables y plazos), el prototipo, las pruebas y las mejoras.</p>", enlaces:[["Plantilla de la memoria técnica (OneDrive del colegio)","https://lainmaculada-my.sharepoint.com/:w:/g/personal/ruben_lainmaculada_es/ETbTvmkVJ6hMvpquomQdUQcB--84eA0lF5zzvKFRYyvqEQ?e=3ngL7g"]], entrega:"Memoria técnica por Teams", evalua:"t3m2"},
        {n:10, t:"Identidad de marca", html:"<ol><li>Escribid la misión, la visión y los valores de la empresa.</li><li>Elegid el nombre (podéis inspiraros con un generador de nombres, filtrando los resultados) y un eslogan.</li><li>Escoged los colores explicando por qué, la tipografía y un icono.</li><li>Diseñad el logotipo en Canva y comprobad que es coherente con todo lo anterior.</li></ol>", enlaces:[["Generador de nombres","https://businessnamegenerator.com"],["Psicología del color (Canva)","https://www.canva.com/es_mx/aprende/psicologia-del-color/"],["Combinar tipografías (Fontjoy)","https://fontjoy.com"],["Iconos (Flaticon)","https://www.flaticon.es"]], evalua:"t3m2"},
        {n:11, t:"Plan de marketing y campaña", html:"<p>Elaborad el plan de marketing en cuatro pasos: público objetivo, competencia (los tres competidores principales), recursos y estrategia de canales.</p><p>Después, diseñad en Canva el <b>perfil de la empresa</b> en la red social elegida y un calendario con seis publicaciones coherentes con el plan. Es una maqueta: no se publica en redes reales. Si el profesor lo autoriza, las mejores se podrán difundir desde los canales oficiales del colegio.</p>", entrega:"Plan de marketing y maqueta del perfil por Teams", evalua:"t3m2"},
        {n:12, t:"Pitch final", html:"<p>Presentad vuestra empresa ante un jurado en un máximo de tres minutos, como en un concurso de emprendimiento:</p><ol><li><b>Gancho:</b> una pregunta, un dato o una historia.</li><li><b>Problema</b> y a quién afecta.</li><li><b>Solución</b> y demostración del prototipo.</li><li><b>Qué os diferencia</b> de la competencia.</li><li><b>Viabilidad:</b> costes, precio e impacto.</li><li><b>Equipo y cierre.</b></li></ol>", entrega:"Presentación en Keynote o Canva por Teams", evalua:"t3m2"}
       ],
