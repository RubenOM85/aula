      {id:"tec3-estructuras", etiqueta:"Situación de aprendizaje 3 · 3.er trimestre", titulo:"Estructuras 3E", subtitulo:"Estable, Eficiente y Elegante",
       bloque:"Bloques: Proceso de resolución de problemas · Comunicación y difusión de ideas · Tecnología sostenible",
       desc:"¿Puede una estructura ser estable, eficiente y elegante a la vez? Investigamos su evolución histórica, experimentamos con cargas y esfuerzos, diseñamos en 3D y construimos un puente de papel para el concurso de carga máxima del colegio.",
       criterios:["1.1","1.2","2.1","2.2","3.1","4.1"],
       producto:"Maqueta de un puente que cumpla las 3E, sobre un tablero de cartón de 50 × 15 cm, para el concurso de carga máxima del colegio.",
       anexos:["t3eV","t3e0","t3e1","t3e2","t3e3","t3e4"],
       teoria:`
        <p>En arquitectura e ingeniería hay tres palabras que guían cualquier diseño: <b>Estable</b> (cumple su función sin deformarse ni caerse), <b>Eficiente</b> (usa el material necesario y suficiente) y <b>Elegante</b> (además de funcionar, es bello). En este proyecto descubriremos si una estructura puede cumplir las tres a la vez.</p>
        <p class="ask">Durante todo el proyecto usarás <b>GoodNotes como diario de aprendizaje</b>: ahí irás guardando información, respuestas, fotos y vídeos de cada tarea. Al final se entrega al profesor.</p>
        <h3>¿Qué es una estructura?</h3>
        <p>Es el conjunto de elementos de un objeto o construcción que soporta las cargas y mantiene su forma. Para cumplir su función, una estructura debe ser:</p>
        <div class="defs">
          <div><b>Resistente</b><p>Soporta las cargas sin romperse.</p></div>
          <div><b>Rígida</b><p>No se deforma de manera apreciable al recibir las cargas.</p></div>
          <div><b>Estable</b><p>No vuelca ni se desplaza: se mantiene en equilibrio.</p></div>
        </div>
        <h3>Cargas</h3>
        <p>Las <b>cargas</b> son las fuerzas que actúan sobre una estructura. Pueden ser <b>fijas</b> (su propio peso) o <b>variables</b> (personas, vehículos, viento, nieve), y <b>puntuales</b> (en un punto) o <b>repartidas</b> (a lo largo de una superficie, de forma uniforme o no).</p>
        <h3>Esfuerzos</h3>
        <p>Cuando las cargas actúan sobre un elemento, este sufre un <b>esfuerzo</b> y tiende a deformarse:</p>
        <div class="defs">
          <div><b>Tracción</b><p>Las cargas tiran del elemento en la misma dirección y sentidos contrarios: tiende a alargarse y adelgazar. Ej.: el cable de un ascensor.</p></div>
          <div><b>Compresión</b><p>Las cargas empujan en la misma dirección y sentidos opuestos: tiende a acortarse y ensancharse. Ej.: un pilar.</p></div>
          <div><b>Flexión</b><p>Las cargas tienden a doblarlo: una parte se comprime y la otra se estira. Ej.: una viga o una estantería.</p></div>
          <div><b>Torsión</b><p>Las cargas tienden a retorcerlo. Ej.: una llave al girar en la cerradura.</p></div>
          <div><b>Cortante o cizalladura</b><p>Dos cargas paralelas, muy próximas y en sentidos contrarios tienden a cortarlo. Ej.: unas tijeras sobre el papel.</p></div>
        </div>
        <h3>Elementos estructurales</h3>
        <div class="defs">
          <div><b>Cimentación</b><p>Reparte el peso de la estructura sobre el terreno.</p></div>
          <div><b>Pilar o columna</b><p>Elemento vertical que soporta las cargas a compresión.</p></div>
          <div><b>Viga</b><p>Elemento horizontal apoyado en pilares; trabaja a flexión.</p></div>
          <div><b>Forjado</b><p>Superficie horizontal (suelos y techos) que reparte las cargas a las vigas.</p></div>
          <div><b>Arco</b><p>Elemento curvo que convierte las cargas en compresión hacia los apoyos.</p></div>
          <div><b>Tirante o tensor</b><p>Cable o barra que trabaja a tracción, como en los puentes colgantes.</p></div>
        </div>
        <h3>Tipos de estructuras artificiales</h3>
        <ul>
          <li><b>Masivas:</b> mucho material y pocos huecos (pirámides, presas).</li>
          <li><b>Adinteladas:</b> pilares y vigas horizontales (templos griegos).</li>
          <li><b>Abovedadas:</b> arcos, bóvedas y cúpulas (acueductos, catedrales).</li>
          <li><b>Entramadas:</b> pilares, vigas y forjados unidos (edificios actuales).</li>
          <li><b>Trianguladas:</b> barras formando triángulos (torres eléctricas, grúas, muchos puentes).</li>
          <li><b>Colgadas:</b> el tablero cuelga de cables (puentes colgantes).</li>
          <li><b>Laminares, neumáticas y geodésicas:</b> láminas curvas, estructuras hinchables y cúpulas formadas por triángulos.</li>
        </ul>
        <h3>El secreto del triángulo</h3>
        <p>Un cuadrado de barras unidas por las esquinas se deforma con facilidad; un triángulo, no: es la única figura indeformable. Por eso se <b>triangulan</b> las estructuras. Además, la <b>forma</b> del material importa tanto como el material: un folio plano se dobla enseguida, pero enrollado en tubo soporta mucho más. Eso es un <b>perfil</b>.</p>`,
       tareas:[
        {n:1, t:"Evolución histórica · Observamos", html:"<p>Mira el vídeo y responde en tu diario: ¿qué aspectos han provocado la evolución de las estructuras?</p>", enlaces:[["Vídeo: la evolución de las estructuras","https://www.youtube.com/watch?v=lmro2FvfZLQ"]], evalua:"t3e4"},
        {n:2, t:"Evolución histórica · Decidimos", html:"<p>A lo largo de la historia se han construido estructuras para cubrir necesidades: transporte (puentes, túneles), vivienda, protección frente a desastres (presas, diques), almacenamiento, salud, educación, ocio, trabajo o religión. Elige qué tipo de estructura vas a investigar.</p>"},
        {n:3, t:"Evolución histórica · Investigamos", html:"<p>Busca la historia y la importancia de la estructura elegida y al menos <b>cuatro ejemplos de épocas distintas</b>. De cada uno: ubicación, fecha, materiales, características del diseño y datos curiosos. Usa la ficha de recogida de datos, anota las fuentes y respeta los derechos de autor de las imágenes.</p>", enlaces:[["Ficha de recogida de datos (CEDEC)","https://cedec.intef.es/rubrica/ficha-de-recogida-de-datos/"],["Guía de licencias y derechos de autor","https://descargas.intef.es/cedec/proyectoedia/guias/contenidos/guiadelicencias/derechos_de_autor.html"]], evalua:"t3e4"},
        {n:4, t:"Evolución histórica · Creamos el póster", html:"<p>Crea un póster digital con: título («Evolución histórica de…»), importancia e historia resumida, imágenes de cada época con su ubicación y fecha, y una reflexión sobre qué ha provocado la evolución:</p><ul><li><b>Materiales:</b> cómo han cambiado y con qué ventajas e inconvenientes.</li><li><b>Técnicas constructivas:</b> qué avances técnicos y de ingeniería las han hecho posibles.</li><li><b>Estilos:</b> qué factores sociales, culturales y económicos han influido.</li><li><b>Medio ambiente:</b> qué impacto tienen y qué podemos aprender de la construcción tradicional.</li></ul>", entrega:"Póster en PDF por Teams", evalua:"t3e0"},
        {n:5, t:"Las 3E · Observamos", html:"<p>Observa estos casos en los que las estructuras dejaron de cumplir su función. ¿Qué crees que falló en cada uno?</p>", enlaces:[["Colapso del puente de Tacoma Narrows","https://www.youtube.com/watch?v=DNrg-lWvuhg"],["Demoliciones espectaculares","https://www.youtube.com/watch?v=j-zczJXSxnw"],["Colapso del puente de Baltimore","https://www.youtube.com/watch?v=5yqUMpLtAJM"],["Derrumbe del puente de Picanya","https://www.youtube.com/watch?v=ay2miI0W33E"]], evalua:"t3e4"},
        {n:6, t:"Las 3E · Investigamos", html:"<p>Responde en tu diario: ¿qué es una estructura? ¿Qué significa que sea estable? ¿Y eficiente? ¿Y estética? Apóyate en la teoría, el vídeo y los apuntes.</p>", enlaces:[["Vídeo: definición de estructura","https://www.youtube.com/watch?v=KYFLQj5nLjQ"],["Apuntes de estructuras (Pelandintecno)","https://www3.gobiernodecanarias.org/medusa/ecoblog/ilopmon/files/2017/10/pelandintecno-2eso-t3-estructuras.pdf"]], evalua:"t3e4"},
        {n:7, t:"Las 3E · Experimentamos con Build a Bridge", html:"<p>En la app <b>Build a Bridge</b> del iPad, refuerza estructuras que se desestabilizan al añadir cargas. Cada barra cuesta dinero, como en la vida real. Responde: ¿cuánto has tardado? ¿Qué forma geométrica se repite? ¿Cómo has hecho la estructura más resistente?</p>", evalua:"t3e4"},
        {n:8, t:"Reto: la torre de espaguetis", html:"<p>En equipo, construid con espaguetis, plastilina e hilo la torre más alta, estable, eficiente y elegante posible, y que soporte carga. Fotografiadla y subid la foto y la rúbrica a vuestro diario.</p>", evalua:"t3e1"},
        {n:9, t:"Esfuerzos · Identificamos", html:"<p>Copia en tu diario la imagen de los esfuerzos que muestra el profesor y escribe el nombre de cada uno. Después haz la ficha interactiva de esfuerzos.</p>", evalua:"t3e4"},
        {n:10, t:"Esfuerzos · Los aplicamos", html:"<p>Aplica uno a uno los cinco esfuerzos sobre una nube de golosina. Fotografía cada deformación y completa la ficha de análisis: ¿qué le pasa a su longitud y a su grosor?</p>", evalua:"t3e4"},
        {n:11, t:"Cargas · Practicamos con un folio", html:"<p>Dobla un folio con tres pliegues longitudinales y dobla 5 cm de cada extremo en ángulo recto para hacer una «mesa». Aplica las cargas de una en una, fotografía y anota la deformación:</p><ul><li>Una goma en el centro (carga puntual centrada).</li><li>La goma cerca de un lateral (carga puntual excéntrica).</li><li>Un lápiz a lo largo (carga repartida uniforme).</li><li>Plastilina con forma irregular (carga repartida no uniforme).</li></ul>", evalua:"t3e4"},
        {n:12, t:"Practicopedia de los esfuerzos", html:"<p>Cread un vídeo de entre 1 y 1,5 minutos que explique los cinco esfuerzos solo con <b>voz en off y dibujos</b>:</p><ol><li><b>Guion:</b> qué es un esfuerzo, los cinco tipos (cargas, deformación y un ejemplo real de cada uno) y una conclusión. Empezad con una pregunta que enganche.</li><li><b>Dibujos:</b> títulos con lettering, flechas y dibujos que se vean bien en cámara.</li><li><b>Ensayo:</b> sincronizad la voz con los dibujos.</li><li><b>Grabación:</b> una persona graba, otra lee y otra va mostrando los dibujos.</li><li><b>Edición:</b> con título y créditos.</li></ol><p class=\"ask\">La voz tiene que ser vuestra y el vídeo se graba en clase: no vale generar voz ni vídeo con IA.</p>", enlaces:[["Ejemplo de practicopedia","https://www.youtube.com/watch?v=6_iAsR-ZfGw"]], entrega:"Vídeo por Teams", evalua:"t3e2"},
        {n:13, t:"Diseñamos en 3D con Tinkercad", html:"<p>Diseña en Tinkercad una estructura que combine distintos elementos estructurales: pilares, vigas, arcos, tirantes, triangulaciones… Entra con tu cuenta del colegio o con el código de clase. Haz una captura y guárdala en tu diario.</p>", enlaces:[["Tinkercad","https://www.tinkercad.com/login"],["Tutorial de Tinkercad","https://www.youtube.com/watch?v=tcvujxk1Iqg"],["Tipos de estructuras (Pelandintecno)","http://pelandintecno.blogspot.com/2018/01/clasificando-diferentes-tipos-de.html"]], entrega:"Captura en el diario", evalua:"t3e4"},
        {n:14, t:"Tarea final: el puente 3E", html:`<p>¡Es el momento de ser ingenieros! Diseñad y construid un puente que cumpla las 3E para el <b>concurso de carga máxima</b> del colegio.</p>
          <h4>Materiales (solo estos)</h4>
          <ul><li>Tablero de cartón de 50 × 15 cm.</li><li>Folios, preferiblemente usados (empezad a guardarlos ya).</li><li>Pegamento de barra y silicona caliente con su pistola.</li><li>Hilo de lana, solo para tensores.</li></ul>
          <h4>Pasos</h4>
          <ol><li><b>Diseño:</b> bocetos del puente con medidas y el tipo de estructura elegido. ¿Dónde habrá tracción y dónde compresión?</li><li><b>Planificación:</b> tareas, responsables y plazos.</li><li><b>Perfiles:</b> enrollad los folios en tubos finos y apretados, en diagonal sobre un lápiz o una varilla, y pegad el borde con barra.</li><li><b>Construcción:</b> montad las vigas laterales triangulando, unidlas con tubos transversales y pegad la estructura al tablero con silicona. Dejad secar.</li><li><b>Pesaje:</b> pesad el puente antes de la prueba.</li><li><b>Prueba de carga:</b> se añade peso poco a poco hasta que colapse. Documentad todo con fotos y vídeo para el diario.</li></ol>
          <h4>Calcula la eficiencia de tu puente</h4>
          <p>Eficiencia = peso del puente ÷ carga máxima soportada. Cuanto más pequeño el número, mejor: el puente soportó mucho en comparación con lo que pesa.</p>
          <div class="eff">
            <label for="eff-peso">Peso del puente (g)</label><input id="eff-peso" type="number" min="0" step="1" inputmode="decimal">
            <label for="eff-carga">Carga máxima soportada (g)</label><input id="eff-carga" type="number" min="0" step="1" inputmode="decimal">
            <output id="eff-out" for="eff-peso eff-carga">Introduce los dos datos.</output>
          </div>
          <p class="ask"><b>Seguridad:</b> cuidado con la silicona caliente; usad la pistola sobre su soporte. En la prueba de carga, solo sube peso quien indique el profesor. Las maquetas se expondrán en el centro y el concurso se grabará; solo se publicará en las redes del colegio con la autorización de las familias.</p>`, entrega:"Puente, fotos y vídeo en el diario", evalua:"t3e3"}

  t3m1:{titulo:"Anexo 1. Qué voy a valorar y cuánto cuenta", para:"todo el proyecto", html:`<div class="table-wrap"><table class="tbl ev"><thead><tr><th>Evidencia</th><th>Tarea</th><th>Cómo se valora</th><th>Criterios</th><th>Peso</th></tr></thead><tbody><tr><th>Infografía del proceso tecnológico</th><td>1</td><td>Rúbrica de la infografía (Anexo 2)</td><td>4.1</td><td>10 %</td></tr><tr><th>Investigación e idea</th><td>3–4</td><td>Rúbrica del proyecto (Anexo 3): filas A y B</td><td>1.1 · 1.2 · 2.1</td><td>15 %</td></tr><tr><th>Modelo de negocio y viabilidad</th><td>5</td><td>Rúbrica del proyecto: fila C</td><td>2.1 · 2.2</td><td>10 %</td></tr><tr><th>Prototipo y pruebas con usuarios</th><td>6–8</td><td>Rúbrica del proyecto: fila D</td><td>2.1 · 3.1</td><td>20 %</td></tr><tr><th>Memoria técnica</th><td>9</td><td>Rúbrica del proyecto: fila E</td><td>2.2 · 4.1</td><td>15 %</td></tr><tr><th>Marca y plan de marketing</th><td>10–11</td><td>Rúbrica del proyecto: fila F</td><td>1.1 · 2.1 · 4.1</td><td>10 %</td></tr><tr><th>Pitch final</th><td>12</td><td>Rúbrica del proyecto: fila G</td><td>4.1</td><td>15 %</td></tr><tr><th>Trabajo en equipo</th><td>Todas</td><td>Observación en clase y coevaluación: fila H</td><td>2.2</td><td>5 %</td></tr></tbody><tfoot><tr><th colspan="4">Total</th><th>100 %</th></tr></tfoot></table></div>`},
  t3m2:{titulo:"Anexo 3. Rúbrica del proyecto", para:"tareas 3 a 12", html:`<div class="table-wrap"><table class="tbl rub"><thead><tr><th>Qué se valora</th><th>4 · Excelente</th><th>3 · Satisfactorio</th><th>2 · Mejorable</th><th>1 · Insuficiente</th></tr></thead><tbody><tr><th>A. Investigación del problema<span class="crit">1.1</span></th><td>Entrevistas a usuarios reales bien preparadas; mapa de empatía completo; el problema está muy bien definido.</td><td>Entrevistas y mapa de empatía completos, con algún punto superficial.</td><td>Pocas entrevistas o mapa incompleto.</td><td>Sin investigación con usuarios.</td></tr><tr><th>B. Análisis y elección de la idea<span class="crit">1.2 · 2.1</span></th><td>Analizáis soluciones existentes y elegís la idea con una matriz de decisión justificada; la idea es original.</td><td>Analizáis lo que existe y justificáis la elección.</td><td>Análisis o justificación muy pobres.</td><td>No hay análisis ni justificación.</td></tr><tr><th>C. Modelo de negocio<span class="crit">2.1 · 2.2</span></th><td>Lean Canvas completo y coherente; costes, precio e impacto social y ambiental bien calculados y razonados.</td><td>Lean Canvas completo y viabilidad estudiada con algún error.</td><td>Lean Canvas incompleto o viabilidad poco estudiada.</td><td>Sin modelo de negocio.</td></tr><tr><th>D. Prototipo y pruebas<span class="crit">2.1 · 3.1</span></th><td>Prototipo de baja y de alta fidelidad bien construidos; probados con usuarios y mejorados a partir de su opinión.</td><td>Prototipos correctos y probados, con pocas mejoras.</td><td>Prototipo poco cuidado o sin pruebas con usuarios.</td><td>No hay prototipo.</td></tr><tr><th>E. Memoria técnica<span class="crit">2.2 · 4.1</span></th><td>Completa, ordenada y con vocabulario técnico; bocetos con medidas, planificación clara y fuentes citadas.</td><td>Completa con algún apartado poco desarrollado.</td><td>Incompleta o desordenada.</td><td>No se entrega o no sirve como documentación.</td></tr><tr><th>F. Marca y marketing<span class="crit">1.1 · 2.1 · 4.1</span></th><td>Identidad coherente y justificada (colores, tipografía, logo, eslogan); plan de marketing completo; publicaciones atractivas y coherentes.</td><td>Marca coherente y plan completo con algún fallo.</td><td>Marca poco cuidada o plan incompleto.</td><td>Sin marca ni plan.</td></tr><tr><th>G. Pitch<span class="crit">4.1</span></th><td>Claro, convincente y en tiempo; demostración del prototipo; respondéis con seguridad al jurado.</td><td>Claro y ordenado, con algún fallo de tiempo o seguridad.</td><td>Desordenado, leído o fuera de tiempo.</td><td>No se presenta.</td></tr><tr><th>H. Trabajo en equipo<span class="crit">2.2</span></th><td>Cumples tu parte a tiempo, aportas ideas y ayudas a resolver desacuerdos.</td><td>Cumples tu parte y colaboras.</td><td>Cumples solo parte de lo acordado.</td><td>No cumples tu parte.</td></tr></tbody></table></div><p class="desc">Cada fila se puntúa de 1 a 4 y se multiplica por 2,5 para pasarla a nota sobre 10.</p>`},
  t3eV:{titulo:"Anexo 1. Qué voy a valorar y cuánto cuenta", para:"todo el proyecto", html:`<div class="table-wrap"><table class="tbl ev"><thead><tr><th>Evidencia</th><th>Tarea</th><th>Cómo se valora</th><th>Criterios</th><th>Peso</th></tr></thead><tbody><tr><th>Póster de la evolución histórica</th><td>4</td><td>Rúbrica del póster (Anexo 2)</td><td>1.1 · 4.1</td><td>15 %</td></tr><tr><th>Reto de la torre de espaguetis</th><td>8</td><td>Rúbrica de la torre (Anexo 3)</td><td>2.1 · 3.1</td><td>10 %</td></tr><tr><th>Practicopedia de los esfuerzos</th><td>12</td><td>Rúbrica de la practicopedia (Anexo 4)</td><td>4.1</td><td>15 %</td></tr><tr><th>Puente 3E</th><td>14</td><td>Rúbrica del puente (Anexo 5)</td><td>2.1 · 2.2 · 3.1</td><td>35 %</td></tr><tr><th>Diario de aprendizaje</th><td>Todas</td><td>Rúbrica del diario (Anexo 6)</td><td>1.2 · 4.1</td><td>25 %</td></tr></tbody><tfoot><tr><th colspan="4">Total</th><th>100 %</th></tr></tfoot></table></div>`},
  t3e0:{titulo:"Anexo 2. Rúbrica del póster", para:"tarea 4", html:`<div class="table-wrap"><table class="tbl rub"><thead><tr><th>Qué se valora</th><th>4 · Excelente</th><th>3 · Satisfactorio</th><th>2 · Mejorable</th><th>1 · Insuficiente</th></tr></thead><tbody><tr><th>Contenido<span class="crit">1.1</span></th><td>Todos los apartados están completos, detallados y bien organizados.</td><td>Todos los apartados están presentes y claros.</td><td>Algunos apartados están incompletos o poco claros.</td><td>Faltan varios apartados o la información es insuficiente.</td></tr><tr><th>Diseño visual<span class="crit">4.1</span></th><td>Atractivo, claro y bien organizado; facilita la comprensión.</td><td>Claro y organizado, aunque podría ser más atractivo.</td><td>Poco atractivo y sin unidad visual.</td><td>Confuso, desordenado y difícil de seguir.</td></tr><tr><th>Creatividad y originalidad<span class="crit">4.1</span></th><td>Muy creativo y original; destaca visualmente.</td><td>Creatividad y originalidad adecuadas.</td><td>Algún elemento creativo, pero en general poco original.</td><td>Sin creatividad ni originalidad.</td></tr><tr><th>Coherencia y rigor<span class="crit">1.1</span></th><td>Muy bien organizado, con información precisa y fuentes citadas.</td><td>Bien organizado y con cierta coherencia.</td><td>Poca coherencia o información imprecisa.</td><td>Sin coherencia o con información incorrecta.</td></tr><tr><th>Reflexión y análisis<span class="crit">1.1</span></th><td>Responde a todas las preguntas guía con un análisis profundo y detallado.</td><td>Responde a todas las preguntas guía con cierta profundidad.</td><td>Responde solo a parte de las preguntas o de forma superficial.</td><td>Reflexión superficial o inexistente.</td></tr><tr><th>Presentación oral (opcional)<span class="crit">4.1</span></th><td>Clara y persuasiva; demuestra que domina el tema.</td><td>Clara y muestra que comprende el tema.</td><td>Limitada o poco clara.</td><td>No realizada o muy deficiente.</td></tr></tbody></table></div><p class="desc">Cada fila se puntúa de 1 a 4 y se multiplica por 2,5 para pasarla a nota sobre 10.</p>`},
  t3e1:{titulo:"Anexo 3. Rúbrica de la torre de espaguetis", para:"tarea 8", html:`<div class="table-wrap"><table class="tbl rub"><thead><tr><th>Qué se valora</th><th>4 · Excelente</th><th>3 · Satisfactorio</th><th>2 · Mejorable</th><th>1 · Insuficiente</th></tr></thead><tbody><tr><th>Altura<span class="crit">3.1</span></th><td>La más alta y se mantiene estable.</td><td>Buena altura y cierta estabilidad.</td><td>Altura moderada, pero poco estable.</td><td>Baja y poco estable.</td></tr><tr><th>Estabilidad<span class="crit">3.1</span></th><td>Sólida y estable, sin problemas.</td><td>Estable, con algún problema menor.</td><td>Tiene problemas de estabilidad y se tambalea.</td><td>Inestable: se derrumba con facilidad.</td></tr><tr><th>Eficiencia<span class="crit">2.1</span></th><td>Usa el mínimo material para ser alta y estable.</td><td>Usa una cantidad adecuada de material.</td><td>Usa material de más; se podría optimizar.</td><td>Usa material en exceso sin pensar en la eficiencia.</td></tr><tr><th>Estética<span class="crit">2.1</span></th><td>Diseño creativo y llamativo, muy elegante.</td><td>Diseño cuidado y atractivo.</td><td>Diseño básico, poco estético.</td><td>Sin diseño; poco atractiva.</td></tr><tr><th>Carga máxima<span class="crit">3.1</span></th><td>Soporta mucha carga sin mostrar debilidad.</td><td>Soporta una carga moderada sin problemas.</td><td>Soporta poca carga sin caerse.</td><td>No soporta ninguna carga.</td></tr></tbody></table></div><p class="desc">Cada fila se puntúa de 1 a 4 y se multiplica por 2,5 para pasarla a nota sobre 10.</p>`},
  t3e2:{titulo:"Anexo 4. Rúbrica de la practicopedia", para:"tarea 12", html:`<div class="table-wrap"><table class="tbl rub"><thead><tr><th>Qué se valora</th><th>4 · Excelente</th><th>3 · Satisfactorio</th><th>2 · Mejorable</th><th>1 · Insuficiente</th></tr></thead><tbody><tr><th>Narración<span class="crit">4.1</span></th><td>Pronuncia con estupenda claridad, fluidez y buena entonación.</td><td>Pronuncia con claridad y fluidez, pero sin entonación.</td><td>Pronuncia con claridad, pero con bloqueos y pausas.</td><td>No pronuncia con claridad ni fluidez.</td></tr><tr><th>Elementos gráficos<span class="crit">4.1</span></th><td>Muchos dibujos, imágenes y símbolos de buena calidad y bien elegidos.</td><td>Bastantes dibujos y símbolos adecuados.</td><td>Pocos dibujos o poco adecuados o de baja calidad.</td><td>Dibujos mal elegidos o de muy baja calidad.</td></tr><tr><th>Dominio del contenido<span class="crit">4.1</span></th><td>Explica los cinco esfuerzos con claridad, ejemplos reales y sin errores.</td><td>Domina el tema, con alguna imprecisión.</td><td>Domina solo algunos esfuerzos.</td><td>No demuestra conocer el tema.</td></tr><tr><th>Seguimiento de las pautas<span class="crit">4.1</span></th><td>Sigue todas las pautas del guion y del formato.</td><td>Le falta alguna pauta menor.</td><td>Le falta una cuarta parte de las pautas.</td><td>No sigue la mayoría de las pautas.</td></tr><tr><th>Calidad técnica<span class="crit">4.1</span></th><td>Bien editado, con título y créditos; imagen y sonido de buena calidad; dura entre 1 y 1,5 minutos.</td><td>Editado con título y créditos; calidad aceptable.</td><td>Falta el título o los créditos, o la calidad dificulta seguirlo.</td><td>Sin editar o no se entiende.</td></tr></tbody></table></div><p class="desc">Cada fila se puntúa de 1 a 4 y se multiplica por 2,5 para pasarla a nota sobre 10.</p>`},
  t3e3:{titulo:"Anexo 5. Rúbrica del puente 3E", para:"tarea 14", html:`<div class="table-wrap"><table class="tbl rub"><thead><tr><th>Qué se valora</th><th>4 · Excelente</th><th>3 · Satisfactorio</th><th>2 · Mejorable</th><th>1 · Insuficiente</th></tr></thead><tbody><tr><th>Diseño y planificación<span class="crit">2.1 · 2.2</span></th><td>Bocetos con medidas, estructura justificada (dónde hay tracción y compresión) y planificación de tareas, responsables y plazos.</td><td>Bocetos y planificación completos con algún hueco.</td><td>Bocetos sin medidas o planificación incompleta.</td><td>Sin diseño ni planificación.</td></tr><tr><th>Construcción<span class="crit">3.1</span></th><td>Perfiles bien hechos, uniones limpias y triangulación correcta; respeta los materiales y las normas de seguridad.</td><td>Construcción correcta con algún defecto de acabado.</td><td>Construcción descuidada o que no respeta algún material o norma.</td><td>Construcción muy deficiente.</td></tr><tr><th>Eficiencia<span class="crit">3.1</span></th><td>Entre las eficiencias más bajas (mejores) de la clase.</td><td>Eficiencia buena.</td><td>Eficiencia mejorable.</td><td>El puente apenas soporta su propio peso.</td></tr><tr><th>Estética<span class="crit">2.1</span></th><td>Diseño elegante, original y muy bien acabado.</td><td>Diseño cuidado y atractivo.</td><td>Diseño básico.</td><td>Sin cuidado estético.</td></tr><tr><th>Documentación<span class="crit">4.1</span></th><td>Todo el proceso documentado en el diario con fotos, vídeo, datos de la prueba y conclusiones.</td><td>Proceso documentado con algún hueco.</td><td>Documentación incompleta.</td><td>Sin documentación.</td></tr></tbody></table></div><p class="desc">Cada fila se puntúa de 1 a 4 y se multiplica por 2,5 para pasarla a nota sobre 10.</p>`},
  t3e4:{titulo:"Anexo 6. Rúbrica del diario de aprendizaje", para:"todo el proyecto", html:`<div class="table-wrap"><table class="tbl rub"><thead><tr><th>Qué se valora</th><th>4 · Excelente</th><th>3 · Satisfactorio</th><th>2 · Mejorable</th><th>1 · Insuficiente</th></tr></thead><tbody><tr><th>Contenido<span class="crit">1.2</span></th><td>Completo y relevante; muestra una comprensión profunda, con detalles y ejemplos.</td><td>Adecuado; cubre lo principal, aunque algún detalle podría ser más claro.</td><td>Básico; faltan aspectos importantes.</td><td>Escaso o confuso; no aborda lo esencial.</td></tr><tr><th>Redacción<span class="crit">4.1</span></th><td>Clara, concisa y con vocabulario técnico adecuado; sin errores.</td><td>Comprensible, con algunas frases mejorables.</td><td>Confusa a veces o con errores gramaticales.</td><td>Difícil de entender o con muchos errores.</td></tr><tr><th>Evidencias<span class="crit">4.1</span></th><td>Fotos, vídeos y datos bien elegidos que respaldan lo que cuenta; fuentes citadas.</td><td>Evidencias pertinentes, algunas poco detalladas.</td><td>Pocas evidencias o fuentes sin citar.</td><td>Evidencias insuficientes o sin relación.</td></tr><tr><th>Reflexión<span class="crit">1.2</span></th><td>Reflexión profunda y crítica sobre lo aprendido, lo que funcionó y lo que mejorar.</td><td>Reflexión adecuada con algunos puntos de mejora.</td><td>Reflexión superficial.</td><td>Sin reflexión.</td></tr><tr><th>Organización y presentación<span class="crit">4.1</span></th><td>Muy bien organizado por tareas, ordenado y visualmente cuidado.</td><td>Organizado, con algún desorden.</td><td>Poco organizado.</td><td>Desordenado y difícil de seguir.</td></tr></tbody></table></div><p class="desc">Cada fila se puntúa de 1 a 4 y se multiplica por 2,5 para pasarla a nota sobre 10.</p>`},

  sa7a3:{titulo:"Anexo 3. Guion de entrevista y cuestionario de valoración", para:"tareas 2 y 4", html:`

        <li>¿Qué otra cosa te gustaría aprender?</li>
      </ul></div>
    </div>`},

  sa6a2:{titulo:"Anexo 2. Rúbrica del tema", para:"tareas 2 a 5", html:`
    <div class="table-wrap"><table class="tbl rub">
      <thead><tr><th>Qué se valora</th><th>4 · Excelente</th><th>3 · Bien</th><th>2 · Mejorable</th><th>1 · Insuficiente</th></tr></thead>

  sa5a2:{titulo:"Anexo 2. Rúbrica del proyecto", para:"tareas 2, 3 y 4", html:`

      <tbody>
        <tr><th>A. Análisis<span class="crit">4.4 · 3.5 · 3.2 · 4.5</span></th><td>Respondes todos los apartados de la ficha con ejemplos concretos del juego y valoras con criterio su valor educativo, su accesibilidad y cómo trata tu tiempo y tus datos.</td><td>Completas la ficha con ejemplos, aunque algún apartado es superficial.</td><td>Faltan apartados o las respuestas son muy generales, sin ejemplos.</td><td>La ficha está incompleta o no demuestra que hayas jugado.</td></tr>
        <tr><th>B. Propuesta de mejora<span class="crit">5.2 · 2.3</span></th><td>Original, realista y bien explicada; resuelve un problema detectado en el análisis y está bien diseñada.</td><td>Clara y realista, relacionada con el análisis, con un diseño mejorable.</td><td>Poco desarrollada o sin relación clara con el análisis.</td><td>No hay propuesta o no se entiende.</td></tr>
        <tr><th>C. Presentación<span class="crit">2.5</span></th><td>Bien estructurada, clara y visual; la expones con seguridad y respondes a las preguntas.</td><td>Clara y ordenada, con algún fallo de diseño o de exposición.</td><td>Desordenada, con mucho texto o leída.</td><td>No se entiende o no se presenta.</td></tr>
        <tr><th>D. Creatividad<span class="crit">2.3 · 5.2</span></th><td>Aporta ideas nuevas y sorprendentes con un resultado muy atractivo.</td><td>Aporta alguna idea propia con un resultado atractivo.</td><td>Ideas poco originales.</td><td>Sin aportación propia.</td></tr>
        <tr><th>E. Actitud y trabajo<span class="crit">5.3</span></th><td>Aprovechas todas las sesiones, cumples los plazos y ayudas a los demás.</td><td>Trabajas en clase y cumples los plazos.</td><td>Trabajas de forma irregular o con retrasos.</td><td>No aprovechas las sesiones.</td></tr>
      </tbody>
    </table></div>
    <p class="desc">Cada fila se puntúa de 1 a 4 y se multiplica por 2,5 para pasarla a nota sobre 10.</p>`},
  sa5a3:{titulo:"Anexo 3. Ficha de análisis del videojuego", para:"tarea 2", html:`
    <p>Estas son las preguntas que tienes que responder. La plantilla en Word está en el canal de Teams de la materia.</p>
    <div class="ficha"><div class="ficha-sec"><h4>Ficha técnica</h4><ul><li>Nombre del videojuego</li><li>Web de acceso o plataforma (¿navegador, app?)</li><li>Creador: quién lo ha hecho (empresa, organismo público, ONG…)</li><li>Idioma disponible</li><li>Número de jugadores y duración aproximada</li><li>¿Se puede guardar la partida? ¿Tiene instrucciones?</li></ul></div><div class="ficha-sec"><h4>1. Objetivo educativo</h4><ul><li>¿Qué intenta enseñar o reforzar?</li><li>¿Qué valores transmite?</li><li>¿Los contenidos son correctos? ¿Has encontrado algún error o idea falsa?</li></ul></div><div class="ficha-sec"><h4>2. Historia y mundo del juego</h4><ul><li>¿Tiene historia o narrador? ¿Qué importancia tiene?</li><li>¿Dónde y cuándo transcurre? ¿Cómo es el entorno?</li></ul></div><div class="ficha-sec"><h4>3. Mecánicas y dinámicas</h4><ul><li>¿Qué acciones hace el jugador? (resolver puzles, gestionar recursos, responder preguntas…)</li><li>¿Cuál es la misión? ¿Qué hay que hacer para ganar?</li><li>¿Cómo te recompensa? (puntos, niveles, insignias…)</li><li>¿Cuánto puedes decidir o cambiar tú dentro del juego?</li></ul></div><div class="ficha-sec"><h4>4. Diseño y accesibilidad</h4><ul><li>¿Está bien diseñado? ¿Es intuitivo?</li><li>¿Es accesible para todos? (tamaño del texto, subtítulos, colores, idioma, dispositivos)</li><li>¿Para qué edad crees que está pensado?</li></ul></div><div class="ficha-sec"><h4>5. Bienestar y datos personales</h4><ul><li>¿Te pide registrarte o datos personales? ¿Cuáles?</li><li>¿Tiene publicidad, compras o enlaces a redes sociales?</li><li>¿Usa trucos para que juegues más tiempo? (recompensas diarias, rachas, avisos)</li><li>¿Crees que es un juego sano para usar a menudo? ¿Por qué?</li></ul></div><div class="ficha-sec"><h4>6. Motivación y entretenimiento</h4><ul><li>¿Ha sido divertido? ¿Motiva a seguir jugando? ¿Por qué?</li></ul></div><div class="ficha-sec"><h4>7. Puntos fuertes y puntos a mejorar</h4><ul><li>Al menos dos fortalezas del juego</li><li>Al menos dos aspectos mejorables</li></ul></div><div class="ficha-sec"><h4>8. Propuesta de mejora</h4><ul><li>Describe una mejora concreta: una nueva mecánica, un rediseño visual, una mejora de accesibilidad, una adaptación para otro nivel educativo…</li></ul></div></div>`},

  sa4a2:{titulo:"Anexo 2. Rúbrica del cortometraje", para:"tareas 7 y 8", html:`
    <div class="table-wrap"><table class="tbl rub">
      <thead><tr><th>Qué se valora</th><th>4 · Excelente</th><th>3 · Bien</th><th>2 · Mejorable</th><th>1 · Insuficiente</th></tr></thead>
      <tbody>
        <tr><th>A. Historia<span class="crit">5.2</span></th><td>La historia se entiende, tiene inicio, nudo y desenlace y engancha.</td><td>Se entiende y tiene estructura, aunque algún momento flojea.</td><td>Cuesta seguirla o le falta alguna parte.</td><td>No se entiende la historia.</td></tr>
        <tr><th>B. Lenguaje cinematográfico<span class="crit">2.3</span></th><td>Usa variedad de planos y ángulos, elegidos con intención y bien encuadrados.</td><td>Usa varios tipos de plano, con algún encuadre mejorable.</td><td>Casi todo con el mismo plano o con encuadres descuidados.</td><td>No hay intención en los planos.</td></tr>
        <tr><th>C. Montaje<span class="crit">2.3</span></th><td>Ritmo ágil, cortes limpios, sin tomas sobrantes; transiciones con sentido.</td><td>Montaje correcto con algún corte o toma mejorable.</td><td>Ritmo lento o cortes bruscos que dificultan seguir la historia.</td><td>Tomas sin editar o desordenadas.</td></tr>
        <tr><th>D. Sonido<span class="crit">2.3</span></th><td>Diálogos claros, música y efectos que refuerzan la historia y volúmenes bien ajustados.</td><td>Se entiende todo, con algún desajuste de volumen.</td><td>Hay partes que no se oyen bien o la música tapa los diálogos.</td><td>El sonido impide seguir el corto.</td></tr>
        <tr><th>E. Títulos, créditos y derechos<span class="crit">4.1 · 2.5</span></th><td>Título y créditos completos; música e imágenes libres de derechos y citadas; el corto se comparte correctamente.</td><td>Créditos completos con algún fallo en las citas.</td><td>Créditos incompletos o material sin citar.</td><td>Sin créditos o con material protegido sin permiso.</td></tr>
        <tr><th>F. Trabajo en equipo<span class="crit">3.6 · 5.3</span></th><td>Cumples tu rol a tiempo, aportas ideas y ayudas a resolver los desacuerdos dialogando.</td><td>Cumples tu rol y colaboras cuando se te pide.</td><td>Cumples solo parte de tu rol.</td><td>No cumples tu rol o dificultas el trabajo del grupo.</td></tr>
      </tbody>
    </table></div>
    <p class="desc">Cada fila se puntúa de 1 a 4. La nota es la media de las filas multiplicada por 2,5.</p>
    <p class="desc"><b>Importante:</b> si el corto incluye vídeo, voces o narraciones generadas con IA, no se puede evaluar y habrá que rehacerlo en clase.</p>`},

  sa3a2:{titulo:"Anexo 2. Rúbrica de la sesión de seguridad digital", para:"tareas 4, 5, 6 y 7", html:`
    <p>Con esta rúbrica te valoro yo, te valoran tus compañeros en el ensayo y te valoras tú en la reflexión final. Léela antes de preparar tu sesión: te dice exactamente qué hace falta para llegar a cada nivel.</p>
    <div class="table-wrap"><table class="tbl rub">
      <thead><tr><th>Qué se valora</th><th>4 · Excelente</th><th>3 · Bien</th><th>2 · Mejorable</th><th>1 · Insuficiente</th></tr></thead>
      <tbody>
        <tr><th>A. Dominio de los conceptos<span class="crit">3.1 · 3.2 · 3.4</span></th><td>Explicas todos los conceptos de tu mundo sin errores, con ejemplos propios, y respondes con seguridad a las preguntas.</td><td>Explicas los conceptos correctamente, aunque con pocos ejemplos o alguna duda al responder.</td><td>Faltan conceptos importantes o hay algún error.</td><td>Hay errores graves o no se entiende qué se quiere enseñar.</td></tr>
        <tr><th>B. Adaptación al público<span class="crit">2.5</span></th><td>El lenguaje, los ejemplos y la dinámica están pensados para alumnos de 11 años y consiguen que participen.</td><td>La sesión se entiende y es adecuada, aunque algún momento resulta difícil o poco participativo.</td><td>Hay partes demasiado técnicas o largas y cuesta mantener su atención.</td><td>La sesión no está adaptada a 6.º de Primaria.</td></tr>
        <tr><th>C. Guion y presentación<span class="crit">4.1</span></th><td>El guion tiene sus cinco partes. La presentación es clara y atractiva, con poco texto e imágenes con licencia libre o citadas.</td><td>El guion está completo y la presentación es clara, con algún fallo de diseño o de citas.</td><td>Falta alguna parte del guion o la presentación tiene demasiado texto o imágenes sin citar.</td><td>No hay guion o la presentación no sirve de apoyo.</td></tr>
        <tr><th>D. Situaciones reales y espíritu crítico<span class="crit">4.4</span></th><td>Usas casos reales o creíbles (mensajes, perfiles, noticias) y enseñas a analizarlos paso a paso.</td><td>Usas ejemplos realistas, pero sin enseñar del todo a analizarlos.</td><td>Los ejemplos son poco realistas o muy generales.</td><td>No hay ejemplos.</td></tr>
        <tr><th>E. Actitud con 6.º<span class="crit">3.3</span></th><td>Tratas al alumnado con respeto y paciencia, animas a participar, ayudas mientras juegan y transmites el mensaje de pedir ayuda.</td><td>Trato respetuoso y ayudas cuando te lo piden.</td><td>Ayudas poco o hay momentos de impaciencia.</td><td>Trato poco respetuoso o desinterés.</td></tr>
        <tr><th>F. Trabajo en equipo y responsabilidad<span class="crit">3.6 · 5.3</span></th><td>Cumples tu parte a tiempo, aportas ideas, escuchas y ayudas a resolver los desacuerdos dialogando.</td><td>Cumples tu parte y colaboras cuando se te pide.</td><td>Cumples solo parte de lo acordado o colaboras poco.</td><td>No cumples tu parte o dificultas el trabajo del grupo.</td></tr>
      </tbody>
    </table></div>
    <p class="desc">Cada fila se puntúa de 1 a 4. La nota de cada evidencia es la media de sus filas multiplicada por 2,5 (un 4 equivale a 10; un 2, a 5).</p>`},
  anexo1:{titulo:"Anexo 1. Rúbrica de la infografía", para:"Tarea 2", html:`
    <div class="table-wrap"><table class="tbl rub">
      <thead><tr><th>Categoría</th><th>4 · Excelente</th><th>3 · Satisfactorio</th><th>2 · Mejorable</th><th>1 · Insuficiente</th></tr></thead>
      <tbody>
        <tr><th>Estructura</th><td>Estructura muy clara. Están los cinco elementos de una infografía (titular, texto, cuerpo, fuente y crédito) y se respetan siempre sus características.</td><td>Estructura clara. Están los cinco elementos, pero no siempre se respetan sus características.</td><td>Estructura bastante clara, pero faltan uno o dos elementos y no siempre se respetan sus características.</td><td>Estructura poco clara. Solo hay uno o dos elementos y, en general, no se respetan sus características.</td></tr>
        <tr><th>Diseño</th><td>Elementos organizados de forma perfecta, colores muy armónicos y tipografía legible y muy apropiada.</td><td>Elementos organizados de forma adecuada, colores armónicos y tipografía legible y apropiada.</td><td>No todos los elementos están bien organizados, los colores no son lo bastante armónicos y/o la tipografía no es la apropiada.</td><td>No se ha cuidado la organización, los colores no son armónicos y la tipografía no es adecuada.</td></tr>
        <tr><th>Texto</th><td>Ideas expresadas con total claridad, sin errores gramaticales ni ortográficos.</td><td>Ideas expresadas con total claridad, pero con algún error.</td><td>Ideas poco claras y/o dos o tres errores.</td><td>Ideas sin claridad y/o más de tres errores.</td></tr>
        <tr><th>Imágenes</th><td>Todas tienen licencia CC, dimensiones perfectas y apoyan con total claridad el mensaje.</td><td>Todas tienen licencia CC, dimensiones adecuadas y apoyan con claridad el mensaje.</td><td>No todas tienen licencia CC; alguna no tiene las dimensiones adecuadas y/o no apoya bien el mensaje.</td><td>La mayoría no tienen licencia CC, ni dimensiones adecuadas, ni encajan con el mensaje.</td></tr>
        <tr><th>Herramientas TIC</th><td>Se han explorado todas las posibilidades de la herramienta; el trabajo se ha guardado, exportado a PDF y entregado por Teams.</td><td>Se ha explorado bien la herramienta; el trabajo se ha guardado, exportado a PDF y entregado por Teams.</td><td>Se ha explorado poco la herramienta; se ha guardado pero no se ha exportado a PDF para entregarlo por Teams.</td><td>No se ha explorado la herramienta; se ha guardado pero ni se ha exportado a PDF ni se ha entregado por Teams.</td></tr>
      </tbody></table></div>`},

/* ============================================================
   RENDER
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderNav(current){
  $("#nav").innerHTML = `<a href="#inicio" ${current==="inicio"?'aria-current="page"':''}>Inicio</a>` +
    MATERIAS.map(m => `<a href="#${m.id}" style="--sub:${m.color}" ${current===m.id?'aria-current="page"':''}>${esc(m.corto||m.nombre)} ${esc(m.nivel)}</a>`).join("");
}

function renderHome(){
  $("#main").innerHTML = `
    <div class="home-intro">
      <h1>Elige tu materia</h1>
      <p>Aquí tienes los contenidos, actividades, vídeos, fichas y criterios de evaluación de cada asignatura.</p>
    </div>
    <div class="grid">
      ${MATERIAS.map(m => `
        <a class="subj-card" href="#${m.id}" style="--sub:${m.color}">
          <span class="lvl">${esc(m.nivel)}</span>
          <h2>${esc(m.nombre)}</h2>
          <p>${esc(m.intro)}</p>
        </a>`).join("")}
    </div>`;
}

function itemAction(it){
  if(it.tipo==="interactiva") return `<button class="btn" data-quiz="${it.quiz}">Empezar</button>`;
  if(it.url) return `<a class="btn ghost" href="${esc(it.url)}" target="_blank" rel="noopener">${it.tipo==="video"?"Ver":"Abrir"}</a>`;
  if(it.tipo==="ficha") return `<span class="pending">Disponible pronto</span>`;
  return "";
}

function critTitle(m,code){
  if(!m.competencias) return "";
  for(const ce of m.competencias) for(const [k,v] of ce.c) if(k===code) return v;
  return "";
}
function renderCompetencias(m){
  return `
    <section class="unit" id="criterios-${m.id}">
      <div class="unit-head"><h2>Criterios de evaluación</h2></div>
      <p class="desc">Lo que se evalúa en esta materia, según el ${esc(m.norma)}. Están explicados con palabras sencillas.</p>
      <div class="ces">
        ${m.competencias.map(ce=>`
          <details class="ce" open>
            <summary><span class="ce-n">CE${ce.n}</span><span><b>${esc(ce.t)}</b><span class="ce-d">${esc(ce.d)}</span></span></summary>
            <ul class="crit-list">${ce.c.map(([k,v])=>`<li><span class="code">${k}</span><span>${esc(v)}</span></li>`).join("")}</ul>
          </details>`).join("")}
      </div>
    </section>`;
}
function plural(n,a,b){ return n+" "+(n===1?a:b); }
function itemsList(items){
  return `<ul class="items">
    ${items.map(it=>`
      <li class="item">
        <span class="tag" style="--c:${TIPOS[it.tipo].c}">${TIPOS[it.tipo].label}</span>
        <div><div class="t">${esc(it.t)}</div>${it.s?`<div class="s">${esc(it.s)}</div>`:""}</div>
        <div>${itemAction(it)}</div>
      </li>`).join("")}
  </ul>`;
}
function chips(m,list){
  return `<div class="chips"><span class="tag-plain">Criterios que trabajamos</span>${list.map(c=>`<span class="chip" title="${esc(critTitle(m,c))}">${c}</span>`).join("")}</div>`;
}
function renderSubject(m){
  const crit = m.competencias
    ? `<ol class="ce-short">${m.competencias.map(ce=>`<li><b>CE${ce.n}</b> ${esc(ce.t)}</li>`).join("")}</ol>
       <p class="note" style="margin-top:10px"><a href="#criterios-${m.id}" data-jump="criterios-${m.id}">Ver todos los criterios</a></p>`
    : m.criterios
    ? `<ol>${m.criterios.map(c=>`<li>${esc(c)}</li>`).join("")}</ol>`
    : `<p class="note">Los criterios de evaluación de esta materia se publicarán aquí.</p>`;
  const pesos = m.pesos ? `
    <div class="box">
      <h3>Cómo se calcula la nota</h3>
      ${m.pesosEjemplo?'<p class="note">Reparto provisional.</p>':''}
      <div class="weights">
        ${m.pesos.map(([n,p])=>`<div class="w-row"><span>${esc(n)}</span><b>${p}%</b><span class="w-bar"><i style="width:${p}%"></i></span></div>`).join("")}
      </div>
    </div>` : "";
  const pres = m.presentacion ? `
    <div class="box">
      <h3>Sobre la materia</h3>
      <p class="note" style="margin-bottom:10px">${esc(m.presentacion.texto)}</p>
      <ol class="blocks">${m.presentacion.bloques.map(b=>`<li>${esc(b)}</li>`).join("")}</ol>
    </div>` : "";
  $("#main").innerHTML = `
    <div style="--sub:${m.color}">
      <div class="subj-head">
        <span class="lvl">${esc(m.nivel)}</span>
        <h1>${esc(m.nombre)}</h1>
        ${m.presentacion?`<blockquote class="quote">${esc(m.presentacion.cita)}</blockquote>`:`<p>${esc(m.intro)}</p>`}
      </div>
      <div class="layout">
        <div class="units">
          ${m.unidades.map((u,i)=> u.id ? `
            <a class="unit unit-link" href="#${u.id}">
              <div class="unit-head"><span class="unit-num">Tema ${i+1}</span><span class="eti">${esc(u.etiqueta||"")}</span></div>
              <h2>${esc(u.titulo)}</h2>
              <p class="desc">${esc(u.desc)}</p>
              <div class="meta">
                ${u.tareas?`<span>${plural(u.tareas.length,"tarea","tareas")}</span>`:""}
                ${u.anexos?`<span>${plural(u.anexos.length,"anexo de evaluación","anexos de evaluación")}</span>`:""}
                ${u.items&&u.items.some(x=>x.tipo==="interactiva")?`<span>${plural(u.items.filter(x=>x.tipo==="interactiva").length,"ficha interactiva","fichas interactivas")}</span>`:""}
                <span class="go">Abrir tema →</span>
              </div>
            </a>` : `
            <section class="unit">
              <div class="unit-head"><span class="unit-num">Unidad ${i+1}</span><h2>${esc(u.titulo)}</h2></div>
              <p class="desc">${esc(u.desc)}</p>
              ${u.criterios?chips(m,u.criterios):""}
              ${itemsList(u.items)}
            </section>`).join("")}
          ${m.unidades.length?"":`<section class="unit"><p class="desc">Los temas de esta materia se publicarán aquí muy pronto.</p></section>`}
          ${m.competencias?renderCompetencias(m):""}
        </div>
        <aside>
          ${pres}
          <div class="box"><h3>Criterios de evaluación</h3>${crit}</div>
          ${pesos}
        </aside>
      </div>
    </div>`;
}

function renderUnit(m,u){
  const idx = m.unidades.indexOf(u);
  const prev = m.unidades[idx-1], next = m.unidades[idx+1];
  const toc = [
    u.teoria&&["teoria","Teoría"], u.saberes&&["saberes","Qué vamos a aprender"],
    u.tareas&&["tareas","Tareas"], u.items&&u.items.length&&["recursos","Recursos y repaso"],
    u.anexos&&["anexos","Cómo se evalúa"]].filter(Boolean);
  const tareaHtml = t => `
    <li class="task" id="${u.id}-t${t.n}">
      <span class="task-n">${t.n}</span>
      <div class="task-body">
        <h3>${esc(t.t)}</h3>
        ${t.html}
        ${t.enlaces?`<div class="links">${t.enlaces.map(([l,h])=>`<a class="btn ghost" href="${esc(h)}" target="_blank" rel="noopener">${esc(l)} ↗</a>`).join("")}</div>`:""}
        ${(t.evalua||t.entrega||t.pendiente||t.duracion)?`<div class="task-meta">
          ${t.duracion?`<span class="pill">Duración: ${esc(t.duracion)}</span>`:""}
          ${t.entrega?`<span class="pill">Entrega: ${esc(t.entrega)}</span>`:""}
          ${t.evalua?`<a class="pill pill-link" href="#${t.evalua}-${u.id}" data-jump="${t.evalua}-${u.id}">Se evalúa con: ${esc(ANEXOS[t.evalua].titulo.split(".")[0])}</a>`:""}
          ${t.pendiente?`<span class="pending">${esc(t.pendiente)}</span>`:""}
        </div>`:""}
      </div>
    </li>`;
  $("#main").innerHTML = `
    <div style="--sub:${m.color}">
      <a class="back" href="#${m.id}">← ${esc(m.nombre)} ${esc(m.nivel)}</a>
      <div class="subj-head">
        <span class="lvl">${esc(u.etiqueta||("Tema "+(idx+1)))}</span>
        <h1>${esc(u.titulo)}</h1>
        ${u.subtitulo?`<p class="sub">${esc(u.subtitulo)}</p>`:""}
        ${u.cita?`<blockquote class="quote">${esc(u.cita[0])}<cite>${esc(u.cita[1])}</cite></blockquote>`:""}
        <p>${esc(u.desc)}</p>
      </div>
      <div class="layout">
        <div class="units">
          ${u.teoria?`<section class="unit prose" id="teoria-${u.id}"><h2>Teoría</h2>${u.teoria}</section>`:""}
          ${u.saberes?`<section class="unit" id="saberes-${u.id}"><h2>Qué vamos a aprender</h2>${u.bloque?`<p class="desc">${esc(u.bloque)}</p>`:""}<ul class="plain">${u.saberes.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></section>`:""}
          ${u.tareas?`<section class="unit" id="tareas-${u.id}"><h2>Tareas</h2><ol class="tasks">${u.tareas.map(tareaHtml).join("")}</ol></section>`:""}
          ${u.items&&u.items.length?`<section class="unit" id="recursos-${u.id}"><h2>Recursos y repaso</h2>${itemsList(u.items)}</section>`:""}
          ${u.anexos?`<section class="unit" id="anexos-${u.id}"><h2>Cómo se evalúa</h2>
            ${u.anexos.map(k=>{const a=ANEXOS[k]; return `
              <div class="anexo" id="${k}-${u.id}">
                <h3>${esc(a.titulo)}</h3><p class="desc">Se usa en: ${esc(a.para)}.</p>
                ${a.html}
                ${a.enlaces?`<div class="links">${a.enlaces.map(([l,h])=>`<a class="btn ghost" href="${esc(h)}" target="_blank" rel="noopener">${esc(l)} ↗</a>`).join("")}</div>`:""}
              </div>`}).join("")}
          </section>`:""}
          ${!u.tareas&&!u.teoria&&!(u.items&&u.items.length)?`<section class="unit"><p class="desc">Contenido en preparación.</p></section>`:""}
          <div class="pager">
            ${prev&&prev.id?`<a class="btn ghost" href="#${prev.id}">← ${esc(prev.titulo)}</a>`:"<span></span>"}
            ${next&&next.id?`<a class="btn ghost" href="#${next.id}">${esc(next.titulo)} →</a>`:""}
          </div>
        </div>
        <aside>
          ${toc.length>1?`<div class="box"><h3>En este tema</h3><ul class="toc">${toc.map(([k,l])=>`<li><a href="#${k}-${u.id}" data-jump="${k}-${u.id}">${l}</a></li>`).join("")}</ul></div>`:""}
          ${u.producto?`<div class="box"><h3>Producto final</h3><p class="note">${esc(u.producto)}</p></div>`:""}
          ${u.criterios?`<div class="box"><h3>Criterios que trabajamos</h3><ul class="crit-mini">${u.criterios.map(c=>`<li><span class="code">${c}</span><span>${esc(critTitle(m,c))}</span></li>`).join("")}</ul></div>`:""}
        </aside>
      </div>
    </div>`;
}

function route(){
  const id = (location.hash||"#inicio").slice(1);
  if(id==="comprobar"){ renderNav(""); renderCheck(); window.scrollTo(0,0); return; }
  let m = MATERIAS.find(x=>x.id===id), u = null;
  if(!m) for(const mm of MATERIAS){ const f=mm.unidades.find(x=>x.id===id); if(f){ m=mm; u=f; break; } }
  renderNav(m?m.id:"inicio");
  if(u) renderUnit(m,u); else if(m) renderSubject(m); else renderHome();
  window.scrollTo(0,0);
}

/* ---------- motor de fichas interactivas ---------- */
let qs = null;
/* ---------- código de verificación ---------- */
const SAL = "AulaRuben·LaInmaculada·Paiporta";
const EPOCH = Date.UTC(2026,0,1);
function cyrb53(str, seed=0){
  let h1=0xdeadbeef^seed, h2=0x41c6ce57^seed;
  for(let i=0;i<str.length;i++){ const c=str.charCodeAt(i); h1=Math.imul(h1^c,2654435761); h2=Math.imul(h2^c,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 4294967296*(2097151&h2)+(h1>>>0);
}
function normName(n){ return String(n).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9ñ ]/g,"").replace(/\s+/g," ").trim(); }
function quizId(key){ return (cyrb53(key)%1296).toString(36).toUpperCase().padStart(2,"0"); }
function makeCode(key, score, total, name, when){
  const mins = Math.floor((when-EPOCH)/60000);
  const payload = quizId(key) + score.toString(36).toUpperCase() + total.toString(36).toUpperCase() + mins.toString(36).toUpperCase().padStart(6,"0");
  const sig = cyrb53(payload+"|"+normName(name)+"|"+SAL).toString(36).toUpperCase().padStart(5,"0").slice(-5);
  const raw = payload + sig;
  return raw.match(/.{1,5}/g).join("-");
}
function checkCode(code, name){
  const raw = String(code).toUpperCase().replace(/[^0-9A-Z]/g,"");
  if(raw.length!==15) return {ok:false, msg:"El código debe tener 15 caracteres (tres grupos de 5)."};
  const payload = raw.slice(0,10), sig = raw.slice(10);
  const expected = cyrb53(payload+"|"+normName(name)+"|"+SAL).toString(36).toUpperCase().padStart(5,"0").slice(-5);
  const qid = payload.slice(0,2);
  const key = Object.keys(QUIZZES).find(k=>quizId(k)===qid);
  const score = parseInt(payload[2],36), total = parseInt(payload[3],36);
  const when = new Date(EPOCH + parseInt(payload.slice(4),36)*60000);
  if(sig!==expected) return {ok:false, msg:"El código no es válido para ese nombre: o el nombre no está escrito igual que en el informe, o el informe ha sido modificado."};
  return {ok:true, titulo: key?QUIZZES[key].titulo:"Ficha desconocida", score, total, when};
}
function fmtDate(d){ return d.toLocaleString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}); }
function savedName(){ try{ return localStorage.getItem("aula-nombre")||""; }catch(e){ return ""; } }
function saveName(n){ try{ localStorage.setItem("aula-nombre",n); }catch(e){} }

function openQuiz(key){
  const quiz = QUIZZES[key]; if(!quiz) return;
  qs = {key, quiz, i:0, ok:0, fallos:[], lastFocus:document.activeElement, nombre:""};
  $("#dialog").classList.remove("wide");
  $("#overlay").classList.add("open");
  drawStart();
}
function drawStart(){
  $("#dialog").innerHTML = head() + `
    <p style="margin:0"><b>Ficha de repaso.</b> Sirve para comprobar lo que sabes. Escribe tu nombre y apellidos: al terminar obtendrás un informe con un código de verificación para entregarlo por Teams.</p>
    <form id="name-form" class="name-form">
      <label for="alumno">Nombre y apellidos</label>
      <input id="alumno" name="alumno" autocomplete="name" required value="${esc(savedName())}">
      <button class="btn" type="submit">Empezar</button>
    </form>`;
  $("#alumno").focus();
}
function closeQuiz(){
  $("#overlay").classList.remove("open");
  if(qs && qs.lastFocus) qs.lastFocus.focus();
  qs = null;
}
function head(){
  return `<div class="dialog-head"><h2 id="dlg-title">${esc(qs.quiz?qs.quiz.titulo:"")}</h2><button class="close" id="close-btn">Cerrar</button></div>`;
}
function drawQuestion(){
  const p = qs.quiz.preguntas[qs.i], n = qs.quiz.preguntas.length;
  $("#dialog").innerHTML = head() + `
    <div class="progress">${esc(qs.nombre)} · Pregunta ${qs.i+1} de ${n} · Aciertos: ${qs.ok}</div>
    <div class="q">${esc(p.q)}</div>
    <div class="opts">${p.o.map((o,j)=>`<button class="opt" data-j="${j}">${esc(o)}</button>`).join("")}</div>
    <p class="feedback" id="fb"></p>
    <div><button class="btn" id="next-btn" hidden>${qs.i+1<n?"Siguiente":"Ver resultado"}</button></div>`;
  $("#dialog .opt").focus();
}
function answer(j){
  const p = qs.quiz.preguntas[qs.i];
  document.querySelectorAll("#dialog .opt").forEach((b,k)=>{
    b.disabled = true;
    if(k===p.a) b.classList.add("right");
    else if(k===j) b.classList.add("wrong");
  });
  const good = j===p.a; if(good) qs.ok++; else qs.fallos.push(qs.i+1);
  const fb = $("#fb"); fb.classList.add("show");
  fb.innerHTML = `<strong style="color:var(${good?"--ok":"--bad"})">${good?"¡Correcto!":"No es esa."}</strong> ${esc(p.f)}`;
  const nb = $("#next-btn"); nb.hidden = false; nb.focus();
}
function next(){
  qs.i++;
  if(qs.i < qs.quiz.preguntas.length) return drawQuestion();
  const n = qs.quiz.preguntas.length, when = new Date();
  const code = makeCode(qs.key, qs.ok, n, qs.nombre, when.getTime());
  const nota = (qs.ok/n*10).toFixed(1).replace(".",",");
  qs.informe = `INFORME · FICHA DE REPASO · Aula de Rubén\nAlumno/a: ${qs.nombre}\nFicha: ${qs.quiz.titulo}\nResultado: ${qs.ok}/${n} (nota ${nota})\nFecha: ${fmtDate(when)}\nCódigo de verificación: ${code}`;
  $("#dialog").innerHTML = head() + `
    <div class="report" id="report">
      <div class="report-top"><span>Informe · Ficha de repaso</span><b>${esc(qs.quiz.titulo)}</b></div>
      <dl>
        <dt>Alumno/a</dt><dd>${esc(qs.nombre)}</dd>
        <dt>Resultado</dt><dd><span class="score-sm">${qs.ok} / ${n}</span> · nota ${nota}</dd>
        <dt>Fecha</dt><dd>${fmtDate(when)}</dd>
        ${qs.fallos.length?`<dt>A repasar</dt><dd>Preguntas ${qs.fallos.join(", ")}</dd>`:""}
      </dl>
      <div class="code-box"><span>Código de verificación</span><code>${code}</code></div>
    </div>
    <p class="note" style="margin:0">${qs.ok===n?"¡Perfecto! ":qs.ok>=n/2?"Bien hecho. ":"Repasa los contenidos y vuelve a intentarlo. "}Haz una captura de este informe o cópialo y entrégalo por Teams.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="copy-btn">Copiar informe</button>
      <button class="btn ghost" id="retry-btn">Repetir</button>
      <button class="btn ghost" id="close-btn2">Cerrar</button>
    </div>`;
  $("#copy-btn").focus();
}

/* ---------- página del profesorado: comprobar un informe ---------- */
function renderCheck(){
  $("#main").innerHTML = `
    <div class="check-wrap">
      <h1>Comprobar un informe</h1>
      <p class="note">Para el profesorado. Pega el código del informe y el nombre del alumno tal como aparece en él.</p>
      <form id="check-form" class="name-form">
        <label for="chk-code">Código de verificación</label>
        <input id="chk-code" placeholder="XXXXX-XXXXX-XXXXX" autocomplete="off" required>
        <label for="chk-name">Nombre y apellidos</label>
        <input id="chk-name" autocomplete="off" required>
        <button class="btn" type="submit">Comprobar</button>
      </form>
      <div id="check-result"></div>
    </div>`;
}

document.addEventListener("click", e=>{
  const j = e.target.closest("a[data-jump]");
  if(j){ e.preventDefault(); const el=document.getElementById(j.dataset.jump); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.zoom){
    qs = {lastFocus:t, zoom:true};
    $("#dialog").classList.add("wide");
    $("#dialog").innerHTML = `<div class="dialog-head"><h2 id="dlg-title">Gráfico de la red del centro</h2><button class="close" id="close-btn">Cerrar</button></div><div class="zoom-big"><img src="${t.dataset.zoom}" alt="Gráfico de la red del centro a tamaño grande"></div>`;
    $("#overlay").classList.add("open"); $("#close-btn").focus(); return;
  }
  if(t.dataset.quiz) openQuiz(t.dataset.quiz);
  else if(t.classList.contains("opt")) answer(+t.dataset.j);
  else if(t.id==="next-btn") next();
  else if(t.id==="retry-btn"){ qs.i=0; qs.ok=0; qs.fallos=[]; drawQuestion(); }
  else if(t.id==="copy-btn"){
    navigator.clipboard.writeText(qs.informe).then(()=>{ t.textContent="¡Copiado!"; }).catch(()=>{ t.textContent="No se pudo copiar: haz una captura"; });
  }
  else if(t.id==="close-btn"||t.id==="close-btn2") closeQuiz();
});
$("#overlay").addEventListener("click", e=>{ if(e.target.id==="overlay") closeQuiz(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && qs) closeQuiz(); });
document.addEventListener("submit", e=>{
  if(e.target.id==="name-form"){
    e.preventDefault();
    const n = $("#alumno").value.trim();
    if(n.split(/\s+/).length<2){ $("#alumno").setCustomValidity("Escribe nombre y al menos un apellido"); $("#alumno").reportValidity(); return; }
    qs.nombre = n; saveName(n); drawQuestion();
  }
  if(e.target.id==="check-form"){
    e.preventDefault();
    const r = checkCode($("#chk-code").value, $("#chk-name").value);
    $("#check-result").innerHTML = r.ok
      ? `<div class="check ok"><b>Informe auténtico</b><dl><dt>Ficha</dt><dd>${esc(r.titulo)}</dd><dt>Resultado</dt><dd>${r.score} / ${r.total}</dd><dt>Fecha</dt><dd>${fmtDate(r.when)}</dd></dl><p class="note" style="margin:0">Comprueba que estos datos coinciden con los del informe entregado.</p></div>`
      : `<div class="check bad"><b>No se puede verificar</b><p style="margin:0">${esc(r.msg)}</p></div>`;
  }
});
document.addEventListener("input", e=>{
  if(e.target.id==="alumno") e.target.setCustomValidity("");
  if(e.target.id==="eff-peso"||e.target.id==="eff-carga"){
    const p=parseFloat($("#eff-peso").value), c=parseFloat($("#eff-carga").value), o=$("#eff-out");
    if(!(p>0)||!(c>0)){ o.textContent="Introduce los dos datos."; return; }
    const ef=p/c, veces=c/p;
    o.innerHTML=`Eficiencia: <b>${ef.toLocaleString("es-ES",{maximumFractionDigits:4})}</b> · tu puente soportó <b>${veces.toLocaleString("es-ES",{maximumFractionDigits:1})} veces</b> su propio peso.`;
  }
});
window.addEventListener("hashchange", route);
route();
</script>
