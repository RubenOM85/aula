  {
    id:"piayr-2", nombre:"Programación, IA y Robótica I", corto:"PIAyR I", nivel:"2.º ESO", color:"#e08a00",
    intro:"La robótica es el hilo del curso: empezamos pensando como una máquina y programando en Scratch, construimos un robot saltador con LEGO SPIKE, montamos una ciudad de reparto con robots Maqueen y terminamos controlándolos con gestos gracias a la inteligencia artificial. Cerramos con el Tech Show y la feria de robótica.",
    presentacion:{
      cita:"Programar no es mandar: es dar instrucciones claras.",
      texto:"Los ordenadores, los robots y la inteligencia artificial no son magia: hacen exactamente lo que alguien les ha enseñado a hacer. En esta materia pasamos de usar la tecnología a crearla. Aprendemos haciendo, probando, equivocándonos y mejorando, siempre en equipo y pensando en a quién ayuda lo que construimos.",
      bloques:["Programación","Robótica","Inteligencia artificial","Retos tecnológicos en equipo"]
    },
    unidades:[
      {id:"p2-prog", etiqueta:"Situación de aprendizaje 1 · septiembre–octubre", titulo:"Piensa como una máquina", subtitulo:"De los algoritmos en papel a nuestro primer videojuego",
       cita:["Todo el mundo debería aprender a programar, porque te enseña a pensar.","Steve Jobs"],
       bloque:"Bloque: Programación",
       desc:"Una máquina no sabe lo que quieres decir: solo hace lo que le dices. Empezamos sin ordenador, escribiendo instrucciones para que una máquina resuelva problemas reales, aprendemos a representarlas con diagramas de flujo y las convertimos en programas de Scratch hasta crear un videojuego propio que otros puedan probar y mejorar.",
       criterios:["2.1","2.2","2.3","2.4","2.5","4.1","4.4"],
       producto:"Videojuego propio en Scratch, probado por otro equipo, corregido y publicado con sus créditos y su licencia.",
       anexos:["p2pV","p2pR"],
       teoria:`
        <h3>El pensamiento computacional</h3>
        <p>Es la forma de pensar que usamos para resolver un problema de manera que una máquina pueda ejecutar la solución. Tiene cuatro habilidades:</p>
        <div class="defs">
          <div><b>Descomposición</b><p>Dividir un problema grande en partes pequeñas y manejables.</p></div>
          <div><b>Patrones</b><p>Detectar lo que se repite para resolverlo una sola vez y reutilizarlo.</p></div>
          <div><b>Abstracción</b><p>Quedarse con lo importante e ignorar los detalles que no influyen.</p></div>
          <div><b>Algoritmo</b><p>Escribir los pasos exactos que llevan a la solución.</p></div>
        </div>
        <h3>¿Qué es un algoritmo?</h3>
        <p>Un <b>algoritmo</b> es una secuencia de instrucciones que resuelve un problema. Para que una máquina pueda seguirlo, tiene que ser:</p>
        <ul>
          <li><b>Ordenado:</b> cada paso va en su sitio. Si cambias el orden, cambia el resultado.</li>
          <li><b>Preciso:</b> sin dudas ni ambigüedades. «Gira un poco» no sirve; «gira 90 grados a la derecha», sí.</li>
          <li><b>Finito:</b> tiene que terminar.</li>
        </ul>
        <p>Un <b>programa</b> es un algoritmo escrito en un lenguaje que la máquina entiende. Cuando el programa no hace lo que esperábamos tiene un <b>error</b> (en inglés, <i>bug</i>). Buscarlo y corregirlo se llama <b>depurar</b>. Equivocarse forma parte de programar.</p>
        <h3>Diagramas de flujo</h3>
        <p>Sirven para dibujar un algoritmo antes de programarlo. Cada forma tiene un significado:</p>
        <div class="defs">
          <div><b>Óvalo</b><p>Inicio y fin.</p></div>
          <div><b>Rectángulo</b><p>Una acción: «encender la luz», «moverse 10 pasos».</p></div>
          <div><b>Rombo</b><p>Una decisión o pregunta con dos salidas, sí o no: «¿está oscuro?».</p></div>
          <div><b>Paralelogramo</b><p>Entrada o salida de datos: «pedir el nombre», «mostrar la puntuación».</p></div>
        </div>
        <h3>Las tres estructuras de cualquier programa</h3>
        <div class="defs">
          <div><b>Secuencia</b><p>Instrucciones una detrás de otra, en orden.</p></div>
          <div><b>Condición</b><p>SI ocurre algo, ENTONCES el programa hace una cosa; SI NO, hace otra. Así una máquina «decide» siguiendo reglas, sin necesidad de inteligencia artificial.</p></div>
          <div><b>Bucle</b><p>Repetir instrucciones un número de veces, para siempre o hasta que se cumpla una condición.</p></div>
        </div>
        <h3>Variables y eventos</h3>
        <ul>
          <li>Una <b>variable</b> es una caja con nombre donde el programa guarda un dato que puede cambiar: la puntuación, las vidas, el tiempo.</li>
          <li>Un <b>evento</b> es algo que pone en marcha un programa: pulsar la bandera verde, una tecla, hacer clic o recibir un mensaje.</li>
          <li>Los <b>operadores</b> comparan o calculan: mayor que, menor que, igual, suma, resta, número al azar.</li>
        </ul>
        <h3>Scratch</h3>
        <p>Es un lenguaje de <b>programación por bloques</b>: las instrucciones encajan como piezas y no hay errores de escritura. Lo forman el <b>escenario</b> (donde ocurre todo), los <b>objetos</b> (personajes) y los <b>programas</b> de cada objeto. Los bloques están ordenados por colores: Movimiento, Apariencia, Sonido, Eventos, Control, Sensores, Operadores y Variables.</p>
        <h3>Probar el software</h3>
        <p>Un programa no está terminado cuando funciona en tu ordenador, sino cuando funciona para quien lo usa. Para validarlo: pruébalo con otras personas, apunta qué hacen y qué falla, comprueba los casos raros (¿y si pulsa dos teclas a la vez?, ¿y si la puntuación llega a cero?) y corrige.</p>
        <h3>Autoría y licencias</h3>
        <ul>
          <li>Todo programa, imagen o sonido tiene un autor y unos derechos. Usar lo de otros sin permiso o sin citarlo no está bien, aunque esté en internet.</li>
          <li><b>Software propietario:</b> no puedes ver ni cambiar su código. <b>Software libre:</b> puedes usarlo, estudiarlo, modificarlo y compartirlo.</li>
          <li>Las licencias <b>Creative Commons</b> indican qué permite el autor. Todo lo que se comparte en Scratch tiene la licencia CC BY-SA: se puede reutilizar (hacer una <i>remezcla</i>) citando al autor y compartiendo igual.</li>
        </ul>`,
       tareas:[
        {n:1, t:"¿Qué sabes ya?", html:"<p>Contesta la evaluación inicial: qué es programar, un algoritmo, un robot, un sensor o la inteligencia artificial. No cuenta para la nota: sirve para saber desde dónde partimos. Guárdala, porque al final del curso la volverás a mirar.</p>"},
        {n:2, t:"Una máquina hace exactamente lo que le dices", html:"<p>Escribe las instrucciones para que una «máquina humana» haga una tarea cotidiana (dibujar una figura, ir de la puerta a una mesa, preparar un bocadillo). Un compañero las sigue al pie de la letra, sin interpretar nada.</p><ol><li>¿Qué ha salido mal?</li><li>Reescribe el algoritmo para que sea <b>ordenado, preciso y finito</b>.</li><li>Vuelve a probarlo hasta que funcione.</li></ol>", entrega:"Algoritmo final en el cuaderno", evalua:"p2pR"},
        {n:3, t:"Ahora la máquina puede decidir", html:"<p>Completa la ficha de condiciones: escribe reglas SI… ENTONCES… para una luz automática, un riego, una alarma de humo y una puerta automática. Después dibuja el <b>diagrama de flujo</b> de la puerta automática, con su rombo de decisión.</p>", entrega:"Ficha de condiciones", evalua:"p2pR"},
        {n:4, t:"Nuestro primer programa en Scratch", html:"<p>Abre el editor de Scratch y supera los retos en orden. No pases al siguiente hasta comprobar que el anterior funciona:</p><ol><li><b>El gato obedece:</b> al pulsar la bandera verde dice «Hola», se mueve 50 pasos, gira 90 grados y dice el nombre de tu equipo.</li><li><b>¿Importa el orden?</b> Cambia el orden de dos bloques y explica qué cambia.</li><li><b>Control con teclas:</b> el personaje se mueve con las flechas.</li><li><b>Toma una decisión:</b> si toca el borde, dice «¡Cuidado!».</li></ol>", enlaces:[["Editor de Scratch","https://scratch.mit.edu/projects/editor/"]], evalua:"p2pR"},
        {n:5, t:"Bucles: dibuja con el lápiz", html:"<p>Con la extensión <b>Lápiz</b>, haz que el personaje dibuje un cuadrado. Después hazlo con el bloque <b>repetir</b>: ¿cuántos bloques te has ahorrado? Dibuja un triángulo, un hexágono y una figura con 36 lados. Descubre la regla: ¿cuánto hay que girar en cada lado para un polígono de <i>n</i> lados?</p>", evalua:"p2pR"},
        {n:6, t:"Variables: marcador y cronómetro", html:"<p>Crea un minijuego en el que el personaje atrape un objeto que aparece en un lugar al azar. Usa una variable <b>puntos</b> que suba cada vez que lo atrapas y otra <b>tiempo</b> que baje desde 30. Cuando el tiempo llegue a cero, el juego termina y muestra la puntuación.</p>", evalua:"p2pR"},
        {n:7, t:"Diseña tu videojuego", html:"<p>Ahora el juego es vuestro. Antes de programar:</p><ol><li>Escribid la idea en tres frases: de qué trata, cómo se gana y cómo se pierde.</li><li>Descomponed el juego en partes: personajes, escenarios, controles, puntuación.</li><li>Dibujad el diagrama de flujo de la parte principal.</li></ol><p>Después programadlo. Debe tener eventos, al menos una condición, un bucle y una variable.</p>", entrega:"Ficha de diseño y enlace del proyecto por Teams", evalua:"p2pR"},
        {n:8, t:"Cazadores de errores", html:"<p>Intercambiad los juegos con otro equipo. Jugad al juego de los demás y rellenad un <b>informe de pruebas</b>: qué funciona, qué falla, cómo provocar el error y una propuesta de mejora. Con el informe que recibáis, corregid vuestro juego y anotad qué habéis cambiado.</p>", entrega:"Informe de pruebas recibido y lista de cambios", evalua:"p2pR"},
        {n:9, t:"Publica con tus créditos", html:"<p>Antes de compartir vuestro juego en el estudio de la clase, completad sus <b>instrucciones</b> y sus <b>notas y créditos</b>: quién lo ha hecho, qué imágenes o sonidos no son vuestros y de dónde salen. Explicad en dos frases qué significa que otra persona pueda hacer una remezcla de vuestro juego.</p>", entrega:"Proyecto publicado en el estudio de la clase", evalua:"p2pR"}

      {id:"p2-robot", etiqueta:"Situación de aprendizaje 2 · noviembre–enero", titulo:"Carrera de saltadores", subtitulo:"Un robot que corre sin ruedas",
       cita:["Un robot no es más que una idea con motores.",""],
       bloque:"Bloque: Robótica",
       desc:"Vamos a construir con LEGO SPIKE un robot corredor sin ruedas que llegue a la meta lo antes posible. Empezamos viendo cómo se adapta la tecnología a cada persona, aprendemos qué es un robot y cómo se programa, y mejoramos nuestro saltador prueba a prueba hasta la gran carrera.",

       producto:"Robot saltador con LEGO SPIKE que compite en la carrera de la clase, con su diario de ingeniería.",
       anexos:["p2rV","p2rR"],
       teoria:`
        <h3>¿Qué es un robot?</h3>
        <p>Un <b>robot</b> es una máquina programable que percibe su entorno, toma decisiones y actúa. Se resume en tres verbos:</p>
        <div class="defs">
          <div><b>Percibir</b><p>Con los <b>sensores</b>: luz, color, distancia, fuerza, sonido, temperatura.</p></div>
          <div><b>Decidir</b><p>Con el <b>controlador</b>, el «cerebro» que ejecuta el programa.</p></div>
          <div><b>Actuar</b><p>Con los <b>actuadores</b>: motores, luces, altavoces, pantallas.</p></div>
        </div>
        <p>Todo ello va montado sobre una <b>estructura</b> y necesita una fuente de <b>energía</b>, normalmente una batería.</p>
        <h3>Tipos de robots</h3>
        <ul>
          <li><b>Industriales:</b> brazos que sueldan, pintan o empaquetan en las fábricas.</li>
          <li><b>Móviles:</b> se desplazan con ruedas, orugas, patas o hélices (robots aspiradora, drones, rovers).</li>
          <li><b>De servicio:</b> ayudan a las personas: robots cirujanos, de reparto, de limpieza.</li>
          <li><b>Humanoides y animaloides:</b> imitan la forma de personas o animales.</li>
          <li><b>Colaborativos:</b> trabajan junto a personas de forma segura.</li>
        </ul>
        <h3>Grados de libertad</h3>
        <p>Son los movimientos independientes que puede hacer un robot. Cada articulación que gira o se desplaza suma uno. Tu brazo, del hombro a la muñeca, tiene siete; un brazo industrial suele tener seis. Cuantos más grados de libertad, más movimientos puede hacer, pero más difícil es controlarlo.</p>
        <h3>Moverse sin ruedas</h3>
        <p>Los robots con patas transforman el giro del motor en un movimiento de ida y vuelta mediante mecanismos como la <b>biela-manivela</b> o la <b>leva</b>. Caminan mejor que las ruedas por terrenos irregulares, pero son más lentos y complejos. La forma y el tamaño de las patas, el peso y el reparto de la carga cambian mucho cómo avanza el robot.</p>
        <h3>LEGO SPIKE</h3>
        <div class="defs">
          <div><b>Hub</b><p>El controlador: tiene batería, botones, matriz de luces, altavoz, sensor de giro y seis puertos (A–F) para motores y sensores.</p></div>
          <div><b>Motores</b><p>Giran un número exacto de grados o rotaciones a la velocidad que indiques (en %). Además, saben en qué posición están.</p></div>
          <div><b>Sensores</b><p>De color (también mide la luz), de distancia (ultrasonidos) y de fuerza (detecta si se pulsa).</p></div>
          <div><b>App</b><p>Se programa con bloques de Scratch o con Python y se envía el programa al hub por Bluetooth o por cable.</p></div>
        </div>
        <h3>Programar un motor</h3>
        <ul>
          <li>Una <b>rotación</b> son 360 grados.</li>
          <li>La <b>velocidad</b> va de −100 % a 100 %: el signo cambia el sentido de giro.</li>
          <li>Puedes moverlo por <b>grados</b>, por <b>rotaciones</b>, por <b>segundos</b> o hasta que un sensor detecte algo.</li>
        </ul>
        <h3>Probar como un ingeniero</h3>
        <p>Para saber qué mejora tu robot, <b>cambia una sola cosa cada vez</b> y deja todo lo demás igual. Repite cada prueba al menos tres veces, apunta los resultados en una tabla y calcula la media. Si cambias dos cosas a la vez, no sabrás cuál ha funcionado.</p>`,
       tareas:[
        {n:1, t:"Tecnología a la medida de cada persona", html:"<p>Mirad el vídeo sobre el ciclista paralímpico Martín Berchesi y responded en equipo: ¿qué os ha llamado la atención?, ¿en qué se diferencia su bicicleta de una convencional?, ¿qué problema resuelve cada adaptación? Estas ideas os servirán para diseñar vuestro robot.</p>", enlaces:[["Vídeo: Martín Berchesi","https://youtu.be/kgpVUwjIEek"]], entrega:"Ficha de la sesión 1", evalua:"p2rR"},
        {n:2, t:"¿Qué es un robot?", html:"<p>Busca imágenes de cinco robots reales distintos y clasifícalos por tipo. Para cada uno indica qué sensores y actuadores crees que tiene y para qué sirve. Después cuenta los grados de libertad de tu propio brazo moviendo cada articulación.</p>", evalua:"p2rR"},
        {n:3, t:"Conoce el SPIKE", html:"<p>Explora el kit: localiza el hub, los motores y los sensores. Conecta el hub a la app, enciende la matriz de luces con un dibujo propio y haz que suene un sonido al pulsar el botón izquierdo. Anota en el diario qué hace cada pieza.</p>", evalua:"p2rR"},
        {n:4, t:"Primeros movimientos", html:"<p>Conecta un motor y prográmalo para que gire una rotación, luego 90 grados, luego 2 segundos. Prueba velocidades positivas y negativas. Pon una marca en el eje y comprueba que el motor hace exactamente lo que le pides.</p>", evalua:"p2rR"},
        {n:5, t:"Montamos el saltador", html:"<p>Montad el robot saltador siguiendo la guía de montaje del proyecto. Antes de programarlo, explicad con un dibujo cómo transforma el giro del motor en un salto o en un paso.</p>", evalua:"p2rR"},
        {n:6, t:"Experimenta y mejora", html:"<p>Medid cuánto tarda vuestro saltador en recorrer un metro. Después elegid <b>una sola variable</b> para mejorar (la velocidad del motor, la forma o el tamaño de las patas, el peso o dónde está) y haced al menos tres pruebas con cada cambio. Apuntadlo todo en una tabla y quedaos con la mejor versión.</p>", entrega:"Tabla de pruebas en el diario", evalua:"p2rR"},
        {n:7, t:"El robot ve la meta", html:"<p>Añadid un sensor para que el robot sea más autónomo: que arranque cuando se pulse el sensor de fuerza y que se pare solo cuando el sensor de color detecte la línea de meta. Dibujad antes el diagrama de flujo del programa.</p>", evalua:"p2rR"},
        {n:8, t:"La gran carrera", html:"<p>¡Carrera de saltadores! Cada robot tiene dos intentos y cuenta el mejor tiempo. Las normas: el robot sale parado detrás de la línea, no se puede tocar durante la carrera y debe pararse solo en la meta.</p>", evalua:"p2rV"},
        {n:9, t:"Diario de ingeniería", html:"<p>Completad el diario del proyecto: fotos del robot, programa final, tabla de pruebas, qué cambió y por qué, y qué haríais si tuvierais una semana más. Terminad con una reflexión: ¿dónde serían útiles los robots con patas en lugar de ruedas?, ¿a quién podrían ayudar?</p>", entrega:"Diario de ingeniería por Teams", evalua:"p2rR"}

      {id:"p2-reparto", etiqueta:"Situación de aprendizaje 3 · febrero–abril", titulo:"Ciudad de reparto", subtitulo:"Robots que llevan los pedidos por el barrio",

       bloque:"Bloques: Robótica · Programación",
       desc:"Construimos entre toda la clase la maqueta de un barrio con calles, cruces y paradas. Cada robot Maqueen aprende a seguir las calles, a contar los cruces para llegar a la dirección correcta, a frenar si hay un obstáculo y a entregar el pedido con su pala. Al final, una centralita envía los pedidos por radio y hacemos una demostración de reparto ante otra clase.",

       teoria:`
        <h3>La micro:bit</h3>
        <p>Es una pequeña placa programable: el «cerebro» de nuestro robot. Tiene dos botones (A y B), una pantalla de 25 luces, sensores de luz, temperatura, movimiento (acelerómetro) y sonido, un altavoz y una <b>radio</b> para enviar mensajes a otras micro:bit. Se programa con bloques en <b>MakeCode</b>, muy parecido a Scratch.</p>
        <h3>El robot Maqueen Plus V2</h3>
        <p>Es el «cuerpo» del robot: la micro:bit se enchufa encima y le da órdenes.</p>
        <div class="defs">
          <div><b>Motores y ruedas</b><p>Dos motores, uno por rueda. Si giran a la misma velocidad, va recto; si uno va más rápido, gira.</p></div>
          <div><b>Sensores de línea</b><p>Cinco sensores debajo (L2, L1, M, R1, R2) que distinguen negro y blanco: negro = 1, blanco = 0.</p></div>
          <div><b>Ultrasonidos</b><p>Mide la distancia a lo que tiene delante, como un murciélago.</p></div>
          <div><b>Luces y zumbador</b><p>Dos faros, cuatro luces de colores y un zumbador para avisar.</p></div>
          <div><b>Mecanismos</b><p>Pala, empujador, pinza o montacargas que se mueven con un pequeño motor llamado <b>servo</b>, que gira a un ángulo exacto.</p></div>
        </div>
        <h3>Programar el Maqueen</h3>
        <ol class="steps4">
          <li>Abre MakeCode y crea un proyecto nuevo.</li>
          <li>Añade la <b>extensión del Maqueen Plus V2</b> (el profesor te dará el enlace): aparecerán sus bloques.</li>
          <li>Programa y prueba lo que puedas en el simulador.</li>
          <li>Pasa el programa a la micro:bit, colócala en el robot y enciéndelo.</li>
        </ol>
        <h3>Seguir una línea con tres sensores</h3>
        <p>El robot mira la calle con sus tres sensores centrales y decide:</p>
        <div class="table-wrap"><table class="tbl"><thead><tr><th>L1</th><th>M</th><th>R1</th><th>¿Qué pasa?</th><th>Qué hace</th></tr></thead><tbody>
          <tr><td>0</td><td>1</td><td>0</td><td>Va centrado</td><td>Recto</td></tr>
          <tr><td>1</td><td>0 o 1</td><td>0</td><td>La línea se va a la izquierda</td><td>Gira a la izquierda</td></tr>
          <tr><td>0</td><td>0 o 1</td><td>1</td><td>La línea se va a la derecha</td><td>Gira a la derecha</td></tr>
          <tr><td>1</td><td>1</td><td>1</td><td>¡Un cruce!</td><td>Cuenta el cruce</td></tr>
        </tbody></table></div>
        <h3>Llegar a la dirección correcta</h3>
        <p>Si las paradas están numeradas por cruces, el robot puede usar una <b>variable</b> que cuente los cruces que pasa. Cuando el contador llega al número de la parada, se detiene y entrega. Como en Scratch, la variable empieza en 0 y suma 1 en cada cruce.</p>
        <h3>Pedidos por radio</h3>
        <p>Las micro:bit pueden enviarse números y palabras por radio si están en el mismo <b>grupo</b>. Una micro:bit hace de <b>centralita</b>: con sus botones elige un número de parada y lo envía. El robot lo recibe, lo guarda en una variable y sale a repartir.</p>
        <h3>Seguridad ante todo</h3>
        <p>Un robot de reparto comparte el espacio con personas y otros robots. Siempre debe comprobar con el ultrasonido si hay algo delante y frenar a tiempo, encender las luces y avisar con el zumbador.</p>`,
       tareas:[
        {n:1, t:"Conoce tu robot", html:"<p>Localiza en tu Maqueen los motores, los cinco sensores de línea, el ultrasonido, las luces, el zumbador y dónde va la micro:bit. Haz tu primer programa: al pulsar A se encienden los faros y suena una nota; al pulsar B se apagan.</p>", evalua:"p2cR"},
        {n:2, t:"Primeros movimientos", html:"<p>Programa el robot para que avance, se pare, retroceda y gire. Después, reto: que dibuje un <b>cuadrado</b> en el suelo. ¿Cuánto tiempo tienen que girar los motores para hacer 90 grados? Pruébalo y ajústalo; usa un bucle para no repetir bloques.</p>", evalua:"p2cR"},
        {n:3, t:"¿Qué ve el robot?", html:"<p>Muestra en la pantalla de la micro:bit lo que lee el sensor central y pasa el robot por encima de la línea. Completa la tabla: ¿qué valor da en negro?, ¿y en blanco? Calibra los sensores si no distinguen bien.</p>", evalua:"p2cR"},
        {n:4, t:"Sigue la calle", html:"<p>Dibuja el diagrama de flujo con los casos de la tabla de la teoría y programa el seguidor de línea. Mide cuánto tarda en dar una vuelta al circuito de prueba y mejora la velocidad sin que se salga.</p>", entrega:"Diagrama y programa", evalua:"p2cR"},
        {n:5, t:"Diseñamos el barrio", html:"<p>Entre toda la clase diseñamos la maqueta: calles de cinta negra sobre fondo blanco, curvas suaves, cruces y paradas numeradas (casa, farmacia, colegio, tienda…). Cada equipo diseña y decora un edificio o una parada.</p>", evalua:"p2cR"},
        {n:6, t:"Llega a la dirección", html:"<p>Usa una variable para contar los cruces. El robot sale de la base y se para justo en la parada que le digas. Prueba todas las paradas y apunta los aciertos.</p>", evalua:"p2cR"},
        {n:7, t:"Seguridad vial", html:"<p>Añade el ultrasonido: si hay algo a menos de 10 cm, el robot frena, enciende las luces de color rojo y pita. Cuando el camino queda libre, sigue su ruta.</p>", evalua:"p2cR"},
        {n:8, t:"Entrega el pedido", html:"<p>Monta la pala o el empujador y programa el servo para que deje el paquete en la parada y vuelva a su posición. ¿Qué ángulo necesitas para soltarlo sin que se caiga?</p>", evalua:"p2cR"},
        {n:9, t:"La centralita", html:"<p>Programa una segunda micro:bit como centralita: con los botones eliges la parada y la envías por radio. El robot recibe el número, sale a repartir y, al volver a la base, avisa a la centralita de que el pedido está entregado.</p>", evalua:"p2cR"},
        {n:10, t:"Día de reparto", html:"<p>Demostración ante otra clase: los visitantes eligen pedidos en la centralita y los robots los entregan. Cada equipo explica cómo funciona su robot. Después, completad el diario del proyecto con fotos, programas y mejoras.</p>", entrega:"Diario del proyecto por Teams", evalua:"p2cV"}

      {id:"p2-ia", etiqueta:"Situación de aprendizaje 4 · mayo–junio", titulo:"Enseña a una máquina", subtitulo:"Qué es la IA, cómo aprende… y un torneo de robots controlados con gestos",
       cita:["La tecnología ayuda, pero pensar sigue siendo obligatorio.",""],
       bloque:"Bloque: Inteligencia artificial",
       desc:"La inteligencia artificial está en el móvil, en las series que te recomiendan y en el traductor. Descubrimos qué es y qué no es, en qué se diferencia de nuestra inteligencia y cómo aprende a partir de datos. Entrenamos nuestros propios modelos, buscamos sus fallos y terminamos con un torneo en el que los robots Maqueen obedecen a los gestos de nuestra mano.",
       criterios:["1.1","1.2","1.3","1.4","3.5","4.1","4.2"],
       producto:"Robot Maqueen controlado con gestos gracias a un modelo de IA entrenado por el equipo, que compite en el torneo de la clase.",
       anexos:["p2iV","p2iR"],
       teoria:`
        <h3>¿Qué es la inteligencia artificial?</h3>
        <p>La <b>inteligencia artificial (IA)</b> es la rama de la informática que permite a las máquinas hacer tareas que normalmente requieren inteligencia humana: reconocer imágenes, entender el lenguaje o tomar decisiones. No es un cerebro: es un programa que aprende de datos y mejora con ellos.</p>
        <p>Ya la usas cada día: el traductor, las recomendaciones de series y música, el desbloqueo facial del móvil, el filtro de correo no deseado o los asistentes de voz.</p>
        <h3>Tres tipos de IA</h3>
        <div class="defs">
          <div><b>IA débil o específica</b><p>Hace muy bien una sola tarea. Es la única que existe hoy: asistentes de voz, traductores, filtros de spam.</p></div>
          <div><b>IA general</b><p>Podría aprender cualquier tarea como una persona. Todavía no existe.</p></div>
          <div><b>Superinteligencia</b><p>Superaría a los humanos en todo. Es ciencia ficción y un tema de debate entre expertos.</p></div>
        </div>
        <h3>Aprender: personas y máquinas</h3>
        <p>Los seres vivos aprenden con la experiencia: un bebé ve muchos perros hasta que reconoce uno nuevo. Las máquinas hacen algo parecido con el <b>aprendizaje automático</b>:</p>
        <ol class="steps4">
          <li><b>Datos:</b> muchos ejemplos, cada uno con su etiqueta («esto es un gato», «esto es un perro»).</li>
          <li><b>Entrenamiento:</b> el programa busca qué tienen en común los ejemplos de cada clase.</li>
          <li><b>Modelo:</b> lo que ha aprendido.</li>
          <li><b>Predicción:</b> ante un ejemplo nuevo, el modelo dice a qué clase cree que pertenece y con qué seguridad.</li>
        </ol>
        <p>Pero la máquina no entiende lo que ve: solo encuentra patrones. Si los datos son pocos o están mal elegidos, aprenderá mal.</p>
        <h3>Árboles de decisión y redes neuronales</h3>
        <ul>
          <li>Un <b>árbol de decisión</b> clasifica haciendo preguntas de sí o no, una tras otra: «¿tiene plumas?», «¿vuela?». Es fácil de entender y de dibujar.</li>
          <li>Una <b>red neuronal</b> se inspira en las neuronas del cerebro: muchas unidades conectadas en capas que se ajustan con cada ejemplo. Son las que reconocen imágenes y voz.</li>
          <li>El <b>big data</b> son cantidades enormes de datos. Cuantos más datos de calidad, mejor aprende una IA.</li>
          <li>Los <b>sensores</b> (cámaras, micrófonos, acelerómetros) son los ojos y oídos con los que la IA recoge datos del mundo.</li>
        </ul>
        <h3>Sesgos: cuando la IA es injusta</h3>
        <p>Un <b>sesgo</b> es un error sistemático que hace que la IA funcione mejor para unos que para otros. Casi siempre viene de los datos: si un sistema de reconocimiento facial se entrena casi solo con caras de un tipo, fallará más con las demás. La IA no es neutral: repite lo que hay en sus datos.</p>
        <h3>La IA en tu muñeca: micro:bit CreateAI</h3>
        <p>La micro:bit tiene un <b>acelerómetro</b> que mide cómo se mueve. Con la web <b>micro:bit CreateAI</b> grabamos varios ejemplos de cada gesto (por ejemplo, inclinar hacia delante, girar la muñeca o sacudir), entrenamos un modelo y lo pasamos a MakeCode. A partir de ahí, la micro:bit reconoce el gesto y puede enviar una orden por radio a un robot. Igual que con las imágenes: cuantos más ejemplos y más variados, mejor aprende.</p>
        <h3>Usarla con responsabilidad</h3>
        <ul>
          <li>La IA puede equivocarse y decirlo con total seguridad: comprueba siempre lo importante.</li>
          <li>Protege tus datos y los de los demás: no subas fotos ni información personal de otras personas.</li>
          <li>Hay decisiones que deben seguir tomándolas personas, sobre todo las que afectan a la vida de otros.</li>
          <li>Si usas IA en un trabajo, dilo y explica para qué.</li>
        </ul>`,
       tareas:[
        {n:1, t:"¿Dónde está la IA?", html:"<p>Haz una lista de todas las veces que crees que has usado inteligencia artificial esta semana. Para cada una, explica qué tarea hace la IA y qué datos crees que usa. Después, en clase, decidimos cuáles son IA de verdad y cuáles son programas normales.</p>", evalua:"p2iR"},
        {n:2, t:"Desgranando el vídeo", html:"<p>Mira el vídeo resumen sobre inteligencia artificial y haz una <b>infografía</b> en la herramienta que prefieras con las ideas principales: qué es, tipos, ejemplos y riesgos.</p>", enlaces:[["Vídeo resumen sobre IA","https://youtu.be/_tA5cinv0U8"]], entrega:"Infografía por Teams", evalua:"p2iR"},
        {n:3, t:"¿Persona o máquina?", html:"<p>En equipo, decidid quién hace mejor cada tarea y justificadlo: jugar al ajedrez, conducir ante un imprevisto, reconocer una cara en una foto antigua, escribir una historia con sentimientos, calcular una operación de doce cifras, aprender normas sociales nuevas. Debate final: ¿hay tareas que deberían seguir siendo solo humanas?</p>", evalua:"p2iR"},
        {n:4, t:"Un árbol que adivina", html:"<p>Diseña un <b>árbol de decisión</b> en papel que adivine un animal entre ocho posibles con preguntas de sí o no. Pruébalo con un compañero. ¿Cuántas preguntas necesitas como máximo? ¿Qué pasa si piensa en un animal que no estaba en tu lista?</p>", evalua:"p2iR"},
        {n:5, t:"Entrena tu modelo", html:"<p>Con Teachable Machine, crea un modelo de imagen que distinga tres clases (por ejemplo, tres objetos del estuche o tres gestos). Usa <b>al menos 50 ejemplos por clase</b>.</p><ol><li>Pruébalo 10 veces con cada clase y apunta los aciertos.</li><li>Cambia la luz, el fondo o la distancia: ¿sigue acertando?</li><li>Mejora los datos y vuelve a medir.</li></ol>", enlaces:[["Teachable Machine","https://teachablemachine.withgoogle.com"]], entrega:"Tabla de pruebas y capturas", evalua:"p2iR"},
        {n:6, t:"Cazadores de sesgos", html:"<p>Entrena a propósito un modelo con datos <b>desequilibrados</b>: muchos ejemplos de una clase y muy pocos de otra, o todos con el mismo fondo. Comprueba cómo falla. Después redacta una explicación breve sobre por qué es importante evitar los sesgos en la IA y qué consecuencias tienen en la vida real.</p>", entrega:"Explicación por Teams", evalua:"p2iR"},
        {n:7, t:"Gestos que se entienden", html:"<p>Con micro:bit CreateAI, entrena un modelo que reconozca cuatro gestos con la micro:bit en la muñeca: adelante, atrás, izquierda y derecha, más un gesto de «quieto». Graba ejemplos de varias personas del equipo, pruébalo y mejora los gestos que se confunden.</p>", enlaces:[["micro:bit CreateAI","https://createai.microbit.org"]], evalua:"p2iR"},
        {n:8, t:"El robot obedece", html:"<p>Pasa el modelo a MakeCode: cada gesto envía una orden por radio al Maqueen, que avanza, retrocede o gira. Por seguridad, con el gesto «quieto» o si no recibe órdenes, el robot se para.</p>", evalua:"p2iR"},
        {n:9, t:"Torneo de robots con gestos", html:"<p>¡Torneo! Pruebas de habilidad (slalom entre conos, llevar una pelota a la portería, aparcar en una plaza) controlando el robot solo con gestos. Después, reflexión: ¿qué ha fallado más, el robot o el modelo?, ¿por qué?</p>", evalua:"p2iV"},
        {n:10, t:"Decálogo de la IA responsable", html:"<p>Entre toda la clase, redactamos diez normas para usar la IA en el colegio y en casa de forma segura, justa y honesta. Cada equipo propone dos y las defiende ante la clase.</p>", evalua:"p2iR"}

       teoria:`
        <h3>Las reglas del programa</h3>
        <ul>
          <li>Cada sección dura entre <b>2 y 3 minutos</b>.</li>
          <li>Debe aparecer contenido real de programación, robótica o IA: no vale solo hacer teatro.</li>
          <li>Tiene que haber humor o sorpresa, pero sin ridiculizar a nadie.</li>
          <li>Todo el equipo participa de forma visible: presentar, escribir, actuar, revisar, diseñar o coordinar.</li>
          <li>La IA se puede usar como ayuda, pero toda respuesta se revisa y se adapta.</li>
          <li>Si se graba, el vídeo es para uso interno de la clase y solo aparece quien tenga autorización.</li>
        </ul>
        <h3>Ideas de secciones</h3>

          <div><b>Entrevista</b><p>A un robot, a un algoritmo o a un sensor que cuenta su vida.</p></div>
        </div>
        <h3>Si os bloqueáis</h3>
        <p>Usad esta estructura: <b>problema → error tecnológico → explicación → solución → frase final</b>.</p>`,

  {
    id:"piayr-3", nombre:"Programación, IA y Robótica II", corto:"PIAyR II", nivel:"3.º ESO", color:"#c2410c",
    intro:"La robótica es el hilo del curso: diseñamos sistemas automáticos que toman buenas decisiones, construimos un rover para superar misiones en Marte, creamos un almacén automatizado con una flota de robots y terminamos con un prototipo con inteligencia artificial que ayude a personas reales. Cerramos con la feria de robótica.",

      cita:"La mejor forma de predecir el futuro es inventarlo.",
      texto:"En segundo aprendisteis a dar instrucciones. Este curso trabajamos con más autonomía: diseñaremos sistemas completos, elegiremos los sensores y las herramientas más adecuados, evaluaremos si funcionan y nos preguntaremos siempre para quién son y qué impacto tienen.",

    unidades:[
      {id:"p3-prog", etiqueta:"Situación de aprendizaje 1 · septiembre–octubre", titulo:"Centro de control", subtitulo:"Sistemas que toman buenas decisiones",
       cita:["Programar no es mandar: es dar instrucciones claras.",""],
       bloque:"Bloque: Programación",
       desc:"Somos una empresa de ingeniería contratada para automatizar el colegio: ahorrar energía, mejorar la seguridad y hacer el edificio más eficiente. Diseñamos reglas lógicas que combinan varias condiciones, las programamos en el simulador de micro:bit, damos el salto del bloque al código escrito y construimos un prototipo real del aula inteligente.",
       criterios:["2.1","2.2","2.3","2.4","2.5","4.1","4.4","4.5"],
       producto:"Prototipo de aula inteligente con micro:bit que combina sensores y condiciones, con su documentación y su versión mejorada.",
       anexos:["p3pV","p3pR"],
       teoria:`
        <h3>Entrada, decisión y salida</h3>
        <p>Cualquier sistema automático funciona igual: recoge datos con <b>sensores</b> (entrada), un <b>controlador</b> los compara con unas reglas (decisión) y activa unos <b>actuadores</b> (salida). Un termostato, una puerta automática o el riego de un jardín lo hacen sin necesidad de inteligencia artificial: solo siguen reglas programadas.</p>
        <h3>Combinar condiciones: Y, O, NO</h3>
        <p>Una sola regla casi nunca basta. Los <b>operadores lógicos</b> combinan varias condiciones:</p>
        <div class="defs">
          <div><b>Y (AND)</b><p>Se cumple solo si se cumplen <b>todas</b>. «Hay alguien Y está oscuro → encender luces».</p></div>
          <div><b>O (OR)</b><p>Se cumple si se cumple <b>al menos una</b>. «Hay humo O la temperatura supera 60 ºC → alarma».</p></div>
          <div><b>NO (NOT)</b><p>Invierte la condición. «Hay movimiento Y NO es horario escolar → alarma».</p></div>
        </div>
        <p>Una <b>tabla de verdad</b> recoge todos los casos posibles para comprobar que la regla hace lo que queremos. Con dos condiciones hay cuatro casos; con tres, ocho.</p>
        <div class="table-wrap"><table class="tbl"><thead><tr><th>Hay alguien</th><th>Está oscuro</th><th>Y</th><th>O</th></tr></thead><tbody><tr><td>No</td><td>No</td><td>No</td><td>No</td></tr><tr><td>No</td><td>Sí</td><td>No</td><td>Sí</td></tr><tr><td>Sí</td><td>No</td><td>No</td><td>Sí</td></tr><tr><td>Sí</td><td>Sí</td><td>Sí</td><td>Sí</td></tr></tbody></table></div>
        <h3>Estructuras de control y datos</h3>
        <ul>
          <li><b>Condicionales:</b> si… entonces… si no…, y condiciones encadenadas.</li>
          <li><b>Bucles:</b> repetir un número de veces, para siempre o mientras se cumpla una condición.</li>
          <li><b>Variables</b> (datos que cambian), <b>constantes</b> (datos fijos, como el umbral de 27 ºC) y <b>operadores</b> de comparación (&gt;, &lt;, =) y aritméticos.</li>
          <li><b>Funciones:</b> un bloque de instrucciones con nombre que se reutiliza. Detectar <b>patrones</b> que se repiten y convertirlos en funciones es <b>generalizar</b>.</li>
        </ul>
        <h3>La placa micro:bit</h3>
        <p>Es una pequeña <b>tarjeta controladora</b> con sensores integrados (luz, temperatura, acelerómetro, brújula, micrófono), dos botones, una matriz de 25 luces, altavoz y radio para comunicarse con otras micro:bit. Se programa en <b>MakeCode</b>, que tiene un <b>simulador</b>: puedes probar el programa en pantalla antes de enviarlo a la placa.</p>
        <h3>De los bloques al código</h3>
        <p>Los bloques son una forma visual de escribir código. MakeCode permite ver el mismo programa en <b>Python</b> o <b>JavaScript</b>, que son <b>lenguajes de alto nivel</b>: se parecen al lenguaje humano y un programa los traduce al lenguaje de la máquina. Cada lenguaje tiene su <b>sintaxis</b> (cómo se escribe: paréntesis, dos puntos, sangrías) y su <b>semántica</b> (qué significa cada instrucción). Un error de sintaxis impide que el programa funcione; uno de semántica hace que funcione, pero mal.</p>
        <h3>Evaluar y mantener el software</h3>
        <p>Un programa se usa, falla y se mejora. Para mantenerlo: documenta qué hace cada parte, ponle nombres claros a las variables, guarda versiones y anota cada cambio. Un buen <b>informe de error</b> dice qué esperabas, qué pasó y cómo repetirlo.</p>
        <h3>Diseñar para todos y para el planeta</h3>
        <p>La <b>sostenibilidad</b> y la <b>inclusión</b> son requisitos de diseño, no extras: un sistema automático debe ahorrar energía, no gastarla, y debe funcionar para todas las personas (alguien en silla de ruedas, alguien que no oye la alarma, alguien que no lee bien).</p>
        <h3>Licencias</h3>
        <p>El <b>software libre</b> se puede usar, estudiar, modificar y compartir; el <b>propietario</b>, no. Las licencias Creative Commons y las de software libre (como MIT o GPL) indican qué puedes hacer con el trabajo de otros. Cita siempre el código o los recursos que reutilices.</p>`,
       tareas:[
        {n:1, t:"¿Cómo piensa una máquina?", html:"<p>Para cada sistema (puerta automática, termostato, farola, riego) identifica la <b>entrada</b> (sensor), la <b>decisión</b> (regla SI… ENTONCES…) y la <b>salida</b> (actuador). ¿Alguno necesita inteligencia artificial?</p>", evalua:"p3pR"},
        {n:2, t:"Decisiones con Y, O y NO", html:"<p>Escribe reglas para encender las luces del aula, activar el aire acondicionado y abrir el aparcamiento combinando varias condiciones. Comprueba cada regla con su <b>tabla de verdad</b>. Al final, explica la diferencia entre automatización e inteligencia artificial.</p>", evalua:"p3pR"},
        {n:3, t:"Centro de control: salvad el instituto", html:"<p>Resolved en equipo las misiones de la ficha: aula inteligente, alarma del colegio, laboratorio que se sobrecalienta, control de acceso y cazadores de bugs. En cada misión hay que <b>justificar</b> la solución: no basta con escribir Y, O o NO.</p>", entrega:"Ficha del centro de control", evalua:"p3pR"},
        {n:4, t:"Del papel al simulador", html:"<p>Programa en MakeCode la regla del aula inteligente: el botón A simula que hay alguien y el sensor de luz mide si está oscuro. Si se cumplen las dos condiciones, la matriz se enciende. Prueba los cuatro casos de la tabla de verdad en el simulador.</p>", enlaces:[["MakeCode para micro:bit","https://makecode.microbit.org"]], evalua:"p3pR"},
        {n:5, t:"Variables y funciones", html:"<p>Elige un reto:</p><ul><li><b>Control de aforo:</b> el botón A suma una persona, el B resta; si se supera el aforo, suena un aviso.</li><li><b>Laboratorio:</b> si la temperatura supera una constante y hay alguien, se muestra un icono de ventilador; si no hay nadie, se apaga todo para ahorrar.</li></ul><p>Crea al menos una <b>función</b> propia y usa una constante para el umbral.</p>", evalua:"p3pR"},
        {n:6, t:"Del bloque al código", html:"<p>Abre tu programa en la vista de <b>Python</b>. Localiza el condicional, el bucle y la variable. Cambia un valor directamente en el código, provoca a propósito un error de sintaxis y otro de semántica, y explica la diferencia.</p>", evalua:"p3pR"},
        {n:7, t:"Prototipo del aula inteligente", html:"<p>Montad un prototipo real con la micro:bit y los sensores disponibles que resuelva una necesidad del colegio: luces, ventilación, aforo, riego de plantas o aviso de ruido. Debe combinar al menos dos condiciones y tener en cuenta el ahorro de energía y la accesibilidad (por ejemplo, avisos con luz y con sonido).</p>", entrega:"Programa, fotos y vídeo breve por Teams", evalua:"p3pR"},
        {n:8, t:"Versión 2.0", html:"<p>Intercambiad el prototipo con otro equipo. Probad el suyo y escribid un <b>informe de errores</b> (qué esperabais, qué pasó y cómo repetirlo) y una propuesta de mejora. Con el informe que recibáis, publicad la versión 2.0 y anotad los cambios.</p>", entrega:"Informe recibido y registro de cambios", evalua:"p3pR"},
        {n:9, t:"Tu primera app", html:"<p>Crea con MIT App Inventor una app sencilla para el centro de control: una pantalla con el estado de cada sistema, botones para encender y apagar, y un aviso cuando algo va mal. Prueba la app en el iPad con la aplicación de App Inventor.</p>", enlaces:[["MIT App Inventor","https://appinventor.mit.edu"]], evalua:"p3pR"},
        {n:10, t:"Documentación y licencia", html:"<p>Completad la documentación del proyecto: problema, reglas y tablas de verdad, diagrama de flujo, código comentado, pruebas, versión 2.0 y créditos de lo que hayáis reutilizado. Elegid una licencia para vuestro proyecto y justificadla.</p>", entrega:"Documentación por Teams", evalua:"p3pR"}
       ],

      {id:"p3-robot", etiqueta:"Situación de aprendizaje 2 · noviembre–enero", titulo:"Misión a Marte", subtitulo:"Un rover que se las arregla solo",
       cita:["Los rovers no descansan. Los ingenieros que los programan, tampoco.",""],
       bloque:"Bloque: Robótica",
       desc:"Una orden enviada a Marte tarda entre 4 y 24 minutos en llegar. Por eso los rovers tienen que tomar decisiones por su cuenta. Diseñamos, construimos y programamos nuestro rover para superar misiones cada vez más difíciles: moverse con precisión, esquivar obstáculos, seguir una ruta, recoger muestras y obedecer desde la Tierra en tiempo real.",
       criterios:["3.1","3.2","3.3","3.4","3.5","3.6","4.1","4.3","4.4"],
       producto:"Rover programado que supera las misiones, con el informe de misión que evalúa su eficacia.",
       anexos:["p3rV","p3rR"],
       teoria:`
        <h3>Los rovers de Marte</h3>
        <p>Un <b>rover</b> es un robot explorador. Curiosity y Perseverance recorren Marte analizando rocas, buscando agua y señales de vida pasada. Como las órdenes tardan minutos en llegar, tienen que ser <b>autónomos</b>: perciben el terreno con sus sensores y deciden solos cómo moverse sin chocar.</p>
        <h3>Sensores y actuadores</h3>
        <div class="defs">
          <div><b>Distancia</b><p>Mide por ultrasonidos a qué distancia hay un obstáculo.</p></div>
          <div><b>Color y luz</b><p>Detecta colores o cuánta luz refleja el suelo. Sirve para seguir líneas.</p></div>
          <div><b>Fuerza</b><p>Detecta un choque o una pulsación.</p></div>
          <div><b>Giroscopio</b><p>Mide giros e inclinación: el rover sabe hacia dónde mira.</p></div>
          <div><b>Motores</b><p>Mueven las ruedas, una pinza o un brazo con precisión de grados.</p></div>
        </div>
        <p>Elegir bien los <b>módulos de entrada y salida</b> es parte del diseño: cada sensor de más añade peso, consumo y complejidad.</p>
        <h3>Moverse con precisión</h3>
        <p>En cada vuelta, una rueda avanza su <b>perímetro</b>: <b>P = π · d</b>. Si la rueda mide 5,6 cm de diámetro, avanza unos 17,6 cm por vuelta. Para recorrer 50 cm necesita 50 / 17,6 ≈ 2,84 vueltas, es decir, unos 1023 grados. En la realidad hay deslizamiento: por eso hay que <b>calibrar</b> midiendo y corrigiendo.</p>
        <h3>Control en lazo abierto y en lazo cerrado</h3>
        <ul>
          <li><b>Lazo abierto:</b> el robot hace lo programado sin comprobar el resultado («avanza 3 segundos»). Si algo cambia, falla.</li>
          <li><b>Lazo cerrado:</b> el robot mide con sus sensores y corrige sobre la marcha («avanza hasta que haya un obstáculo a 10 cm»). Es lo que hace un robot autónomo.</li>
        </ul>
        <h3>Seguir una línea</h3>
        <p>El sensor de color mira el borde de la línea. Si ve negro, el rover gira hacia un lado; si ve blanco, hacia el otro. Así avanza en zigzag pegado al borde. Cuanto más suave sea la corrección, más fluido será el movimiento.</p>
        <h3>Control remoto en tiempo real</h3>
        <p>A veces una persona tiene que tomar el control: el rover recibe órdenes por <b>Bluetooth</b> o por <b>radio</b> desde un mando, otra placa o una app. El reto es que la respuesta sea inmediata y que el robot siga siendo seguro si se pierde la conexión.</p>
        <h3>Evaluar la eficacia</h3>
        <p>Un robot es eficaz cuando cumple la misión de forma <b>fiable</b> (funciona siempre, no solo una vez), <b>precisa</b> y <b>eficiente</b> (sin gastar más tiempo ni energía de la necesaria). Se mide repitiendo pruebas y anotando el porcentaje de éxito, el error y el tiempo.</p>`,
       tareas:[
        {n:1, t:"Bienvenidos a la agencia espacial", html:"<p>Investiga un rover real (Sojourner, Spirit, Curiosity, Perseverance o Zhurong): qué misión tenía, qué sensores e instrumentos llevaba y cómo se movía. Explica por qué un rover tiene que ser autónomo.</p>", evalua:"p3rR"},
        {n:2, t:"Diseña tu rover", html:"<p>Antes de construir, escribid los <b>requisitos</b> de vuestro rover a partir de las misiones. Elegid qué sensores y actuadores necesitáis y justificad la elección. Dibujad un boceto con la posición de cada pieza.</p>", entrega:"Ficha de diseño", evalua:"p3rR"},
        {n:3, t:"Construir y calibrar", html:"<p>Montad el rover y calibrad el movimiento: calculad cuántos grados debe girar el motor para avanzar 50 cm y para girar 90 grados, comprobadlo con la regla y corregid hasta que el error sea menor de 2 cm.</p>", evalua:"p3rR"},
        {n:4, t:"Misión 1: salir de la base", html:"<p>El rover debe recorrer un circuito marcado en el suelo con giros, sin salirse, y volver a la base. Primero en lazo abierto. ¿Lo consigue cinco veces seguidas?</p>", evalua:"p3rR"},
        {n:5, t:"Misión 2: campo de rocas", html:"<p>El rover avanza por un terreno con obstáculos y los esquiva usando el sensor de distancia. Dibujad el diagrama de flujo antes de programar.</p>", evalua:"p3rR"},
        {n:6, t:"Misión 3: la ruta segura", html:"<p>Seguid la línea negra hasta la zona de muestras con el sensor de color. Ajustad la velocidad y la corrección para que sea rápido sin perder la línea.</p>", evalua:"p3rR"},
        {n:7, t:"Misión 4: recoger la muestra", html:"<p>Añadid un actuador (una pinza, una pala o un brazo) para recoger una muestra y llevarla a la base. Contad los grados de libertad de vuestro mecanismo.</p>", evalua:"p3rR"},
        {n:8, t:"Misión 5: control desde la Tierra", html:"<p>Programad un control remoto en tiempo real: el rover recibe órdenes desde otro dispositivo (la app, otro hub o una micro:bit por radio) y se para por seguridad si deja de recibirlas.</p>", evalua:"p3rR"},
        {n:9, t:"Informe de misión", html:"<p>Evaluad la eficacia del rover en cada misión: porcentaje de éxito en diez intentos, error medio y tiempo. Explicad qué falló, qué mejorasteis y qué cambiaríais en el diseño. Terminad valorando qué ventajas e inconvenientes tienen los robots autónomos en la Tierra (agricultura, rescate, reparto).</p>", entrega:"Informe de misión por Teams", evalua:"p3rR"}

      {id:"p3-almacen", etiqueta:"Situación de aprendizaje 3 · febrero–abril", titulo:"Almacén automatizado", subtitulo:"Una flota de robots que trabaja en equipo",
       cita:["En un almacén moderno, los robots llevan las estanterías a las personas.",""],
       bloque:"Bloques: Robótica · Programación",
       desc:"Somos una empresa de logística. Diseñamos un almacén a escala y programamos una flota de robots Maqueen que recogen cajas con el montacargas o la pinza, siguen los pasillos, se comunican por radio con el centro de control y se reparten el trabajo sin chocar. Medimos cuántos pedidos sacamos por minuto, lo mejoramos y presentamos nuestra empresa.",
       criterios:["2.1","2.3","3.1","3.2","3.3","3.4","3.5","3.6","4.1","4.3","4.4","4.5"],
       producto:"Almacén a escala con varios robots coordinados por radio, informe de eficacia y presentación de la empresa.",
       anexos:["p3aV","p3aR"],
       teoria:`
        <h3>Robots en la logística</h3>
        <p>En los grandes almacenes de comercio electrónico, miles de robots mueven estanterías y cajas. Hay dos tipos principales:</p>
        <div class="defs">
          <div><b>AGV</b><p>Vehículo de guiado automático: sigue rutas fijas marcadas en el suelo con líneas, imanes o códigos.</p></div>
          <div><b>AMR</b><p>Robot móvil autónomo: construye un mapa y decide su ruta, esquivando obstáculos.</p></div>
        </div>
        <p>Nuestros Maqueen funcionarán como AGV: siguen pasillos marcados y obedecen al centro de control.</p>
        <h3>Seguir pasillos con cinco sensores</h3>
        <p>Con los sensores centrales (L1, M, R1) el robot va por la línea; con los exteriores (L2, R2) detecta cruces y se recupera si se desvía. Algunos sensores dan además un valor <b>analógico</b> (cuánta luz reflejan, no solo negro o blanco), que permite corregir de forma más suave: cuanto más se aleja de la línea, más corrige. Es el <b>control proporcional</b>.</p>
        <h3>Servos: el montacargas y la pinza</h3>
        <p>Un <b>servo</b> es un motor que gira hasta un ángulo exacto (normalmente de 0 a 180 grados) y se queda ahí. Con un servo el montacargas sube y baja, y la pinza se abre y se cierra. Hay que encontrar los ángulos adecuados y moverlos despacio para que la caja no se caiga.</p>
        <h3>Comunicación: un protocolo</h3>
        <p>Si varios robots escuchan la misma radio, todos reciben todos los mensajes. Necesitamos un <b>protocolo</b>: unas normas sobre cómo se escriben los mensajes. Por ejemplo, <code>R2:EST3</code> significa «robot 2, ve a la estantería 3». Cada robot solo obedece los mensajes con su número y responde <code>R2:OK</code> al terminar.</p>
        <h3>Tráfico sin choques</h3>
        <ul>
          <li><b>Zonas reservadas:</b> antes de entrar en un cruce, el robot pide permiso; si está ocupado, espera.</li>
          <li><b>Prioridades:</b> por ejemplo, el robot cargado pasa antes que el vacío.</li>
          <li><b>Último recurso:</b> el ultrasonido frena siempre si hay algo delante.</li>
        </ul>
        <h3>Medir la eficacia</h3>
        <p>Una empresa mide su almacén con datos: <b>pedidos por minuto</b>, <b>porcentaje de pedidos correctos</b>, tiempo medio por pedido y número de incidencias. Mejorar es cambiar algo (ruta, velocidad, reparto de tareas) y volver a medir.</p>
        <h3>Sostenibilidad e inclusión</h3>
        <p>Un almacén eficiente gasta menos energía: rutas más cortas, robots que no esperan con los motores encendidos, baterías recargables. Además, debe ser seguro y accesible para las personas que trabajan en él: pasillos amplios, avisos con luz y sonido, y robots que siempre se detienen ante una persona.</p>`,
       tareas:[
        {n:1, t:"Un almacén de verdad", html:"<p>Investiga cómo funciona un almacén robotizado real: qué hacen los robots, qué hacen las personas, qué tipo de robot es (AGV o AMR) y cómo evitan chocar. Valora una ventaja y un riesgo para el empleo y la seguridad.</p>", evalua:"p3aR"},
        {n:2, t:"Puesta a punto", html:"<p>Primeros programas con el Maqueen: movimientos, giro de 90 grados calibrado, lectura de los cinco sensores en la pantalla y calibración. Documenta los valores que obtienes.</p>", evalua:"p3aR"},
        {n:3, t:"Seguidor de precisión", html:"<p>Programa un seguidor de línea con cinco sensores que detecte los cruces y recupere la línea si se sale. Busca la velocidad máxima a la que completa el circuito diez veces sin fallar.</p>", entrega:"Tabla velocidad / éxito", evalua:"p3aR"},
        {n:4, t:"El brazo del almacén", html:"<p>Montad el montacargas o la pinza y encontrad los ángulos para recoger una caja, transportarla y dejarla en otra estantería sin que se caiga. Contad los grados de libertad del mecanismo.</p>", evalua:"p3aR"},
        {n:5, t:"Diseña el almacén", html:"<p>Haced el plano a escala del almacén: estanterías, pasillos, cruces, zona de carga y zona de expedición. Justificad el diseño con criterios de eficiencia (rutas cortas), seguridad y accesibilidad. Después, construidlo.</p>", entrega:"Plano a escala", evalua:"p3aR"},
        {n:6, t:"El protocolo", html:"<p>Definid el protocolo de mensajes por radio entre el centro de control y los robots: formato, órdenes posibles y respuestas. Programad el centro de control en una micro:bit y probad que cada robot obedece solo sus mensajes.</p>", entrega:"Tabla del protocolo", evalua:"p3aR"},
        {n:7, t:"Tráfico sin choques", html:"<p>Con dos o más robots a la vez, implementad un sistema para que no choquen en los cruces: zonas reservadas, turnos o prioridades. El ultrasonido siempre como último recurso.</p>", evalua:"p3aR"},
        {n:8, t:"Prueba de estrés", html:"<p>Lanzad diez pedidos en cinco minutos y medid pedidos por minuto, aciertos, tiempo medio e incidencias. Cambiad una cosa (ruta, velocidad, reparto de tareas), repetid y comparad.</p>", entrega:"Informe de eficacia", evalua:"p3aR"},
        {n:9, t:"Modo manual de emergencia", html:"<p>Programad un mando con una micro:bit que controle un robot en tiempo real inclinándola (adelante, atrás, giros) y que pare el robot si se pierde la señal. Sirve para sacar un robot atascado.</p>", evalua:"p3aR"},
        {n:10, t:"Presentamos la empresa", html:"<p>Presentad vuestra empresa de logística: demostración en directo, datos de eficacia, mejoras, medidas de sostenibilidad y seguridad, y un vídeo promocional breve (solo aparece quien tenga autorización).</p>", entrega:"Presentación y vídeo por Teams", evalua:"p3aV"}
       ],

      {id:"p3-ia", etiqueta:"Situación de aprendizaje 4 · mayo–junio", titulo:"IA con propósito", subtitulo:"Tecnología que ayuda a personas reales",
       cita:["La pregunta no es qué puede hacer la IA, sino qué debería hacer.",""],
       bloque:"Bloque: Inteligencia artificial",
       desc:"Usamos la visión artificial para crear tecnología de apoyo: un sistema que permita jugar sin teclado ni ratón, un comunicador que reconozca signos básicos o un asistente que avise de sonidos importantes. Entrenamos el modelo, medimos sus aciertos y errores, lo probamos con personas diversas y analizamos sus límites éticos. También exploramos la realidad virtual y aumentada.",
       criterios:["1.1","1.2","1.3","1.4","1.5","4.2","4.3","4.5"],
       producto:"Prototipo de tecnología de apoyo con un modelo de IA entrenado por el equipo, con su evaluación de precisión y su ficha ética.",
       anexos:["p3iV","p3iR"],
       teoria:`
        <h3>Técnicas de inteligencia artificial</h3>
        <div class="defs">
          <div><b>Sistemas expertos</b><p>Guardan el conocimiento de expertos en forma de reglas SI… ENTONCES… Son fáciles de explicar, pero no aprenden solos.</p></div>
          <div><b>Aprendizaje automático</b><p>El sistema aprende las reglas a partir de ejemplos. Es la base de casi toda la IA actual.</p></div>
          <div><b>Redes neuronales</b><p>Capas de unidades conectadas que ajustan sus conexiones con cada ejemplo. Con muchas capas se habla de <i>aprendizaje profundo</i>.</p></div>
        </div>
        <h3>Formas de aprender</h3>
        <ul>
          <li><b>Supervisado:</b> los ejemplos llevan etiqueta («gesto: pulgar arriba»). Es lo que hacen Teachable Machine con imágenes y micro:bit CreateAI con movimientos.</li>
          <li><b>No supervisado:</b> el sistema agrupa datos parecidos sin etiquetas (clientes con gustos similares).</li>
          <li><b>Por refuerzo:</b> aprende probando y recibiendo premios o castigos (robots que aprenden a andar, IA que juega).</li>
        </ul>
        <h3>Un buen conjunto de datos</h3>
        <ul>
          <li><b>Equilibrado:</b> el mismo número de ejemplos por clase.</li>
          <li><b>Variado:</b> distintas personas, luces, fondos y distancias, si así se va a usar.</li>
          <li><b>Separado:</b> no se prueba el modelo con los mismos datos con los que se entrenó.</li>
          <li><b>Respetuoso:</b> solo con imágenes o voces de quien ha dado permiso.</li>
        </ul>
        <h3>Medir si funciona</h3>
        <p>La <b>precisión</b> es el porcentaje de aciertos en pruebas nuevas. La <b>matriz de confusión</b> es una tabla que muestra qué clase se confunde con cuál: en las filas, lo que era de verdad; en las columnas, lo que dijo el modelo. Así se descubre, por ejemplo, que «puño» y «pulgar abajo» se confunden a menudo.</p>
        <h3>Equidad, inclusión y sesgos</h3>
        <p>Un modelo entrenado solo con las manos del equipo puede fallar con manos de otro tamaño, color de piel o movilidad. Diseñar con <b>inclusión</b> significa probar con personas diversas y corregir. Un modelo que funciona peor para un grupo tiene un <b>sesgo</b>, aunque nadie lo haya querido.</p>
        <h3>Implicaciones éticas y sociales</h3>
        <ul>
          <li><b>Privacidad:</b> las cámaras y micrófonos recogen datos personales.</li>
          <li><b>Responsabilidad:</b> si la IA se equivoca, ¿de quién es la culpa?</li>
          <li><b>Empleo:</b> la IA cambia trabajos; unos desaparecen y aparecen otros.</li>
          <li><b>Desinformación:</b> imágenes, voces y vídeos falsos (<i>deepfakes</i>).</li>
          <li><b>Tecnología asistiva:</b> la que mejora la autonomía y la participación de personas con discapacidad. Un prototipo de clase no sustituye a profesionales ni a soluciones certificadas, pero sirve para entender sus posibilidades.</li>
        </ul>
        <h3>Virtualizar la realidad</h3>
        <div class="defs">
          <div><b>Realidad virtual</b><p>Te sumerge en un mundo totalmente digital, normalmente con gafas.</p></div>
          <div><b>Realidad aumentada</b><p>Añade objetos digitales sobre el mundo real que ves con la cámara del iPad o del móvil.</p></div>
          <div><b>Gemelo digital</b><p>Copia virtual de un objeto o un edificio real para simular y probar antes de construir.</p></div>
        </div>`,
       tareas:[
        {n:1, t:"Sistema experto contra aprendizaje automático", html:"<p>Escribe un pequeño <b>sistema experto</b> de diez reglas que diagnostique por qué no funciona un ordenador o un robot. Después responde: ¿qué ventajas tendría un sistema que aprendiera de miles de averías reales?, ¿y qué inconvenientes?</p>", evalua:"p3iR"},
        {n:2, t:"Entrenar y medir", html:"<p>Entrena en Teachable Machine un modelo de tres clases. Haz 20 pruebas nuevas y construye su <b>matriz de confusión</b>. Calcula la precisión. ¿Qué clases se confunden y por qué?</p>", enlaces:[["Teachable Machine","https://teachablemachine.withgoogle.com"]], evalua:"p3iR"},
        {n:3, t:"Elegid el reto", html:"<p>Cada equipo elige un proyecto de tecnología de apoyo:</p><ul><li><b>Robot accesible:</b> un Maqueen que se maneja con gestos adaptados a una persona que no puede usar un mando (con micro:bit CreateAI).</li><li><b>GestureSwitch:</b> controlar un juego o una app con cuatro gestos, sin teclado ni ratón.</li><li><b>Sign2Text:</b> un comunicador que reconozca seis signos básicos y los muestre como texto.</li><li><b>Avisador de sonidos:</b> detectar sonidos importantes (timbre, alarma, alguien que llama) y avisar con luz.</li><li><b>Propuesta propia</b>, aprobada por el profesor.</li></ul><p>Escribid para quién es, qué problema resuelve y qué debe hacer exactamente.</p>", entrega:"Ficha del reto", evalua:"p3iR"},
        {n:4, t:"Dataset y entrenamiento", html:"<p>Diseñad un conjunto de datos <b>equilibrado</b> y controlad la iluminación, el fondo y la distancia. Entrenad el modelo, guardad la versión 1 y medid su precisión con pruebas nuevas.</p>", evalua:"p3iR"},
        {n:5, t:"Conectar el modelo", html:"<p>Haced que el modelo controle algo: un robot Maqueen por radio (modelo de gestos de CreateAI pasado a MakeCode), un juego o una animación en Scratch con la extensión de Teachable Machine (Stretch3), o una página que muestre el texto o el aviso. Comprobad que responde rápido y sin errores graves.</p>", enlaces:[["micro:bit CreateAI","https://createai.microbit.org"],["Stretch3 (Scratch con Teachable Machine)","https://stretch3.github.io"]], evalua:"p3iR"},
        {n:6, t:"Prueba con personas diversas", html:"<p>Probad el prototipo con personas distintas del equipo: otras edades, tamaños de mano, tonos de voz o posturas. Anotad dónde falla, mejorad los datos y medid la versión 2. ¿Ha mejorado la precisión para todos?</p>", evalua:"p3iR"},
        {n:7, t:"Ficha ética", html:"<p>Responded por escrito: ¿qué datos recoge el sistema y quién podría verlos?, ¿qué pasa si se equivoca?, ¿para quién funciona peor?, ¿podría sustituir a una persona o a un profesional?, ¿qué límites tiene y cómo los explicaríais a quien lo use?</p>", entrega:"Ficha ética por Teams", evalua:"p3iR"},
        {n:8, t:"Virtualiza tu prototipo", html:"<p>Cread un modelo 3D del dispositivo o del espacio donde se usaría (en Tinkercad o en otra herramienta) y mostradlo en <b>realidad aumentada</b> con el iPad, situado en el lugar real.</p>", enlaces:[["Tinkercad","https://www.tinkercad.com"]], evalua:"p3iR"},
        {n:9, t:"Feria de proyectos", html:"<p>Presentad el prototipo funcionando ante la clase o ante visitantes: el problema, la demostración, la precisión de las versiones 1 y 2, los límites y la reflexión ética.</p>", entrega:"Presentación y vídeo de la demostración", evalua:"p3iR"}

  {
    id:"lab-audiovisual-1", nombre:"Laboratorio de Creación Audiovisual", corto:"Lab. Audiovisual", nivel:"1.º ESO", color:"#7c4dcc",
    intro:"Aprendemos a mirar, escuchar y contar historias con imágenes y sonidos. Un proyecto por trimestre: una postal sonora que mezcla foto y sonido, una animación en stop motion y un cortometraje rodado por la clase que estrenamos en el colegio.",
    presentacion:{
      cita:"El cine es un espejo pintado.",
      texto:"Vivimos rodeados de imágenes, vídeos y sonidos: en el móvil, en las redes, en la publicidad, en el cine. En esta materia aprendemos cómo están hechos para entenderlos mejor y, sobre todo, para crear los nuestros. No hace falta saber dibujar ni ser artista: hace falta mirar con atención, tener ideas y trabajar en equipo.",
      bloques:["Fundamentos del lenguaje audiovisual","Planificación","Preproducción, producción y postproducción","Difusión"]
    },
    unidades:[
      {id:"lab-postal", etiqueta:"Proyecto 1 · 1.er trimestre", titulo:"Postal sonora", subtitulo:"Una imagen que se escucha",
       cita:["El sonido es la mitad de la película.",""],
       bloque:"Bloque: Fundamentos del lenguaje audiovisual",
       desc:"Cierra los ojos en el patio: ¿qué oyes? Aprendemos cómo funcionan el sonido y la imagen fija, grabamos y editamos nuestra propia voz, componemos un fotomontaje y lo unimos todo en una postal sonora: una imagen de un lugar de nuestro entorno con su paisaje sonoro.",
       criterios:["1.1","1.2","2.1","2.2","2.3","4.2"],
       producto:"Postal sonora: un fotomontaje de un lugar de nuestro entorno acompañado de su paisaje sonoro y de una breve narración con tu voz.",
       anexos:["labPV","labPR"],
       teoria:`
        <h3>El lenguaje audiovisual</h3>
        <p>Es la forma de comunicar con <b>imágenes</b> y <b>sonidos</b> a la vez. Como cualquier lenguaje, tiene sus reglas: dónde se coloca la cámara, qué se ve, qué se oye y en qué orden. Está en el cine, la televisión, la publicidad, los videojuegos y las redes sociales. Aprender sus códigos nos permite entender lo que vemos y no dejarnos manipular.</p>
        <h3>El sonido</h3>
        <p>El sonido es una vibración que viaja por el aire hasta nuestros oídos. Tiene cuatro cualidades:</p>
        <div class="defs">
          <div><b>Altura o tono</b><p>Grave o agudo. Depende de lo rápido que vibra (la frecuencia).</p></div>
          <div><b>Intensidad</b><p>Fuerte o suave: el volumen. Se mide en decibelios (dB).</p></div>
          <div><b>Timbre</b><p>Lo que nos permite distinguir una voz de otra o una guitarra de un piano.</p></div>
          <div><b>Duración</b><p>Largo o corto.</p></div>
        </div>
        <p>En un audiovisual hay tres tipos de sonido: la <b>voz</b> (diálogos y narración), la <b>música</b> y los <b>efectos</b> (pasos, puertas, lluvia). El conjunto de sonidos de un lugar es su <b>paisaje sonoro</b>.</p>
        <h3>Editar audio</h3>
        <p>Con un editor de audio (Audacity en el ordenador o GarageBand en el iPad) el sonido se ve como una <b>onda</b>: cuanto más alta, más fuerte suena. Podemos:</p>
        <ul>
          <li><b>Grabar</b> y <b>cortar</b> los trozos que sobran.</li>
          <li>Trabajar con varias <b>pistas</b> a la vez: voz en una, música en otra, efectos en otra.</li>
          <li>Ajustar el <b>volumen</b> de cada pista y hacer <b>fundidos</b> de entrada y salida.</li>
          <li><b>Exportar</b> el resultado en un archivo (MP3, WAV, M4A).</li>
        </ul>
        <h3>La imagen fija</h3>
        <ul>
          <li>La <b>fotografía</b> nació en el siglo XIX. Al principio era analógica (película y revelado); hoy es casi siempre digital.</li>
          <li>Una imagen digital está formada por <b>píxeles</b>: pequeños cuadrados de color.</li>
          <li>Hay <b>géneros fotográficos</b>: retrato, paisaje, bodegón, reportaje, deportiva, publicitaria…</li>
        </ul>
        <h3>Componer una imagen</h3>
        <div class="defs">
          <div><b>Encuadre</b><p>Lo que decides que entra en la imagen y lo que se queda fuera.</p></div>
          <div><b>Regla de los tercios</b><p>Divide la imagen en 3 × 3: los puntos de interés quedan mejor en las líneas o en sus cruces que en el centro.</p></div>
          <div><b>Luz</b><p>Natural o artificial, dura o suave. Cambia por completo cómo se siente una foto.</p></div>
          <div><b>Color</b><p>Los colores cálidos (rojos, naranjas) transmiten energía; los fríos (azules, verdes), calma.</p></div>
        </div>
        <h3>El fotomontaje</h3>
        <p>Es una imagen creada uniendo partes de varias fotografías. Con un editor (GIMP, Pixelmator, Canva o Keynote) se trabaja con <b>capas</b>, como hojas transparentes puestas una encima de otra: se recorta, se cambia el tamaño y se ajusta el color para que todo encaje.</p>
        <h3>Usar lo que no es tuyo</h3>
        <p>Las fotos, músicas y sonidos tienen autor. Usa los tuyos o recursos con <b>licencia libre</b> (por ejemplo, Creative Commons) de bancos como Freesound o Pixabay, y cita siempre de dónde salen.</p>`,
       tareas:[
        {n:1, t:"¿Qué ves y qué oyes?", html:"<p>Mira un anuncio breve primero sin sonido y después solo escuchándolo. Apunta qué información da la imagen, cuál da el sonido y qué cambia al unirlos.</p>", evalua:"labPR"},
        {n:2, t:"Mapa sonoro del colegio", html:"<p>Durante cinco minutos, en silencio, apunta todos los sonidos que oyes en un lugar del colegio. Clasifícalos en voces, música y efectos, y en graves o agudos, fuertes o suaves.</p>", evalua:"labPR"},
        {n:3, t:"Mi voz grabada", html:"<p>Graba un texto breve (una presentación o una noticia inventada) en Audacity o GarageBand. Corta los errores, quita los silencios largos y exporta el resultado.</p>", entrega:"Archivo de audio por Teams", evalua:"labPR"},
        {n:4, t:"Radio con efectos", html:"<p>Mezcla en varias pistas tu voz, una música de fondo y al menos dos efectos de sonido libres. Ajusta los volúmenes para que la voz se entienda y haz un fundido al principio y al final.</p>", entrega:"Archivo de audio y créditos por Teams", evalua:"labPR"},
        {n:5, t:"Fotografía con intención", html:"<p>Haz tres fotos de un mismo objeto o lugar cambiando el encuadre, la luz o el punto de vista, y aplica la regla de los tercios en al menos una. Explica qué transmite cada una. Fotografía lugares y objetos, no a compañeros.</p>", evalua:"labPR"},
        {n:6, t:"Fotomontaje", html:"<p>Crea un fotomontaje de un lugar real o imaginario de tu entorno uniendo al menos tres imágenes con capas. Cuida que las proporciones, la luz y el color encajen.</p>", entrega:"Imagen por Teams", evalua:"labPR"},
        {n:7, t:"Postal sonora", html:"<p>Une tu fotomontaje con su <b>paisaje sonoro</b> (sonidos del lugar, música y una breve narración con tu voz) en un vídeo de 30 a 60 segundos. Añade al final los créditos de los recursos que no son tuyos.</p>", entrega:"Vídeo por Teams", evalua:"labPV"}

      {id:"lab-stop", etiqueta:"Proyecto 2 · 2.º trimestre", titulo:"Dar vida a las cosas", subtitulo:"Animación en stop motion",
       cita:["La animación no es el arte de los dibujos que se mueven, sino de los movimientos que se dibujan.","Norman McLaren"],
       bloque:"Bloques: Fundamentos del lenguaje audiovisual · Producción audiovisual",
       desc:"¿Cómo puede moverse algo que está quieto? Descubrimos el truco que engaña a nuestro ojo, construimos juguetes ópticos y animamos objetos cotidianos foto a foto. El reto: contar una historia en stop motion en la que los personajes son monedas.",
       criterios:["1.2","2.1","2.2","2.3","2.4","3.1","3.2"],
       producto:"Cortometraje de animación en stop motion con monedas como personajes, con su banda sonora.",
       anexos:["labSV","labSR"],
       teoria:`
        <h3>¿Por qué vemos movimiento?</h3>
        <p>Cuando vemos muchas imágenes fijas muy seguidas, ligeramente distintas, nuestro cerebro las une y cree que hay movimiento. Es lo que se llama <b>persistencia de la visión</b> o efecto phi. Toda la animación y el cine se basan en este «engaño».</p>
        <h3>Fotogramas por segundo</h3>
        <p>Cada imagen es un <b>fotograma</b>. El cine proyecta 24 fotogramas por segundo (fps). En stop motion se suele trabajar a 12 fps: para un segundo de animación necesitas 12 fotos. Un corto de 30 segundos son… 360 fotos.</p>
        <h3>Juguetes ópticos</h3>
        <p>Antes del cine, en el siglo XIX, se inventaron juguetes que ya creaban movimiento: el <b>taumatropo</b> (un disco con un dibujo a cada lado que se superponen al girar), el <b>zoótropo</b> (un tambor con ranuras) y el <b>flipbook</b> (un librito que se pasa rápido con el dedo).</p>
        <h3>Técnicas de animación</h3>
        <div class="defs">
          <div><b>Dibujo animado</b><p>Cada fotograma se dibuja a mano o en el ordenador.</p></div>
          <div><b>Stop motion</b><p>Se fotografían objetos reales moviéndolos un poco entre foto y foto: plastilina, juguetes, recortes o… monedas.</p></div>
          <div><b>Animación 3D</b><p>Modelos creados y movidos por ordenador.</p></div>
        </div>
        <h3>Trucos del stop motion</h3>
        <ul>
          <li><b>Cámara fija:</b> el iPad o el móvil siempre en el mismo sitio, sujeto con un soporte.</li>
          <li><b>Luz constante:</b> mejor luz artificial; la del sol cambia y produce parpadeos.</li>
          <li><b>Movimientos pequeños:</b> cuanto más pequeño el cambio entre fotos, más suave la animación.</li>
          <li><b>Papel cebolla:</b> la app muestra la foto anterior transparente para calcular el siguiente movimiento.</li>
          <li><b>Ritmo:</b> para que algo vaya rápido, muévelo más entre foto y foto; para que vaya lento, menos.</li>
        </ul>
        <h3>El sonido de la animación</h3>
        <p>En animación todo el sonido se añade después. Los <b>efectos de sala</b> (en inglés, <i>foley</i>) se graban imitando los sonidos con objetos: una moneda que cae, pasos, un golpe. La música marca la emoción de cada escena.</p>
        <h3>Contar una historia</h3>
        <p>Toda historia, por corta que sea, tiene <b>planteamiento</b> (quién, dónde), <b>nudo</b> (un problema o conflicto) y <b>desenlace</b> (cómo se resuelve). Antes de animar, se dibuja un <b>storyboard</b>: viñetas con lo que pasa en cada momento.</p>`,
       tareas:[
        {n:1, t:"Taumatropo y flipbook", html:"<p>Construye un taumatropo (por ejemplo, un pájaro y una jaula) y un flipbook de al menos 20 páginas con un movimiento sencillo. Explica por qué parece que se mueve.</p>", evalua:"labSR"},
        {n:2, t:"Primeros fotogramas", html:"<p>Con la app de stop motion, anima un objeto que cruce la mesa en 3 segundos a 12 fps. ¿Cuántas fotos necesitas? Haz una versión rápida y otra lenta y compáralas.</p>", enlaces:[["Stop Motion Studio","https://www.cateater.com"]], evalua:"labSR"},
        {n:3, t:"Monedas con personalidad", html:"<p>Diseñad los personajes de vuestra historia: cada moneda tendrá un carácter (valiente, despistada, presumida…). Probad cómo se mueve cada una para mostrar ese carácter: rodar, saltar, girar, temblar.</p>", evalua:"labSR"},
        {n:4, t:"Guion y storyboard", html:"<p>Escribid la historia en cinco líneas (planteamiento, nudo y desenlace) y dibujad el storyboard con al menos 8 viñetas. Repartid los roles: animación, cámara y luz, decorado y sonido.</p>", entrega:"Storyboard por Teams", evalua:"labSR"},
        {n:5, t:"Decorado y rodaje", html:"<p>Construid el decorado y fijad la cámara y la luz. Rodad la animación siguiendo el storyboard. Revisad cada escena antes de pasar a la siguiente.</p>", evalua:"labSR"},
        {n:6, t:"Sonido y montaje", html:"<p>Grabad los efectos de sala con objetos reales, añadid música libre y unidlo todo en el editor de vídeo. Poned título y créditos.</p>", entrega:"Cortometraje por Teams", evalua:"labSV"},
        {n:7, t:"Pase y valoración", html:"<p>Vemos los cortos en clase. Cada equipo explica una dificultad y cómo la resolvió, y valora el trabajo de otro equipo: algo que funciona muy bien y una propuesta de mejora.</p>", evalua:"labSR"}
