      {id:"lab-corto", etiqueta:"Proyecto 3 · 3.er trimestre", titulo:"¡Rodamos!", subtitulo:"Nuestro cortometraje, de la idea al estreno",
       cita:["Una película es tres veces escrita: en el guion, en el rodaje y en el montaje.",""],
       bloque:"Bloque: Producción audiovisual",
       desc:"Nos convertimos en un equipo de cine. Pasamos por todas las fases de una producción real: de la idea al guion, del storyboard al rodaje, del montaje al estreno. Cada persona asume un rol, y al final estrenamos los cortos en un pequeño festival del colegio.",
       criterios:["1.4","2.4","3.1","3.2","3.3","4.1","4.2","4.3","4.4"],
       producto:"Cortometraje de ficción de 2 a 4 minutos, su cartel y su tráiler, estrenados en el festival de cortos del colegio.",
       anexos:["labCV","labCR"],
       teoria:`
        <h3>Las fases de una producción</h3>
        <ol class="steps4">
          <li><b>Preproducción:</b> todo lo que se prepara antes de grabar. Idea, guion, storyboard, reparto de roles, localizaciones, vestuario y plan de rodaje.</li>
          <li><b>Producción o rodaje:</b> grabar las imágenes y los sonidos.</li>
          <li><b>Postproducción:</b> montaje, sonido, música, títulos y créditos.</li>
          <li><b>Difusión:</b> cartel, tráiler y estreno.</li>
        </ol>
        <h3>Del guion literario al guion técnico</h3>
        <div class="defs">
          <div><b>Idea y sinopsis</b><p>La historia contada en una o dos frases.</p></div>
          <div><b>Escaleta</b><p>La lista ordenada de escenas, con lo que pasa en cada una.</p></div>
          <div><b>Guion literario</b><p>Escenas con el lugar, el momento, las acciones y los diálogos.</p></div>
          <div><b>Guion técnico</b><p>Añade cómo se graba: tipo de plano, movimiento de cámara y sonido.</p></div>
          <div><b>Storyboard</b><p>El guion técnico dibujado en viñetas.</p></div>
        </div>
        <p>Una historia necesita <b>personajes</b> con un deseo, un <b>conflicto</b> que se lo pone difícil y una resolución. Una <b>escena</b> ocurre en un mismo lugar y tiempo; una <b>secuencia</b> es un grupo de escenas con unidad; un <b>plano</b> es lo que se graba sin cortar.</p>
        <h3>Los planos</h3>
        <div class="defs">
          <div><b>Plano general</b><p>Muestra el lugar y a los personajes enteros: sitúa.</p></div>
          <div><b>Plano medio</b><p>De la cintura hacia arriba: conversaciones.</p></div>
          <div><b>Primer plano</b><p>La cara: emociones.</p></div>
          <div><b>Plano detalle</b><p>Un objeto o una parte: llama la atención.</p></div>
        </div>
        <p>El <b>ángulo</b> también cuenta: en <b>picado</b> (desde arriba) el personaje parece pequeño o débil; en <b>contrapicado</b> (desde abajo), grande o poderoso.</p>
        <h3>Los roles del equipo</h3>
        <ul>
          <li><b>Dirección:</b> decide cómo se cuenta la historia y coordina.</li>
          <li><b>Guion:</b> escribe y revisa la historia.</li>
          <li><b>Cámara y fotografía:</b> encuadres, movimientos y luz.</li>
          <li><b>Sonido:</b> que se entienda todo y sin ruidos.</li>
          <li><b>Producción y arte:</b> localizaciones, vestuario, objetos y plan de rodaje.</li>
          <li><b>Montaje:</b> une los planos y da ritmo.</li>
          <li><b>Interpretación:</b> los actores y actrices.</li>
        </ul>
        <h3>El montaje</h3>
        <p>Montar es elegir qué tomas valen, ordenarlas y decidir cuánto dura cada plano. El ritmo cambia la emoción: planos cortos dan tensión; planos largos, calma. En el editor de vídeo (iMovie, CapCut u OpenShot) se trabaja en una <b>línea de tiempo</b> con pistas de vídeo, voz, música y texto.</p>
        <h3>Difundir con responsabilidad</h3>
        <ul>
          <li><b>Cartel y tráiler:</b> despiertan las ganas de ver la película sin contar el final.</li>
          <li><b>Derechos de imagen:</b> solo aparece en cámara quien tiene autorización, y los cortos se comparten solo en los canales que el colegio permita.</li>
          <li><b>Licencias:</b> música y recursos libres, citados en los créditos. Tu corto también puede llevar una licencia Creative Commons.</li>
        </ul>
        <h3>Nuestro patrimonio audiovisual</h3>
        <p>La Comunitat Valenciana tiene una gran tradición: el director valenciano <b>Luis García Berlanga</b> es uno de los grandes del cine español, y en Valencia se celebran festivales de cine joven en los que participan centros educativos.</p>`,
       tareas:[
        {n:1, t:"Analizamos un corto", html:"<p>Vemos en clase un cortometraje. Analízalo: género, personajes, conflicto, tipos de plano que reconoces, papel de la música y qué emoción quiere transmitir.</p>", evalua:"labCR"},
        {n:2, t:"La idea", html:"<p>Cada persona propone una idea en una frase. En equipo, elegid una con una técnica creativa (por ejemplo, votar y mezclar las dos favoritas). Escribid la sinopsis y la escaleta.</p>", evalua:"labCR"},
        {n:3, t:"Guion y storyboard", html:"<p>Escribid el guion literario y, a partir de él, el guion técnico y el storyboard con el tipo de plano de cada toma.</p>", entrega:"Guion y storyboard por Teams", evalua:"labCR"},
        {n:4, t:"Preproducción", html:"<p>Repartid los roles de forma que todos tengan responsabilidades. Preparad localizaciones dentro del colegio, vestuario, objetos y un plan de rodaje: qué se graba cada día y qué hace falta.</p>", entrega:"Plan de rodaje", evalua:"labCR"},
        {n:5, t:"Rodaje", html:"<p>Grabad siguiendo el plan. Antes de cada toma: silencio, cámara estable y sonido comprobado. Grabad cada plano al menos dos veces. Solo actúan quienes tienen autorización de imagen; quien no la tenga asume otro rol.</p>", evalua:"labCR"},
        {n:6, t:"Montaje", html:"<p>Montad el corto en el editor de vídeo: seleccionad las mejores tomas, ajustad el ritmo, mezclad voces, música y efectos y añadid títulos y créditos con las licencias.</p>", entrega:"Cortometraje por Teams", evalua:"labCV"},
        {n:7, t:"Cartel y tráiler", html:"<p>Diseñad el cartel del corto (título, imagen, créditos principales y una frase gancho) y un tráiler de 20 a 30 segundos que no cuente el final.</p>", evalua:"labCR"},
        {n:8, t:"Festival y valoración", html:"<p>Estreno en el festival de cortos del colegio. Después, cada persona rellena su valoración: qué ha aportado en su rol, qué aprendió, qué mejoraría y una opinión constructiva sobre otro corto.</p>", entrega:"Valoración individual por Teams", evalua:"labCR"}

  {
    id:"tecnologia-3", nombre:"Tecnología y Digitalización", corto:"Tecnología y Dig.", nivel:"3.º ESO", color:"#1f5fd6",
    intro:"Un proyecto por trimestre: creamos una empresa, construimos y ponemos a prueba estructuras, y aprendemos a resolver problemas tecnológicos con el método de proyectos.",
    presentacion:{
      cita:"La tecnología, como el arte, es un ejercicio altísimo de la imaginación humana.",
      texto:"La tecnología es el conjunto de conocimientos y técnicas que nos permiten resolver problemas y aprovechar en la práctica lo que sabemos de ciencia. En esta materia aprendemos haciendo: cada trimestre afrontamos un reto real y lo resolvemos con el proceso tecnológico, trabajando en equipo, con creatividad y pensando en la sostenibilidad.",
      bloques:["Proceso de resolución de problemas","Comunicación y difusión de ideas","Pensamiento computacional, programación y robótica","Digitalización del entorno personal de aprendizaje","Tecnología sostenible"]
    },
    unidades:[
      {id:"tec3-empresa", etiqueta:"Situación de aprendizaje 1 · 1.er trimestre", titulo:"Crea tu propia empresa", subtitulo:"De la idea al prototipo",
       cita:["Si tú no trabajas por tus sueños, alguien te contratará para que trabajes por los suyos","Steve Jobs"],
       bloque:"Bloques: Proceso de resolución de problemas · Comunicación y difusión de ideas · Tecnología sostenible",
       desc:"Detectamos un problema real de nuestro entorno, lo convertimos en una oportunidad y creamos una empresa que lo resuelva: investigamos, diseñamos un prototipo, lo probamos con usuarios, creamos la marca y lo presentamos ante un jurado.",
       criterios:["1.1","1.2","2.1","2.2","3.1","4.1"],
       producto:"Prototipo probado con usuarios, memoria técnica, identidad de marca y pitch final ante un jurado.",
       anexos:["t3m1","t3inf","t3m2"],
       teoria:`
        <h3>El proceso tecnológico</h3>
        <p>Es el método que siguen ingenieros y diseñadores para pasar de un problema a una solución que funciona. Lo usaremos en todos los proyectos del curso:</p>
        <ol class="steps4">
          <li><b>Identificar el problema</b> o la necesidad: ¿qué falla?, ¿a quién afecta?</li>
          <li><b>Buscar información:</b> qué existe ya, qué opinan los usuarios, qué se puede mejorar.</li>
          <li><b>Diseñar:</b> generar ideas, elegir la mejor y dibujarla con bocetos y croquis.</li>
          <li><b>Planificar:</b> materiales, herramientas, tareas, responsables y plazos.</li>
          <li><b>Construir</b> el prototipo con seguridad.</li>
          <li><b>Evaluar:</b> probarlo, detectar fallos y mejorarlo. Muchas veces hay que volver a pasos anteriores.</li>
          <li><b>Comunicar:</b> presentar la solución y documentarla en una memoria técnica.</li>
        </ol>
        <h3>Analizar un objeto técnico</h3>
        <p>Antes de inventar, conviene estudiar lo que ya existe. Un objeto se analiza desde varios puntos de vista:</p>
        <div class="defs">
          <div><b>Formal</b><p>Forma, tamaño, color y materiales. Se acompaña de un boceto.</p></div>
          <div><b>Técnico</b><p>Qué piezas tiene, cómo se unen y cómo funciona.</p></div>
          <div><b>Funcional</b><p>Qué necesidad cubre y si lo hace bien.</p></div>
          <div><b>Económico</b><p>Cuánto cuesta y por qué.</p></div>
          <div><b>Social y ambiental</b><p>Cómo ha cambiado nuestra vida y qué impacto tiene: recursos, residuos, reciclaje.</p></div>
        </div>
        <h3>Seguridad y salud en el taller</h3>
        <ul>
          <li><b>Riesgos habituales:</b> cortes con cúteres y sierras, quemaduras con la silicona caliente, golpes, proyección de partículas, descargas eléctricas y vapores de pegamentos o pinturas.</li>
          <li><b>Normas básicas:</b> usar cada herramienta solo para lo que sirve, sujetar bien la pieza, cortar siempre hacia fuera del cuerpo, usar gafas o guantes cuando se indique, mantener el puesto ordenado, no correr y avisar enseguida de cualquier accidente.</li>
          <li><b>Señalización:</b> la forma y el color indican el tipo de señal.</li>
        </ul>
        <div class="defs">
          <div><b>Prohibición</b><p>Círculo rojo con una barra: «prohibido fumar».</p></div>
          <div><b>Obligación</b><p>Círculo azul: «uso obligatorio de gafas».</p></div>
          <div><b>Advertencia</b><p>Triángulo amarillo: «riesgo eléctrico».</p></div>
          <div><b>Salvamento</b><p>Rectángulo o cuadrado verde: «salida de emergencia», «botiquín».</p></div>
          <div><b>Contra incendios</b><p>Rectángulo o cuadrado rojo: «extintor».</p></div>
        </div>
        <h3>Expresión gráfica: del boceto al plano</h3>
        <ul>
          <li><b>Boceto:</b> dibujo rápido a mano alzada para plasmar una idea.</li>
          <li><b>Croquis:</b> dibujo a mano alzada más cuidado, con las medidas (cotas) para poder fabricar.</li>
          <li><b>Plano:</b> dibujo exacto con instrumentos o con un programa de diseño (CAD), a escala y acotado.</li>
          <li><b>Vistas:</b> un objeto se representa con tres vistas principales: <b>alzado</b> (de frente), <b>planta</b> (desde arriba) y <b>perfil</b> (de lado).</li>
          <li><b>Escala:</b> relación entre el tamaño del dibujo y el real. 1:1 es tamaño natural; 1:2 reduce a la mitad; 2:1 amplía al doble.</li>
          <li><b>Perspectiva:</b> la isométrica y la caballera muestran el objeto en tres dimensiones en un solo dibujo.</li>
        </ul>
        <h3>Los plásticos</h3>
        <p>Son materiales ligeros, baratos, aislantes y fáciles de moldear, por eso están en casi todos los productos. Hay tres grupos:</p>
        <div class="defs">
          <div><b>Termoplásticos</b><p>Se ablandan con el calor y se pueden remoldear y reciclar: PET (botellas), PVC (tuberías), polietileno (bolsas), polipropileno (táperes), poliestireno (envases).</p></div>
          <div><b>Termoestables</b><p>Una vez moldeados no se ablandan con el calor: más duros, pero no se pueden refundir. Ej.: baquelita de enchufes, resinas.</p></div>
          <div><b>Elastómeros</b><p>Muy elásticos: caucho (neumáticos), neopreno (trajes de buceo), silicona.</p></div>
        </div>
        <p>Su gran problema es que tardan cientos de años en degradarse. Al diseñar, pensad en usar menos plástico, reutilizar y elegir plásticos reciclables: el número del triángulo de reciclaje (del 1 al 7) indica de qué plástico se trata.</p>
        <h3>Emprender: convertir problemas en oportunidades</h3>
        <p>Detrás de cada empresa hay una necesidad que no estaba bien resuelta. Emprender no siempre significa ganar dinero: una empresa puede ser <b>con ánimo de lucro</b> o <b>social</b>, si su objetivo principal es mejorar la vida de las personas o el medio ambiente.</p>
        <p>Una idea es <b>viable</b> cuando se sostiene desde tres puntos de vista:</p>
        <div class="defs">
          <div><b>Económico</b><p>Los ingresos cubren los costes. ¿Cuánto cuesta hacerlo? ¿A qué precio se vendería?</p></div>
          <div><b>Social</b><p>Resuelve un problema real a personas reales y no perjudica a nadie.</p></div>
          <div><b>Medioambiental</b><p>Usa los recursos con responsabilidad y contribuye a algún Objetivo de Desarrollo Sostenible (ODS).</p></div>
        </div>
        <h3>Herramientas del emprendedor</h3>
        <div class="defs">
          <div><b>Entrevista a usuarios</b><p>Preguntar a quienes tienen el problema antes de inventar la solución. Escuchar más que hablar.</p></div>
          <div><b>Mapa de empatía</b><p>Qué piensa, siente, ve, oye, dice y hace el usuario; qué le frustra y qué desea.</p></div>
          <div><b>¿Cómo podríamos…?</b><p>Convertir el problema en un reto: «¿Cómo podríamos ayudar a… a…?».</p></div>
          <div><b>Lean Canvas</b><p>El modelo de negocio en una página: problema, clientes, propuesta de valor, solución, canales, ingresos, costes, métricas y ventaja.</p></div>
        </div>
        <h3>El prototipo</h3>
        <p>Un <b>prototipo</b> es una versión de prueba de la solución. Sirve para aprender rápido y barato antes de invertir en el producto final.</p>
        <ul>
          <li><b>Baja fidelidad:</b> papel, cartón, plastilina o bocetos. Se hace en minutos y se puede tirar sin pena.</li>
          <li><b>Alta fidelidad:</b> una maqueta cuidada o una versión digital (pantallas en Keynote o Canva) que se parece mucho al producto real.</li>
          <li><b>Probar con usuarios:</b> lo importante no es que guste a tu equipo, sino que funcione para quien lo va a usar.</li>
        </ul>
        <h3>La marca</h3>
        <p>La marca no es solo un logotipo: es la imagen y la confianza que tu empresa genera. Se construye con:</p>
        <ul>
          <li><b>Misión</b> (qué hacemos y para quién), <b>visión</b> (en qué queremos convertirnos) y <b>valores</b> (cómo trabajamos).</li>
          <li><b>Nombre y eslogan:</b> breves, fáciles de recordar y que transmitan lo que os diferencia.</li>
          <li><b>Identidad visual:</b> logotipo, colores (cada color transmite sensaciones), tipografía e icono, siempre coherentes entre sí.</li>
        </ul>
        <h3>El marketing</h3>
        <p>El marketing estudia qué necesitan las personas para ofrecérselo de la mejor manera. Puede ser <b>tradicional</b> (carteles, folletos, degustaciones) o <b>digital</b> (redes sociales, web, correo, buscadores). Un plan de marketing responde a cuatro preguntas:</p>
        <ol class="steps4">
          <li><b>¿A quién?</b> El público objetivo: edad, intereses, dónde está y qué redes usa.</li>
          <li><b>¿Contra quién?</b> La competencia: qué hacen bien, qué hacen mal y en qué podéis ser mejores.</li>
          <li><b>¿Con qué?</b> Vuestros recursos: tiempo, responsables, frecuencia de publicación.</li>
          <li><b>¿Cómo y dónde?</b> Los canales y el tipo de contenido. En redes, la gente busca cercanía, respuestas, contenido útil o divertido y beneficios; nadie sigue a una marca que solo anuncia.</li>
        </ol>`,
       tareas:[
        {n:1, t:"El proceso tecnológico", html:"<p>Trabajamos en clase las fases del proceso tecnológico y haz una <b>infografía</b> que lo resuma, con un ejemplo de un objeto cotidiano.</p>", entrega:"Infografía en PDF por Teams", evalua:"t3inf"},
        {n:2, t:"Seguridad en el taller", html:"<p>Antes de usar herramientas, elabora un <b>decálogo de seguridad</b> del taller: las situaciones de riesgo más habituales y cómo evitarlas. Después, dibuja en un DIN A4 dos señales necesarias en el taller con las formas y colores normalizados, e inventa una señal nueva.</p>", entrega:"Decálogo y señales por Teams", evalua:"t3m2"},
        {n:3, t:"Lluvia de ideas: ¿qué problemas vemos?", html:"<p>Entre toda la clase, recogemos en Mentimeter problemas o necesidades de nuestro entorno: el colegio, el barrio, Paiporta, la gente joven, las personas mayores, el medio ambiente… Después se forman los equipos de trabajo.</p>", enlaces:[["Mentimeter","https://www.mentimeter.com"]]},
        {n:4, t:"Empatizar: escuchamos a los usuarios", html:"<p>Cada equipo elige tres problemas de la lluvia de ideas. Para cada uno, entrevistad al menos a cinco personas que lo sufran. Preguntad por su experiencia, no por vuestra solución: «¿Cuándo te pasa?», «¿Qué haces ahora?», «¿Qué es lo que más te molesta?».</p><p>Con las respuestas, completad un <b>mapa de empatía</b> de vuestro usuario.</p>", entrega:"Entrevistas y mapa de empatía en la memoria", evalua:"t3m2"},
        {n:5, t:"Analizamos lo que ya existe", html:"<p>Elegid un producto que ya resuelva (aunque sea mal) el problema de vuestros usuarios y analizadlo: formal (boceto, medidas, materiales), técnico (piezas y funcionamiento), funcional, económico y social y ambiental. ¿Qué haríais mejor?</p>", evalua:"t3m2"},
        {n:6, t:"Definir e idear", html:"<ol><li>Escribid el reto como pregunta: «¿Cómo podríamos…?».</li><li>Cada miembro aporta ideas en silencio durante cinco minutos; después las compartís sin criticarlas.</li><li>Investigad qué soluciones existen ya y qué podéis mejorar.</li><li>Elegid la idea final con una <b>matriz de decisión</b>: puntuad de 1 a 5 cada idea según su impacto, viabilidad, originalidad y coste.</li></ol>", evalua:"t3m2"},
        {n:7, t:"Modelo de negocio y viabilidad", html:"<p>Completad el <b>Lean Canvas</b> de vuestra empresa y estudiad su viabilidad:</p><ul><li><b>Económica:</b> calculad cuánto cuesta producir una unidad, a qué precio la venderíais y cuántas tendríais que vender para cubrir los gastos.</li><li><b>Social:</b> a quién ayuda y cómo.</li><li><b>Medioambiental:</b> materiales, residuos, consumo de energía y con qué ODS se relaciona.</li></ul>", evalua:"t3m2"},
        {n:8, t:"Prototipo de baja fidelidad", html:"<p>Construid una primera versión rápida con materiales sencillos (papel, cartón, plastilina) o con bocetos de las pantallas si es una app o un servicio. Fotografiadlo: irá a la memoria.</p>", evalua:"t3m2"},
        {n:9, t:"Probamos con usuarios", html:"<p>Enseñad el prototipo a usuarios reales y dejad que lo usen sin explicar demasiado. Recoged su opinión con la <b>malla de feedback</b>: qué les gusta, qué cambiarían, qué preguntas les surgen y qué ideas nuevas aportan. Con eso, decidid qué mejorar.</p>", evalua:"t3m2"},
        {n:10, t:"Planos del prototipo", html:"<p>Antes de construir el prototipo final, dibujad su <b>croquis acotado</b> y las <b>tres vistas</b> (alzado, planta y perfil) a escala. Elegid los materiales justificando por qué; si usáis plásticos, indicad cuáles y si se pueden reciclar. Podéis hacer los planos en Tinkercad.</p>", enlaces:[["Tinkercad","https://www.tinkercad.com"]], entrega:"Planos en la memoria", evalua:"t3m2"},
        {n:11, t:"Prototipo final", html:"<p>Construid el prototipo de alta fidelidad aplicando las mejoras: una maqueta cuidada o una versión digital en Keynote o Canva que se parezca al producto real. Respetad las normas de seguridad del taller.</p>", entrega:"Fotos o vídeo del prototipo en la memoria", evalua:"t3m2"},
        {n:12, t:"Memoria técnica", html:"<p>Documentad todo el proyecto en la memoria técnica: el problema, la investigación, las ideas, el diseño con bocetos y medidas, la planificación (materiales, tareas, responsables y plazos), el prototipo, las pruebas y las mejoras.</p>", enlaces:[["Plantilla de la memoria técnica (OneDrive del colegio)","https://lainmaculada-my.sharepoint.com/:w:/g/personal/ruben_lainmaculada_es/ETbTvmkVJ6hMvpquomQdUQcB--84eA0lF5zzvKFRYyvqEQ?e=3ngL7g"]], entrega:"Memoria técnica por Teams", evalua:"t3m2"},
        {n:13, t:"Identidad de marca", html:"<ol><li>Escribid la misión, la visión y los valores de la empresa.</li><li>Elegid el nombre (podéis inspiraros con un generador de nombres, filtrando los resultados) y un eslogan.</li><li>Escoged los colores explicando por qué, la tipografía y un icono.</li><li>Diseñad el logotipo en Canva y comprobad que es coherente con todo lo anterior.</li></ol>", enlaces:[["Generador de nombres","https://businessnamegenerator.com"],["Psicología del color (Canva)","https://www.canva.com/es_mx/aprende/psicologia-del-color/"],["Combinar tipografías (Fontjoy)","https://fontjoy.com"],["Iconos (Flaticon)","https://www.flaticon.es"]], evalua:"t3m2"},
        {n:14, t:"Plan de marketing y campaña", html:"<p>Elaborad el plan de marketing en cuatro pasos: público objetivo, competencia (los tres competidores principales), recursos y estrategia de canales.</p><p>Después, diseñad en Canva el <b>perfil de la empresa</b> en la red social elegida y un calendario con seis publicaciones coherentes con el plan. Es una maqueta: no se publica en redes reales. Si el profesor lo autoriza, las mejores se podrán difundir desde los canales oficiales del colegio.</p>", entrega:"Plan de marketing y maqueta del perfil por Teams", evalua:"t3m2"},
        {n:15, t:"Pitch final", html:"<p>Presentad vuestra empresa ante un jurado en un máximo de tres minutos, como en un concurso de emprendimiento:</p><ol><li><b>Gancho:</b> una pregunta, un dato o una historia.</li><li><b>Problema</b> y a quién afecta.</li><li><b>Solución</b> y demostración del prototipo.</li><li><b>Qué os diferencia</b> de la competencia.</li><li><b>Viabilidad:</b> costes, precio e impacto.</li><li><b>Equipo y cierre.</b></li></ol>", entrega:"Presentación en Keynote o Canva por Teams", evalua:"t3m2"}
       ],

      {id:"tec3-movilidad", etiqueta:"Situación de aprendizaje 2 · 2.º trimestre", titulo:"Energía en movimiento", subtitulo:"Proyecto Zinkers: movilidad sostenible",
       cita:["La energía más limpia es la que no se consume",""],
       bloque:"Bloques: Proceso de resolución de problemas · Tecnología sostenible · Pensamiento computacional",
       desc:"¿Cómo nos movemos y cuánto contamina? Estudiamos la movilidad de nuestro colegio, aprendemos cómo los mecanismos transforman la fuerza y la velocidad, y diseñamos con LEGO SPIKE un vehículo de reparto que gaste la menor energía posible. Con todo ello escribimos el manifiesto de sostenibilidad de la clase para los Premios Zinkers.",
       criterios:["1.1","1.2","2.1","2.2","3.1","3.2","4.1"],
       producto:"Vehículo de reparto sostenible con LEGO SPIKE y manifiesto de sostenibilidad de la clase para los Premios Zinkers.",
       anexos:["t3zV","t3zR"],
       teoria:`
        <h3>Energía y movilidad</h3>
        <p>El transporte es uno de los sectores que más energía consume y más gases de efecto invernadero emite. Cada vez que elegimos cómo movernos, también elegimos cuánta energía gastamos y cuánto contaminamos.</p>
        <div class="defs">
          <div><b>Energía</b><p>La capacidad de un sistema para producir trabajo: mover, calentar, iluminar… No se crea ni se destruye: se transforma.</p></div>
          <div><b>Renovable / no renovable</b><p>Las renovables (sol, viento, agua) no se agotan; las no renovables (petróleo, gas, carbón) sí, y al quemarse emiten CO₂.</p></div>
          <div><b>Eficiencia energética</b><p>Hacer lo mismo gastando menos energía. Un motor eficiente convierte más energía en movimiento y desperdicia menos en calor.</p></div>
          <div><b>Movilidad sostenible</b><p>Moverse contaminando lo mínimo: a pie, en bici, en transporte público, compartiendo coche o con vehículos eléctricos.</p></div>
        </div>
        <h3>¿Qué es un mecanismo?</h3>
        <p>Un <b>mecanismo</b> es un conjunto de piezas que transmite o transforma una fuerza o un movimiento desde un <b>elemento motriz</b> (el que provoca el movimiento, como un motor) hasta un <b>elemento conducido</b> (el que lo recibe, como una rueda).</p>
        <h3>La palanca</h3>
        <p>Una barra rígida que gira sobre un punto de apoyo. Permite mover una carga (resistencia, R) haciendo una fuerza (F) menor si la colocamos lejos del apoyo:</p>
        <p class="formula">F · d = R · r</p>
        <p>donde <i>d</i> es la distancia de la fuerza al apoyo y <i>r</i> la de la resistencia al apoyo. Según dónde esté el apoyo hay palancas de primer grado (balancín, tijeras), de segundo (carretilla, cascanueces) y de tercer grado (pinzas, caña de pescar).</p>
        <h3>Transmitir el giro: poleas y engranajes</h3>
        <ul>
          <li><b>Poleas con correa:</b> dos ruedas unidas por una correa giran en el mismo sentido.</li>
          <li><b>Engranajes:</b> ruedas dentadas que encajan entre sí. No patinan y giran en sentidos contrarios.</li>
        </ul>
        <p>La <b>relación de transmisión</b> (i) indica cuántas veces más rápido o más lento gira el eje conducido:</p>
        <p class="formula">i = Z<sub>motriz</sub> / Z<sub>conducido</sub> = n<sub>conducido</sub> / n<sub>motriz</sub></p>
        <p>donde Z es el número de dientes y n la velocidad de giro (vueltas por minuto, rpm). Con poleas se usan los diámetros en lugar de los dientes.</p>
        <div class="defs">
          <div><b>Reductor (i &lt; 1)</b><p>Engranaje pequeño mueve a uno grande: el eje conducido gira más despacio pero con <b>más fuerza</b>. Ideal para subir cuestas o cargar peso.</p></div>
          <div><b>Multiplicador (i &gt; 1)</b><p>Engranaje grande mueve a uno pequeño: gira más rápido pero con <b>menos fuerza</b>. Ideal en llano y sin carga.</p></div>
          <div><b>Tren de engranajes</b><p>Varios pares encadenados. La relación total es el producto de las relaciones de cada par.</p></div>
        </div>
        <p class="ask">La regla de oro de los mecanismos: <b>lo que ganas en fuerza lo pierdes en velocidad</b>, y al revés. Elegir bien la transmisión es elegir la más eficiente para cada tarea.</p>
        <h3>Más formas de transmitir el movimiento</h3>
        <ul>
          <li><b>Polea fija:</b> cambia la dirección de la fuerza (subir un cubo con una cuerda). <b>Polipasto:</b> combinando poleas fijas y móviles se reduce la fuerza necesaria; con una polea móvil, a la mitad.</li>
          <li><b>Ruedas de fricción:</b> dos ruedas que se tocan y se arrastran por rozamiento. Sencillas, pero pueden patinar.</li>
          <li><b>Ruedas dentadas y cadena:</b> como en la bicicleta. No patinan y giran en el mismo sentido. Los cambios de marcha de la bici son un ejemplo perfecto de reductor y multiplicador.</li>
        </ul>
        <h3>Transformar el movimiento</h3>
        <ul>
          <li><b>Piñón y cremallera:</b> giro en movimiento recto (dirección de un coche).</li>
          <li><b>Biela-manivela:</b> giro en vaivén, y al revés (motor de un coche, máquina de coser).</li>
          <li><b>Leva:</b> giro en subida y bajada (juguetes, motores).</li>
          <li><b>Tornillo sin fin:</b> gran reducción de velocidad en poco espacio (clavijas de una guitarra).</li>
        </ul>
        <h3>La electricidad que mueve el vehículo</h3>
        <p>La <b>corriente eléctrica</b> es el movimiento de electrones por un conductor. Un <b>circuito eléctrico</b> es el camino cerrado por el que circulan, y tiene:</p>
        <div class="defs">
          <div><b>Generador</b><p>Aporta la energía: pilas, baterías (como la del hub de SPIKE), dinamos, placas solares.</p></div>
          <div><b>Conductores</b><p>Cables que unen los elementos.</p></div>
          <div><b>Receptores</b><p>Transforman la energía eléctrica: el motor en movimiento, la bombilla en luz, la resistencia en calor.</p></div>
          <div><b>Control y protección</b><p>Interruptores, pulsadores y conmutadores para abrir o cerrar el circuito; fusibles para protegerlo.</p></div>
        </div>
        <div class="table-wrap"><table class="tbl pts">
          <thead><tr><th>Magnitud</th><th>Qué es</th><th>Unidad</th><th>Se mide con</th></tr></thead>
          <tbody>
            <tr><td>Tensión o voltaje (V)</td><td>La energía que da el generador para mover los electrones</td><td>voltio (V)</td><td>voltímetro</td></tr>
            <tr><td>Intensidad (I)</td><td>Cantidad de carga que pasa por segundo</td><td>amperio (A)</td><td>amperímetro</td></tr>
            <tr><td>Resistencia (R)</td><td>Oposición al paso de la corriente</td><td>ohmio (Ω)</td><td>óhmetro</td></tr>
          </tbody></table></div>
        <p>Las tres se relacionan con la <b>ley de Ohm</b>:</p>
        <p class="formula">V = I · R</p>
        <ul>
          <li><b>En serie:</b> los receptores van uno detrás de otro; la corriente es la misma en todos y, si uno se funde, se apagan todos.</li>
          <li><b>En paralelo:</b> cada receptor tiene su propio camino; todos reciben la misma tensión y, si uno falla, los demás siguen funcionando. Así está la instalación de una casa.</li>
        </ul>`,
       tareas:[
        {n:1, t:"¿Cómo nos movemos? Encuesta de movilidad", html:"<p>Trabajamos los materiales de Zinkers sobre energía y movilidad sostenible que indique el profesor. Después, diseñad una encuesta sobre cómo viene al colegio el alumnado de vuestra clase o de vuestro curso: medio de transporte, distancia y tiempo.</p><p>Analizad los resultados con gráficos: ¿qué porcentaje viene a pie, en bici, en bus o en coche? ¿Qué cambios serían realistas para contaminar menos? Estos datos serán la base del manifiesto.</p>", enlaces:[["Programa Zinkers (Fundación Repsol)","https://zinkers.fundacionrepsol.com/"]], entrega:"Encuesta y análisis con gráficos por Teams", evalua:"t3zR"},
        {n:2, t:"Mecanismos: la teoría", html:"<p>Trabajamos en clase energía, palancas, poleas, engranajes, relación de transmisión y circuitos eléctricos. Comprueba lo que sabes con la ficha interactiva de mecanismos y practica con la calculadora de transmisión:</p>${calcTransmision()}", evalua:"t3zV"},
        {n:3, t:"Laboratorio de palancas", html:"<p>Con una regla como barra, un lápiz como apoyo y monedas como pesos, comprueba la ley de la palanca:</p><ol><li>Coloca 2 monedas a 5 cm del apoyo. ¿Cuántas necesitas a 10 cm para equilibrar? ¿Y a 2,5 cm?</li><li>Calcula antes con F · d = R · r y comprueba después.</li><li>Fotografía cada caso y anota si se cumple la ley y por qué puede haber pequeñas diferencias.</li></ol>", evalua:"t3zR"},
        {n:4, t:"Laboratorio de engranajes con SPIKE", html:"<p>Con vuestro kit de SPIKE, conectad un motor a un engranaje motriz y haced que mueva un engranaje conducido. Marcad el eje conducido con una pieza de color para poder contar sus vueltas.</p><ol><li>Contad los dientes de cada engranaje y calculad la relación de transmisión.</li><li>Programad el motor para que dé exactamente <b>3 vueltas</b> (1080°).</li><li>Contad las vueltas del eje conducido y comparad con lo calculado.</li><li>Repetid con un montaje <b>reductor</b>, uno <b>multiplicador</b> y un <b>tren de dos pares</b>.</li><li>Recoged los datos en una tabla: Z motriz, Z conducido, i calculada, vueltas esperadas, vueltas medidas y diferencia.</li></ol>", entrega:"Tabla de datos y fotos de los montajes en el diario", evalua:"t3zR"},
        {n:5, t:"Laboratorio de circuitos", html:`<p>Con el simulador de circuitos de PhET, construye y comprueba:</p><ol><li>Un circuito simple con una pila, un interruptor y una bombilla.</li><li>Dos bombillas en serie y dos en paralelo: ¿cuál brilla más? ¿Qué pasa si quitas una?</li><li>Mide con el voltímetro y el amperímetro virtuales y comprueba la ley de Ohm en tres casos.</li></ol><p>Practica también con la calculadora:</p>${calcOhm()}`, enlaces:[["Simulador de circuitos (PhET)","https://phet.colorado.edu/es/simulations/circuit-construction-kit-dc"]], entrega:"Capturas y tabla de medidas en el diario", evalua:"t3zR"},
        {n:6, t:"Reto: vehículo de reparto sostenible", html:"<p>Una empresa de reparto necesita un vehículo eléctrico que lleve paquetes por la ciudad gastando la menor energía posible. Con un kit de SPIKE por equipo:</p><ol><li><b>Diseñad</b> el vehículo con bocetos e indicad qué transmisión vais a usar y por qué.</li><li><b>Construid</b> el vehículo: debe llevar una carga (el paquete) y poder cambiar de transmisión.</li><li><b>Probad</b> en dos recorridos: un tramo llano de 2 m y una rampa. Medid el tiempo de cada uno con dos transmisiones distintas y siempre a la misma potencia del motor.</li><li><b>Elegid</b> la mejor transmisión para cada tramo y explicad por qué con la regla de oro: fuerza o velocidad.</li><li><b>Mejorad</b> el diseño: menos peso, menos rozamiento, mejor agarre.</li></ol>", entrega:"Vehículo, datos de las pruebas y vídeo de la prueba final", evalua:"t3zR"},
        {n:7, t:"Programación del vehículo", html:"<p>Programad el vehículo para que haga el recorrido de reparto solo:</p><ul><li><b>Nivel básico:</b> avanzar una distancia exacta (calculad los grados de motor a partir del diámetro de la rueda) y detenerse.</li><li><b>Nivel medio:</b> detenerse al detectar un obstáculo con el sensor de distancia.</li><li><b>Nivel avanzado:</b> detectar el punto de entrega con el sensor de color y volver a la base.</li></ul><p>Cuanto menos tiempo esté el motor encendido para hacer la entrega, más eficiente es vuestro vehículo.</p>", evalua:"t3zR"},
        {n:8, t:"Memoria del proyecto", html:"<p>Documentad el proyecto: el problema, los cálculos de transmisión, los bocetos, las pruebas con sus datos, las mejoras y las conclusiones. ¿Qué habéis aprendido sobre eficiencia que se pueda aplicar a la movilidad real?</p>", entrega:"Memoria en PDF por Teams", evalua:"t3zR"},
        {n:9, t:"Manifiesto de sostenibilidad", html:"<p>Entre toda la clase, escribimos y diseñamos el <b>manifiesto de sostenibilidad</b> que presentaremos a los Premios Zinkers. Debe recoger:</p><ul><li><b>Lo que hemos aprendido</b> sobre energía, movilidad y eficiencia.</li><li><b>Los datos</b> de nuestra encuesta de movilidad.</li><li><b>Nuestros compromisos</b> concretos y realistas como clase.</li><li><b>Las acciones</b> que proponemos al colegio y al barrio.</li></ul><p>Las fotos del vehículo y de las pruebas servirán como evidencias. Si se hace un vídeo, solo pueden salir compañeros con la autorización de su familia.</p>", entrega:"Manifiesto en PDF o imagen", evalua:"t3zR"}
       ],

      {id:"tec3-estructuras", etiqueta:"Situación de aprendizaje 3 · 3.er trimestre", titulo:"Estructuras 3E", subtitulo:"Estable, Eficiente y Elegante",
       bloque:"Bloques: Proceso de resolución de problemas · Comunicación y difusión de ideas · Tecnología sostenible",
       desc:"¿Puede una estructura ser estable, eficiente y elegante a la vez? Investigamos su evolución histórica, experimentamos con cargas y esfuerzos, diseñamos en 3D y construimos un puente de papel para el concurso de carga máxima del colegio.",
       criterios:["1.1","1.2","2.1","2.2","3.1","4.1"],
       producto:"Maqueta de un puente que cumpla las 3E, sobre un tablero de cartón de 50 × 15 cm, para el concurso de carga máxima del colegio.",
       anexos:["t3eV","t3e0","t3e1","t3e2","t3e3","t3e4"],
       teoria:`
        <p>En arquitectura e ingeniería hay tres palabras que guían cualquier diseño: <b>Estable</b> (cumple su función sin deformarse ni caerse), <b>Eficiente</b> (usa el material necesario y suficiente) y <b>Elegante</b> (además de funcionar, es bello). En este proyecto descubriremos si una estructura puede cumplir las tres a la vez.</p>
        <p class="ask">Durante todo el proyecto usarás <b>GoodNotes como diario de aprendizaje</b>: ahí irás guardando información, respuestas, fotos y vídeos de cada tarea. Al final se entrega al profesor.</p>
        <h3>¿Qué es una estructura?</h3>
        <p>Es el conjunto de elementos de un objeto o construcción que soporta las cargas y mantiene su forma. Para cumplir su función, una estructura debe ser:</p>
        <div class="defs">
          <div><b>Resistente</b><p>Soporta las cargas sin romperse.</p></div>
          <div><b>Rígida</b><p>No se deforma de manera apreciable al recibir las cargas.</p></div>
          <div><b>Estable</b><p>No vuelca ni se desplaza: se mantiene en equilibrio.</p></div>
        </div>
        <h3>Cargas</h3>
        <p>Las <b>cargas</b> son las fuerzas que actúan sobre una estructura. Pueden ser <b>fijas</b> (su propio peso) o <b>variables</b> (personas, vehículos, viento, nieve); <b>estáticas</b> (no se mueven, como un armario) o <b>dinámicas</b> (en movimiento, como un tren que cruza un puente); y <b>puntuales</b> (en un punto) o <b>repartidas</b> (a lo largo de una superficie, de forma uniforme o no).</p>
        <h3>Esfuerzos</h3>
        <p>Cuando las cargas actúan sobre un elemento, este sufre un <b>esfuerzo</b> y tiende a deformarse:</p>
        <div class="defs">
          <div><b>Tracción</b><p>Las cargas tiran del elemento en la misma dirección y sentidos contrarios: tiende a alargarse y adelgazar. Ej.: el cable de un ascensor.</p></div>
          <div><b>Compresión</b><p>Las cargas empujan en la misma dirección y sentidos opuestos: tiende a acortarse y ensancharse. Ej.: un pilar.</p></div>
          <div><b>Flexión</b><p>Las cargas tienden a doblarlo: una parte se comprime y la otra se estira. Ej.: una viga o una estantería.</p></div>
          <div><b>Torsión</b><p>Las cargas tienden a retorcerlo. Ej.: una llave al girar en la cerradura.</p></div>
          <div><b>Cortante o cizalladura</b><p>Dos cargas paralelas, muy próximas y en sentidos contrarios tienden a cortarlo. Ej.: unas tijeras sobre el papel.</p></div>
        </div>
        <h3>Elementos estructurales</h3>
        <div class="defs">
          <div><b>Cimentación</b><p>Reparte el peso de la estructura sobre el terreno.</p></div>
          <div><b>Pilar o columna</b><p>Elemento vertical que soporta las cargas a compresión.</p></div>
          <div><b>Viga</b><p>Elemento horizontal apoyado en pilares; trabaja a flexión.</p></div>
          <div><b>Forjado</b><p>Superficie horizontal (suelos y techos) que reparte las cargas a las vigas.</p></div>
          <div><b>Arco</b><p>Elemento curvo que convierte las cargas en compresión hacia los apoyos.</p></div>
          <div><b>Tirante o tensor</b><p>Cable o barra que trabaja a tracción, como en los puentes colgantes.</p></div>
        </div>
        <h3>Tipos de estructuras artificiales</h3>
        <ul>
          <li><b>Masivas:</b> mucho material y pocos huecos (pirámides, presas).</li>
          <li><b>Adinteladas:</b> pilares y vigas horizontales (templos griegos).</li>
          <li><b>Abovedadas:</b> arcos, bóvedas y cúpulas (acueductos, catedrales).</li>
          <li><b>Entramadas:</b> pilares, vigas y forjados unidos (edificios actuales).</li>
          <li><b>Trianguladas:</b> barras formando triángulos (torres eléctricas, grúas, muchos puentes).</li>
          <li><b>Colgadas:</b> el tablero cuelga de cables (puentes colgantes).</li>
          <li><b>Laminares, neumáticas y geodésicas:</b> láminas curvas, estructuras hinchables y cúpulas formadas por triángulos.</li>
        </ul>
        <h3>Construcciones sostenibles</h3>
        <ul>
          <li><b>Casas pasivas:</b> están tan bien aisladas y orientadas que casi no necesitan calefacción ni aire acondicionado.</li>
          <li><b>Arquitectura bioclimática:</b> aprovecha el clima del lugar (sol, sombra, ventilación cruzada, vegetación) para mantener el confort gastando poca energía, como hacían muchas casas tradicionales.</li>
          <li><b>Casas impresas en 3D:</b> una gran impresora deposita capas de hormigón o de tierra; se construye más rápido y con menos residuos.</li>
        </ul>
        <h3>El secreto del triángulo</h3>
        <p>Un cuadrado de barras unidas por las esquinas se deforma con facilidad; un triángulo, no: es la única figura indeformable. Por eso se <b>triangulan</b> las estructuras. Además, la <b>forma</b> del material importa tanto como el material: un folio plano se dobla enseguida, pero enrollado en tubo soporta mucho más. Eso es un <b>perfil</b>.</p>`,
       tareas:[
        {n:1, t:"Evolución histórica · Observamos", html:"<p>Mira el vídeo y responde en tu diario: ¿qué aspectos han provocado la evolución de las estructuras?</p>", enlaces:[["Vídeo: la evolución de las estructuras","https://www.youtube.com/watch?v=lmro2FvfZLQ"]], evalua:"t3e4"},
        {n:2, t:"Evolución histórica · Decidimos", html:"<p>A lo largo de la historia se han construido estructuras para cubrir necesidades: transporte (puentes, túneles), vivienda, protección frente a desastres (presas, diques), almacenamiento, salud, educación, ocio, trabajo o religión. Elige qué tipo de estructura vas a investigar.</p>"},
        {n:3, t:"Evolución histórica · Investigamos", html:"<p>Busca la historia y la importancia de la estructura elegida y al menos <b>cuatro ejemplos de épocas distintas</b>. De cada uno: ubicación, fecha, materiales, características del diseño y datos curiosos. Usa la ficha de recogida de datos, anota las fuentes y respeta los derechos de autor de las imágenes.</p>", enlaces:[["Ficha de recogida de datos (CEDEC)","https://cedec.intef.es/rubrica/ficha-de-recogida-de-datos/"],["Guía de licencias y derechos de autor","https://descargas.intef.es/cedec/proyectoedia/guias/contenidos/guiadelicencias/derechos_de_autor.html"]], evalua:"t3e4"},
        {n:4, t:"Evolución histórica · Creamos el póster", html:"<p>Crea un póster digital con: título («Evolución histórica de…»), importancia e historia resumida, imágenes de cada época con su ubicación y fecha, y una reflexión sobre qué ha provocado la evolución:</p><ul><li><b>Materiales:</b> cómo han cambiado y con qué ventajas e inconvenientes.</li><li><b>Técnicas constructivas:</b> qué avances técnicos y de ingeniería las han hecho posibles.</li><li><b>Estilos:</b> qué factores sociales, culturales y económicos han influido.</li><li><b>Medio ambiente:</b> qué impacto tienen y qué podemos aprender de la construcción tradicional.</li></ul>", entrega:"Póster en PDF por Teams", evalua:"t3e0"},
        {n:5, t:"Las 3E · Observamos", html:"<p>Observa estos casos en los que las estructuras dejaron de cumplir su función. ¿Qué crees que falló en cada uno?</p>", enlaces:[["Colapso del puente de Tacoma Narrows","https://www.youtube.com/watch?v=DNrg-lWvuhg"],["Demoliciones espectaculares","https://www.youtube.com/watch?v=j-zczJXSxnw"],["Colapso del puente de Baltimore","https://www.youtube.com/watch?v=5yqUMpLtAJM"],["Derrumbe del puente de Picanya","https://www.youtube.com/watch?v=ay2miI0W33E"]], evalua:"t3e4"},
        {n:6, t:"Las 3E · Investigamos", html:"<p>Responde en tu diario: ¿qué es una estructura? ¿Qué significa que sea estable? ¿Y eficiente? ¿Y estética? Apóyate en la teoría, el vídeo y los apuntes.</p>", enlaces:[["Vídeo: definición de estructura","https://www.youtube.com/watch?v=KYFLQj5nLjQ"],["Apuntes de estructuras (Pelandintecno)","https://www3.gobiernodecanarias.org/medusa/ecoblog/ilopmon/files/2017/10/pelandintecno-2eso-t3-estructuras.pdf"]], evalua:"t3e4"},
        {n:7, t:"Las 3E · Experimentamos con Build a Bridge", html:"<p>En la app <b>Build a Bridge</b> del iPad, refuerza estructuras que se desestabilizan al añadir cargas. Cada barra cuesta dinero, como en la vida real. Responde: ¿cuánto has tardado? ¿Qué forma geométrica se repite? ¿Cómo has hecho la estructura más resistente?</p>", evalua:"t3e4"},
        {n:8, t:"Reto: la torre de espaguetis", html:"<p>En equipo, construid con espaguetis, plastilina e hilo la torre más alta, estable, eficiente y elegante posible, y que soporte carga. Fotografiadla y subid la foto y la rúbrica a vuestro diario.</p>", evalua:"t3e1"},
        {n:9, t:"Esfuerzos · Identificamos", html:"<p>Copia en tu diario la imagen de los esfuerzos que muestra el profesor y escribe el nombre de cada uno. Después haz la ficha interactiva de esfuerzos.</p>", evalua:"t3e4"},
        {n:10, t:"Esfuerzos · Los aplicamos", html:"<p>Aplica uno a uno los cinco esfuerzos sobre una nube de golosina. Fotografía cada deformación y completa la ficha de análisis: ¿qué le pasa a su longitud y a su grosor?</p>", evalua:"t3e4"},
        {n:11, t:"Cargas · Practicamos con un folio", html:"<p>Dobla un folio con tres pliegues longitudinales y dobla 5 cm de cada extremo en ángulo recto para hacer una «mesa». Aplica las cargas de una en una, fotografía y anota la deformación:</p><ul><li>Una goma en el centro (carga puntual centrada).</li><li>La goma cerca de un lateral (carga puntual excéntrica).</li><li>Un lápiz a lo largo (carga repartida uniforme).</li><li>Plastilina con forma irregular (carga repartida no uniforme).</li></ul>", evalua:"t3e4"},
        {n:12, t:"Practicopedia de los esfuerzos", html:"<p>Cread un vídeo de entre 1 y 1,5 minutos que explique los cinco esfuerzos solo con <b>voz en off y dibujos</b>:</p><ol><li><b>Guion:</b> qué es un esfuerzo, los cinco tipos (cargas, deformación y un ejemplo real de cada uno) y una conclusión. Empezad con una pregunta que enganche.</li><li><b>Dibujos:</b> títulos con lettering, flechas y dibujos que se vean bien en cámara.</li><li><b>Ensayo:</b> sincronizad la voz con los dibujos.</li><li><b>Grabación:</b> una persona graba, otra lee y otra va mostrando los dibujos.</li><li><b>Edición:</b> con título y créditos.</li></ol><p class=\"ask\">La voz tiene que ser vuestra y el vídeo se graba en clase: no vale generar voz ni vídeo con IA.</p>", enlaces:[["Ejemplo de practicopedia","https://www.youtube.com/watch?v=6_iAsR-ZfGw"]], entrega:"Vídeo por Teams", evalua:"t3e2"},
        {n:13, t:"Diseñamos en 3D con Tinkercad", html:"<p>Diseña en Tinkercad una estructura que combine distintos elementos estructurales: pilares, vigas, arcos, tirantes, triangulaciones… Entra con tu cuenta del colegio o con el código de clase. Haz una captura y guárdala en tu diario. Añade las tres vistas de tu estructura (alzado, planta y perfil).</p>", enlaces:[["Tinkercad","https://www.tinkercad.com/login"],["Tutorial de Tinkercad","https://www.youtube.com/watch?v=tcvujxk1Iqg"],["Tipos de estructuras (Pelandintecno)","http://pelandintecno.blogspot.com/2018/01/clasificando-diferentes-tipos-de.html"]], entrega:"Captura en el diario", evalua:"t3e4"},
        {n:14, t:"Construcciones sostenibles cerca de casa", html:"<p>Investigad si en Paiporta, en Valencia o en vuestro entorno hay edificios sostenibles: casas pasivas, viviendas bioclimáticas, edificios con placas solares o cubiertas vegetales, construcción con materiales reciclados… Elegid uno y explicad en el diario qué lo hace sostenible.</p>", evalua:"t3e4"},
        {n:15, t:"Tarea final: el puente 3E", html:`<p>¡Es el momento de ser ingenieros! Diseñad y construid un puente que cumpla las 3E para el <b>concurso de carga máxima</b> del colegio.</p>
          <h4>Materiales (solo estos)</h4>
          <ul><li>Tablero de cartón de 50 × 15 cm.</li><li>Folios, preferiblemente usados (empezad a guardarlos ya).</li><li>Pegamento de barra y silicona caliente con su pistola.</li><li>Hilo de lana, solo para tensores.</li></ul>
          <h4>Pasos</h4>
          <ol><li><b>Diseño:</b> bocetos del puente con medidas y el tipo de estructura elegido. ¿Dónde habrá tracción y dónde compresión?</li><li><b>Planificación:</b> tareas, responsables y plazos.</li><li><b>Perfiles:</b> enrollad los folios en tubos finos y apretados, en diagonal sobre un lápiz o una varilla, y pegad el borde con barra.</li><li><b>Construcción:</b> montad las vigas laterales triangulando, unidlas con tubos transversales y pegad la estructura al tablero con silicona. Dejad secar.</li><li><b>Pesaje:</b> pesad el puente antes de la prueba.</li><li><b>Prueba de carga:</b> se añade peso poco a poco hasta que colapse. Documentad todo con fotos y vídeo para el diario.</li></ol>
          <h4>Calcula la eficiencia de tu puente</h4>
          <p>Eficiencia = peso del puente ÷ carga máxima soportada. Cuanto más pequeño el número, mejor: el puente soportó mucho en comparación con lo que pesa.</p>
          <div class="eff">
            <label for="eff-peso">Peso del puente (g)</label><input id="eff-peso" type="number" min="0" step="1" inputmode="decimal">
            <label for="eff-carga">Carga máxima soportada (g)</label><input id="eff-carga" type="number" min="0" step="1" inputmode="decimal">
            <output id="eff-out" for="eff-peso eff-carga">Introduce los dos datos.</output>
          </div>
          <p class="ask"><b>Seguridad:</b> cuidado con la silicona caliente; usad la pistola sobre su soporte. En la prueba de carga, solo sube peso quien indique el profesor. Las maquetas se expondrán en el centro y el concurso se grabará; solo se publicará en las redes del colegio con la autorización de las familias.</p>`, entrega:"Puente, fotos y vídeo en el diario", evalua:"t3e3"}
       ],
       items:[

      ,{id:"tec3-entorno", complementario:true, etiqueta:"Tema complementario", titulo:"Mi entorno digital", subtitulo:"Hardware, software, ofimática e Internet",
       bloque:"Bloque: Digitalización del entorno personal de aprendizaje",
       desc:"Los conocimientos digitales básicos que usamos en todos los proyectos: cómo es un ordenador por dentro y por fuera, qué hace el sistema operativo, cómo sacar partido a la ofimática, cómo funciona Internet y cómo organizar nuestro entorno de trabajo. Se trabaja cuando un proyecto lo necesita.",
       criterios:["1.1","4.1"],
       teoria:`
        <h3>¿Qué es la digitalización?</h3>
        <p>Digitalizar es convertir información (textos, imágenes, sonidos, trámites, procesos) en datos que un ordenador puede guardar, procesar y transmitir. Está en casa (domótica, televisión a la carta), en el colegio (iPads, Teams) y en la calle (pago con el móvil, semáforos inteligentes).</p>
        <h3>Hardware y software</h3>
        <div class="defs">
          <div><b>Hardware</b><p>La parte física del equipo: lo que se puede tocar.</p></div>
          <div><b>Software</b><p>Los programas e instrucciones que hacen funcionar el hardware.</p></div>
        </div>
        <h3>Periféricos</h3>
        <div class="defs">
          <div><b>Entrada</b><p>Introducen datos: teclado, ratón, micrófono, escáner, webcam.</p></div>
          <div><b>Salida</b><p>Muestran o sacan datos: monitor, impresora, altavoces, auriculares.</p></div>
          <div><b>Entrada y salida</b><p>Hacen las dos cosas: pantalla táctil, memoria USB, router.</p></div>
        </div>
        <h3>Puertos y almacenamiento</h3>
        <ul>
          <li><b>USB y USB-C:</b> el conector universal para datos y carga. <b>HDMI:</b> imagen y sonido digital hacia monitores y proyectores. <b>Ethernet (RJ45):</b> red por cable. <b>Jack de 3,5 mm:</b> audio.</li>
          <li><b>Almacenamiento:</b> interno (disco duro o SSD), externo (memorias USB, discos externos) y en la nube (OneDrive, iCloud). La información se mide en bits y bytes: 1 byte = 8 bits; después KB, MB, GB y TB.</li>
        </ul>
        <h3>El sistema operativo</h3>
        <p>Gestiona el hardware, los archivos y los programas, y es la interfaz con la que trabajamos. Los más usados son Windows, macOS y Linux en ordenadores, y Android e iOS / iPadOS en móviles y tabletas.</p>
        <h3>Ofimática</h3>
        <div class="defs">
          <div><b>Procesador de textos</b><p>Word, Pages: documentos, memorias técnicas, informes. Usa estilos de título, índice y numeración de páginas.</p></div>
          <div><b>Presentaciones</b><p>Keynote, PowerPoint, Canva: poco texto, imágenes grandes y una idea por diapositiva.</p></div>
          <div><b>Hojas de cálculo</b><p>Excel, Numbers: tablas, cálculos y gráficos. Las fórmulas empiezan por «=», como <i>=SUMA(B2:B10)</i> o <i>=B2*C2</i>.</p></div>
        </div>
        <h3>¿Cómo funciona Internet?</h3>
        <ul>
          <li><b>Internet</b> es la red de redes: millones de redes conectadas que se entienden gracias a unas normas comunes, los <b>protocolos</b>. Los principales son <b>TCP/IP</b>: IP pone la dirección a cada paquete de datos y TCP se asegura de que llegan todos y en orden.</li>
          <li>Cada equipo conectado tiene una <b>dirección IP</b>. Como las IP son difíciles de recordar, el <b>DNS</b> traduce nombres como <i>lainmaculada.es</i> a su dirección IP.</li>
          <li>Una <b>URL</b> es la dirección completa de una página. El <b>navegador</b> (Safari, Chrome, Edge) muestra las páginas; el <b>buscador</b> (Google, Bing) las encuentra.</li>
          <li>Cada vez más objetos están conectados: relojes, altavoces, coches, electrodomésticos. Es el <b>internet de las cosas</b>.</li>
        </ul>
        <h3>Uso responsable</h3>
        <ul>
          <li><b>Protege tu identidad y tu privacidad:</b> contraseñas fuertes y distintas, verificación en dos pasos, cuidado con lo que publicas.</li>
          <li><b>Protege tus dispositivos:</b> actualizaciones, apps de tiendas oficiales, bloqueo de pantalla y copias de seguridad.</li>
        </ul>
        <h3>Mi entorno personal de aprendizaje</h3>
        <p>Es el conjunto de herramientas, fuentes y personas con las que aprendes: Teams para comunicarte con la clase, OneDrive para guardar y compartir, el iPad con sus apps para crear, buscadores y webs fiables para informarte. Organizarlo bien ahorra tiempo y disgustos.</p>`,

  t3m2:{titulo:"Anexo 3. Rúbrica del proyecto", para:"tareas 2 a 15", html:`<div class="table-wrap"><table class="tbl rub"><thead><tr><th>Qué se valora</th><th>4 · Excelente</th><th>3 · Satisfactorio</th><th>2 · Mejorable</th><th>1 · Insuficiente</th></tr></thead><tbody><tr><th>A. Investigación del problema<span class="crit">1.1</span></th><td>Entrevistas a usuarios reales bien preparadas; mapa de empatía completo; el problema está muy bien definido.</td><td>Entrevistas y mapa de empatía completos, con algún punto superficial.</td><td>Pocas entrevistas o mapa incompleto.</td><td>Sin investigación con usuarios.</td></tr><tr><th>B. Análisis y elección de la idea<span class="crit">1.2 · 2.1</span></th><td>Analizáis a fondo un producto existente (formal, técnico, funcional, económico y ambiental) y elegís la idea con una matriz de decisión justificada; la idea es original.</td><td>Analizáis lo que existe y justificáis la elección.</td><td>Análisis o justificación muy pobres.</td><td>No hay análisis ni justificación.</td></tr><tr><th>C. Modelo de negocio<span class="crit">2.1 · 2.2</span></th><td>Lean Canvas completo y coherente; costes, precio e impacto social y ambiental bien calculados y razonados.</td><td>Lean Canvas completo y viabilidad estudiada con algún error.</td><td>Lean Canvas incompleto o viabilidad poco estudiada.</td><td>Sin modelo de negocio.</td></tr><tr><th>D. Prototipo y pruebas<span class="crit">2.1 · 3.1</span></th><td>Prototipos de baja y alta fidelidad bien construidos; planos con vistas, escala y cotas correctas; materiales justificados; probados con usuarios y mejorados.</td><td>Prototipos correctos y probados, con pocas mejoras.</td><td>Prototipo poco cuidado o sin pruebas con usuarios.</td><td>No hay prototipo.</td></tr><tr><th>E. Memoria técnica<span class="crit">2.2 · 4.1</span></th><td>Completa, ordenada y con vocabulario técnico; bocetos con medidas, planificación clara y fuentes citadas.</td><td>Completa con algún apartado poco desarrollado.</td><td>Incompleta o desordenada.</td><td>No se entrega o no sirve como documentación.</td></tr><tr><th>F. Marca y marketing<span class="crit">1.1 · 2.1 · 4.1</span></th><td>Identidad coherente y justificada (colores, tipografía, logo, eslogan); plan de marketing completo; publicaciones atractivas y coherentes.</td><td>Marca coherente y plan completo con algún fallo.</td><td>Marca poco cuidada o plan incompleto.</td><td>Sin marca ni plan.</td></tr><tr><th>G. Pitch<span class="crit">4.1</span></th><td>Claro, convincente y en tiempo; demostración del prototipo; respondéis con seguridad al jurado.</td><td>Claro y ordenado, con algún fallo de tiempo o seguridad.</td><td>Desordenado, leído o fuera de tiempo.</td><td>No se presenta.</td></tr><tr><th>H. Seguridad y trabajo en equipo<span class="crit">2.2 · 3.1</span></th><td>Decálogo y señales completos y correctos; trabajas siempre con seguridad; cumples tu parte a tiempo y ayudas a resolver desacuerdos.</td><td>Decálogo correcto; trabajas con seguridad y colaboras.</td><td>Decálogo incompleto o algún descuido de seguridad; cumples solo parte de lo acordado.</td><td>No respetas las normas de seguridad o no cumples tu parte.</td></tr></tbody></table></div><p class="desc">Cada fila se puntúa de 1 a 4 y se multiplica por 2,5 para pasarla a nota sobre 10.</p>`},

  t3e0:{titulo:"Anexo 2. Rúbrica del póster", para:"tarea 4", html:`<div class="table-wrap"><table class="tbl rub"><thead><tr><th>Qué se valora</th><th>4 · Excelente</th><th>3 · Satisfactorio</th><th>2 · Mejorable</th><th>1 · Insuficiente</th></tr></thead><tbody><tr><th>Contenido<span class="crit">1.1</span></th><td>Todos los apartados están completos, detallados y bien organizados.</td><td>Todos los apartados están presentes y claros.</td><td>Algunos apartados están incompletos o poco claros.</td><td>Faltan varios apartados o la información es insuficiente.</td></tr><tr><th>Diseño visual<span class="crit">4.1</span></th><td>Atractivo, claro y bien organizado; facilita la comprensión.</td><td>Claro y organizado, aunque podría ser más atractivo.</td><td>Poco atractivo y sin unidad visual.</td><td>Confuso, desordenado y difícil de seguir.</td></tr><tr><th>Creatividad y originalidad<span class="crit">4.1</span></th><td>Muy creativo y original; destaca visualmente.</td><td>Creatividad y originalidad adecuadas.</td><td>Algún elemento creativo, pero en general poco original.</td><td>Sin creatividad ni originalidad.</td></tr><tr><th>Coherencia y rigor<span class="crit">1.1</span></th><td>Muy bien organizado, con información precisa y fuentes citadas.</td><td>Bien organizado y con cierta coherencia.</td><td>Poca coherencia o información imprecisa.</td><td>Sin coherencia o con información incorrecta.</td></tr><tr><th>Reflexión y análisis<span class="crit">1.1</span></th><td>Responde a todas las preguntas guía con un análisis profundo y detallado.</td><td>Responde a todas las preguntas guía con cierta profundidad.</td><td>Responde solo a parte de las preguntas o de forma superficial.</td><td>Reflexión superficial o inexistente.</td></tr><tr><th>Presentación oral (opcional)<span class="crit">4.1</span></th><td>Clara y persuasiva; demuestra que domina el tema.</td><td>Clara y muestra que comprende el tema.</td><td>Limitada o poco clara.</td><td>No realizada o muy deficiente.</t   t3e1:{titulo:"Anexo 3. Rúbrica de la torre de espaguetis", para:"tarea 8", html:`<div class="table-wrap"><table class="tbl rub"><thead><tr><th>Qué se valora</th><th>4 · Excelente</th><th>3 · Satisfactorio</th><th>2 · Mejorable</th><th>1 · Insuficiente</th></tr></thead><tbody><tr><th>Altura<span class="crit">3.1</span></th><td>La más alta y se mantiene estable.</td><td>Buena altura y cierta estabilidad.</td><td>Altura moderada, pero poco estable.</td><td>Baja y poco estable.</td></tr><tr><th>Estabilidad<span class="crit">3.1</span></th><td>Sólida y estable, sin problemas.</td><td>Estable, con algún problema menor.</td><td>Tiene problemas de estabilidad y se tambalea.</td><td>Inestable: se derrumba con facilidad.</td></tr><tr><th>Eficiencia<span class="crit">2.1</span></th><td>Usa el mínimo material para ser alta y estable.</td><td>Usa una cantidad adecuada de material.</td><td>Usa material de más; se podría optimizar.</td><td>Usa material en exceso sin pensar en la eficiencia.</td></tr><tr><th>Estética<span class="crit">2.1</span></th><td>Diseño creativo y llamativo, muy elegante.</td><td>Diseño cuidado y atractivo.</td><td>Diseño básico, poco estético.</td><td>Sin diseño; poco atractiva.</td></tr><tr><th>Carga máxima<span class="crit">3.1</span></th><td>Soporta mucha carga sin mostrar debilidad.</td><td>Soporta una carga moderada sin problemas.</td><td>Soporta poca carga sin caerse.</td><td>No soporta ninguna carga.</td></tr></tbody></table></div><p class="desc">Cada fila se puntúa de 1 a 4 y se multiplica por 2,5 para pasarla a nota sobre 10.</p>`},
  t3e2:{titulo:"Anexo 4. Rúbrica de la practicopedia", para:"tarea 12", html:`<div class="table-wrap"><table class="tbl rub"><thead><tr><th>Qué se valora</th><th>4 · Excelente</th><th>3 · Satisfactorio</th><th>2 · Mejorable</th><th>1 · Insuficiente</th></tr></thead><tbody><tr><th>Narración<span class="crit">4.1</span></th><td>Pronuncia con estupenda claridad, fluidez y buena entonación.</td><td>Pronuncia con claridad y fluidez, pero sin entonación.</td><td>Pronuncia con claridad, pero con bloqueos y pausas.</td><td>No pronuncia con claridad ni fluidez.</td></tr><tr><th>Elementos gráficos<span class="crit">4.1</span></th><td>Muchos dibujos, imágenes y símbolos de buena calidad y bien elegidos.</td><td>Bastantes dibujos y símbolos adecuados.</td><td>Pocos dibujos o poco adecuados o de baja calidad.</td><td>Dibujos mal elegidos o de muy baja calidad.</td></tr><tr><th>Dominio del contenido<span class="crit">4.1</span></th><td>Explica los cinco esfuerzos con claridad, ejemplos reales y sin errores.</td><td>Domina el tema, con alguna imprecisión.</td><td>Domina solo algunos esfuerzos.</td><td>No demuestra conocer el tema.</td></tr><tr><th>Seguimiento de las pautas<span class="crit">4.1</span></th><td>Sigue todas las pautas del guion y del formato.</td><td>Le falta alguna pauta menor.</td><td>Le falta una cuarta parte de las pautas.</td><td>No sigue la mayoría de las pautas.</td></tr><tr><th>Calidad técnica<span class="crit">4.1</span></th><td>Bien editado, con título y créditos; imagen y sonido de buena calidad; dura entre 1 y 1,5 minutos.</td><td>Editado con título y créditos; calidad aceptable.</td><td>Falta el título o los créditos, o la calidad dificulta seguirlo.</td><td>Sin editar o no se entiende.</td></tr></tbody></table></div><p class="desc">Cada fila se puntúa de 1 a 4 y se multiplica por 2,5 para pasarla a nota sobre 10.</p>`},
  t3e3:{titulo:"Anexo 5. Rúbrica del puente 3E", para:"tarea 15", html:`<div class="table-wrap"><table class="tbl rub"><thead><tr><th>Qué se valora</th><th>4 · Excelente</th><th>3 · Satisfactorio</th><th>2 · Mejorable</th><th>1 · Insuficiente</th></tr></thead><tbody><tr><th>Diseño y planificación<span class="crit">2.1 · 2.2</span></th><td>Bocetos con medidas, estructura justificada (dónde hay tracción y compresión) y planificación de tareas, responsables y plazos.</td><td>Bocetos y planificación completos con algún hueco.</td><td>Bocetos sin medidas o planificación incompleta.</td><td>Sin diseño ni planificación.</td></tr><tr><th>Construcción<span class="crit">3.1</span></th><td>Perfiles bien hechos, uniones limpias y triangulación correcta; respeta los materiales y las normas de seguridad.</td><td>Construcción correcta con algún defecto de acabado.</td><td>Construcción descuidada o que no respeta algún material o norma.</td><td>Construcción muy deficiente.</td></tr><tr><th>Eficiencia<span class="crit">3.1</span></th><td>Entre las eficiencias más bajas (mejores) de la clase.</td><td>Eficiencia buena.</td><td>Eficiencia mejorable.</td><td>El puente apenas soporta su propio peso.</td></tr><tr><th>Estética<span class="crit">2.1</span></th><td>Diseño elegante, original y muy bien acabado.</td><td>Diseño cuidado y atractivo.</td><td>Diseño básico.</td><td>Sin cuidado estético.</td></tr><tr><th>Documentación<span class="crit">4.1</span></th><td>Todo el proceso documentado en el diario con fotos, vídeo, datos de la prueba y conclusiones.</td><td>Proceso documentado con algún hueco.</td><td>Documentación incompleta.</td><td>Sin documentación.</td></tr></tbody></table></div><p class="desc">Cada fila se puntúa de 1 a 4 y se multiplica por 2,5 para pasarla a nota sobre 10.</p>`},
  t3e4:{titulo:"Anexo 6. Rúbrica del diario de aprendizaje", para:"todo el proyecto", html:`<div class="table-wrap"><table class="tbl rub"><thead><tr><th>Qué se valora</th><th>4 · Excelente</th><th>3 · Satisfactorio</th><th>2 · Mejorable</th><th>1 · Insuficiente</th></tr></thead><tbody><tr><th>Contenido<span class="crit">1.2</span></th><td>Completo y relevante; muestra una comprensión profunda, con detalles y ejemplos.</td><td>Adecuado; cubre lo principal, aunque algún detalle podría ser más claro.</td><td>Básico; faltan aspectos importantes.</td><td>Escaso o confuso; no aborda lo esencial.</td></tr><tr><th>Redacción<span class="crit">4.1</span></th><td>Clara, concisa y con vocabulario técnico adecuado; sin errores.</td><td>Comprensible, con algunas frases mejorables.</td><td>Confusa a veces o con errores gramaticales.</td><td>Difícil de entender o con muchos errores.</td></tr><tr><th>Evidencias<span class="crit">4.1</span></th><td>Fotos, vídeos y datos bien elegidos que respaldan lo que cuenta; fuentes citadas.</td><td>Evidencias pertinentes, algunas poco detalladas.</td><td>Pocas evidencias o fuentes sin citar.</td><td>Evidencias insuficientes o sin relación.</td></tr><tr><th>Reflexión<span class="crit">1.2</span></th><td>Reflexión profunda y crítica sobre lo aprendido, lo que funcionó y lo que mejorar.</td><td>Reflexión adecuada con algunos puntos de mejora.</td><td>Reflexión superficial.</td><td>Sin reflexión.</td></tr><tr><th>Organización y presentación<span class="crit">4.1</span></th><td>Muy bien organizado por tareas, ordenado y visualmente cuidado.</td><td>Organizado, con algún desorden.</td><td>Poco organizado.</td><td>Desordenado y difícil de seguir.</td></tr></tbody></table></div><p class="desc">Cada fila se puntúa de 1 a 4 y se multiplica por 2,5 para pasarla a nota sobre 10.</p>`},
  sa8a1:{titulo:"Anexo 1. Qué voy a valorar y cuánto cuenta", para:"todo el tema", html:`

  sa6a2:{titulo:"Anexo 2. Rúbrica del tema", para:"tareas 2 a 5", html:`

  sa5a3:{titulo:"Anexo 3. Ficha de análisis del videojuego", para:"tarea 2", html:`
    <p>Estas son las preguntas que tienes que responder. La plantilla en Word está en el canal de Teams de la materia.</p>
    <div class="ficha"><div class="ficha-sec"><h4>Ficha técnica</h4><ul><li>Nombre del videojuego</li><li>Web de acceso o plataforma (¿navegador, app?)</li><li>Creador: quién lo ha hecho (empresa, organismo público, ONG…)</li><li>Idioma disponible</li><li>Número de jugadores y duración aproximada</li><li>¿Se puede guardar la partida? ¿Tiene instrucciones?</li></ul></div><div class="ficha-sec"><h4>1. Objetivo educativo</h4><ul><li>¿Qué intenta enseñar o reforzar?</li><li>¿Qué valores transmite?</li><li>¿Los contenidos son correctos? ¿Has encontrado algún error o idea falsa?</li></ul></div><div class="ficha-sec"><h4>2. Historia y mundo del juego</h4><ul><li>¿Tiene historia o narrador? ¿Qué importancia tiene?</li><li>¿Dónde y cuándo transcurre? ¿Cómo es el entorno?</li></ul></div><div class="ficha-sec"><h4>3. Mecánicas y dinámicas</h4><ul><li>¿Qué acciones hace el jugador? (resolver puzles, gestionar recursos, responder preguntas…)</li><li>¿Cuál es la misión? ¿Qué hay que hacer para ganar?</li><li>¿Cómo te recompensa? (puntos, niveles, insignias…)</li><li>¿Cuánto puedes decidir o cambiar tú dentro del juego?</li></ul></div><div class="ficha-sec"><h4>4. Diseño y accesibilidad</h4><ul><li>¿Está bien diseñado? ¿Es intuitivo?</li><li>¿Es accesible para todos? (tamaño del texto, subtítulos, colores, idioma, dispositivos)</li><li>¿Para qué edad crees que está pensado?</li></ul></div><div class="ficha-sec"><h4>5. Bienestar y datos personales</h4><ul><li>¿Te pide registrarte o datos personales? ¿Cuáles?</li><li>¿Tiene publicidad, compras o enlaces a redes sociales?</li><li>¿Usa trucos para que juegues más tiempo? (recompensas diarias, rachas, avisos)</li><li>¿Crees que es un juego sano para usar a menudo? ¿Por qué?</li></ul></div><div class="ficha-sec"><h4>6. Motivación y entretenimiento</h4><ul><li>¿Ha sido divertido? ¿Motiva a seguir jugando? ¿Por qué?</li></ul></div><div class="ficha-sec"><h4>7. Puntos fuertes y puntos a mejorar</h4><ul><li>Al menos dos fortalezas del juego</li><li>Al menos dos aspectos mejorables</li></ul></div><div class="ficha-sec"><h4>8. Propuesta de mejora</h4><ul><li>Describe una mejora concreta: una nueva mecánica, un rediseño visual, una mejora de accesibilidad, una adaptación para otro nivel educativo…</li></ul></div></div>`},

        <tr><th>A. Historia<span class="crit">5.2</span></th><td>La historia se entiende, tiene inicio, nudo y desenlace y engancha.</td><td>Se entiende y tiene estructura, aunque algún momento flojea.</td><td>Cuesta seguirla o le falta alguna parte.</td><td>No se entiende la historia.</td></tr>
        <tr><th>B. Lenguaje cinematográfico<span class="crit">2.3</span></th><td>Usa variedad de planos y ángulos, elegidos con intención y bien encuadrados.</td><td>Usa varios tipos de plano, con algún encuadre mejorable.</td><td>Casi todo con el mismo plano o con encuadres descuidados.</td><td>No hay intención en los planos.</td></tr>
        <tr><th>C. Montaje<span class="crit">2.3</span></th><td>Ritmo ágil, cortes limpios, sin tomas sobrantes; transiciones con sentido.</td><td>Montaje correcto con algún corte o toma mejorable.</td><td>Ritmo lento o cortes bruscos que dificultan seguir la historia.</td><td>Tomas sin editar o desordenadas.</td></tr>
        <tr><th>D. Sonido<span class="crit">2.3</span></th><td>Diálogos claros, música y efectos que refuerzan la historia y volúmenes bien ajustados.</td><td>Se entiende todo, con algún desajuste de volumen.</td><td>Hay partes que no se oyen bien o la música tapa los diálogos.</td><td>El sonido impide seguir el corto.</td></tr>
        <tr><th>E. Títulos, créditos y derechos<span class="crit">4.1 · 2.5</span></th><td>Título y créditos completos; música e imágenes libres de derechos y citadas; el corto se comparte correctamente.</td><td>Créditos completos con algún fallo en las citas.</td><td>Créditos incompletos o material sin citar.</td><td>Sin créditos o con material protegido sin permiso.</td></tr>
        <tr><th>F. Trabajo en equipo<span class="crit">3.6 · 5.3</span></th><td>Cumples tu rol a tiempo, aportas ideas y ayudas a resolver los desacuerdos dialogando.</td><td>Cumples tu rol y colaboras cuando se te pide.</td><td>Cumples solo parte de tu rol.</td><td>No cumples tu rol o dificultas el trabajo del grupo.</td></tr>
      </tbody>
    </table></div>
    <p class="desc">Cada fila se puntúa de 1 a 4. La nota es la media de las filas multiplicada por 2,5.</p>
    <p class="desc"><b>Importante:</b> si el corto incluye vídeo, voces o narraciones generadas con IA, no se puede evaluar y habrá que rehacerlo en clase.</p>`},
  sa3a1:{titulo:"Anexo 1. Qué voy a valorar y cuánto cuenta", para:"todo el tema", html:`

  sa3a2:{titulo:"Anexo 2. Rúbrica de la sesión de seguridad digital", para:"tareas 4, 5, 6 y 7", html:`
    <p>Con esta rúbrica te valoro yo, te valoran tus compañeros en el ensayo y te valoras tú en la reflexión final. Léela antes de preparar tu sesión: te dice exactamente qué hace falta para llegar a cada nivel.</p>
    <div class="table-wrap"><table class="tbl rub">
      <thead><tr><th>Qué se valora</th><th>4 · Excelente</th><th>3 · Bien</th><th>2 · Mejorable</th><th>1 · Insuficiente</th></tr></thead>
      <tbody>
        <tr><th>A. Dominio de los conceptos<span class="crit">3.1 · 3.2 · 3.4</span></th><td>Explicas todos los conceptos de tu mundo sin errores, con ejemplos propios, y respondes con seguridad a las preguntas.</td><td>Explicas los conceptos correctamente, aunque con pocos ejemplos o alguna duda al responder.</td><td>Faltan conceptos importantes o hay algún error.</td><td>Hay errores graves o no se entiende qué se quiere enseñar.</td></tr>
        <tr><th>B. Adaptación al público<span class="crit">2.5</span></th><td>El lenguaje, los ejemplos y la dinámica están pensados para alumnos de 11 años y consiguen que participen.</td><td>La sesión se entiende y es adecuada, aunque algún momento resulta difícil o poco participativo.</td><td>Hay partes demasiado técnicas o largas y cuesta mantener su atención.</td><td>La sesión no está adaptada a 6.º de Primaria.</td></tr>
        <tr><th>C. Guion y presentación<span class="crit">4.1</span></th><td>El guion tiene sus cinco partes. La presentación es clara y atractiva, con poco texto e imágenes con licencia libre o citadas.</td><td>El guion está completo y la presentación es clara, con algún fallo de diseño o de citas.</td><td>Falta alguna parte del guion o la presentación tiene demasiado texto o imágenes sin citar.</td><td>No hay guion o la presentación no sirve de apoyo.</td></tr>
        <tr><th>D. Situaciones reales y espíritu crítico<span class="crit">4.4</span></th><td>Usas casos reales o creíbles (mensajes, perfiles, noticias) y enseñas a analizarlos paso a paso.</td><td>Usas ejemplos realistas, pero sin enseñar del todo a analizarlos.</td><td>Los ejemplos son poco realistas o muy generales.</td><td>No hay ejemplos.</td></tr>
        <tr><th>E. Actitud con 6.º<span class="crit">3.3</span></th><td>Tratas al alumnado con respeto y paciencia, animas a participar, ayudas mientras juegan y transmites el mensaje de pedir ayuda.</td><td>Trato respetuoso y ayudas cuando te lo piden.</td><td>Ayudas poco o hay momentos de impaciencia.</td><td>Trato poco respetuoso o desinterés.</td></tr>
        <tr><th>F. Trabajo en equipo y responsabilidad<span class="crit">3.6 · 5.3</span></th><td>Cumples tu parte a tiempo, aportas ideas, escuchas y ayudas a resolver los desacuerdos dialogando.</td><td>Cumples tu parte y colaboras cuando se te pide.</td><td>Cumples solo parte de lo acordado o colaboras poco.</td><td>No cumples tu parte o dificultas el trabajo del grupo.</td></tr>
      </tbody>
    </table></div>
    <p class="desc">Cada fila se puntúa de 1 a 4. La nota de cada evidencia es la media de sus filas multiplicada por 2,5 (un 4 equivale a 10; un 2, a 5).</p>`},
  anexo1:{titulo:"Anexo 1. Rúbrica de la infografía", para:"Tarea 2", html:`
    <div class="table-wrap"><table class="tbl rub">
      <thead><tr><th>Categoría</th><th>4 · Excelente</th><th>3 · Satisfactorio</th><th>2 · Mejorable</th><th>1 · Insuficiente</th></tr></thead>
      <tbody>
        <tr><th>Estructura</th><td>Estructura muy clara. Están los cinco elementos de una infografía (titular, texto, cuerpo, fuente y crédito) y se respetan siempre sus características.</td><td>Estructura clara. Están los cinco elementos, pero no siempre se respetan sus características.</td><td>Estructura bastante clara, pero faltan uno o dos elementos y no siempre se respetan sus características.</td><td>Estructura poco clara. Solo hay uno o dos elementos y, en general, no se respetan sus características.</td></tr>
        <tr><th>Diseño</th><td>Elementos organizados de forma perfecta, colores muy armónicos y tipografía legible y muy apropiada.</td><td>Elementos organizados de forma adecuada, colores armónicos y tipografía legible y apropiada.</td><td>No todos los elementos están bien organizados, los colores no son lo bastante armónicos y/o la tipografía no es la apropiada.</td><td>No se ha cuidado la organización, los colores no son armónicos y la tipografía no es adecuada.</td></tr>
        <tr><th>Texto</th><td>Ideas expresadas con total claridad, sin errores gramaticales ni ortográficos.</td><td>Ideas expresadas con total claridad, pero con algún error.</td><td>Ideas poco claras y/o dos o tres errores.</td><td>Ideas sin claridad y/o más de tres errores.</td></tr>
        <tr><th>Imágenes</th><td>Todas tienen licencia CC, dimensiones perfectas y apoyan con total claridad el mensaje.</td><td>Todas tienen licencia CC, dimensiones adecuadas y apoyan con claridad el mensaje.</td><td>No todas tienen licencia CC; alguna no tiene las dimensiones adecuadas y/o no apoya bien el mensaje.</td><td>La mayoría no tienen licencia CC, ni dimensiones adecuadas, ni encajan con el mensaje.</td></tr>
        <tr><th>Herramientas TIC</th><td>Se han explorado todas las posibilidades de la herramienta; el trabajo se ha guardado, exportado a PDF y entregado por Teams.</td><td>Se ha explorado bien la herramienta; el trabajo se ha guardado, exportado a PDF y entregado por Teams.</td><td>Se ha explorado poco la herramienta; se ha guardado pero no se ha exportado a PDF para entregarlo por Teams.</td><td>No se ha explorado la herramienta; se ha guardado pero ni se ha exportado a PDF ni se ha entregado por Teams.</td></tr>
      </tbody></table></div>`},
